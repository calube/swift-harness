# The harness gates itself. `plugin/gate` is a SwiftPM tool package, not an app: its modules are
# libraries, and its fixtures and the example app are gated by their own configs.
schema = 1
xcode = "26.2"
app_scheme = "swiftgate"
packages = ["plugin/gate"]
exclude = ["plugin/gate/Fixtures", "examples"]

[simulator]
device = "iPhone 17"
os = "26.2"

[[modules]]
name = "SwiftGateDomain"
kind = "library"
reason = "pure gate domain model; no reducers"

[[modules]]
name = "SwiftGateRules"
kind = "library"
reason = "SwiftSyntax rule engine; no reducers"

[[modules]]
name = "SwiftGateAdapters"
kind = "library"
reason = "process, git and file-system adapters behind protocols; no reducers"

[[modules]]
name = "SwiftGateTestSupport"
kind = "test-support"
reason = "test doubles shared by the gate's own tests"

[docs]
managed_files = ["docs/index.md", "AGENTS.md"]
# Plans, handoffs, agent prompts and skills are working files for agents, not reader docs: prose
# and word budgets skip them, while links, ids and router reachability still cover them.
prose_exclude = [
  "docs/plans/**", "docs/handoffs/**", "plugin/agents/**", "plugin/skills/**",
]

[[docs.banned_phrases]]
phrase = "leverage"
reason = "vague business jargon; say what changed"

[[docs.banned_phrases]]
phrase = "utilize"
reason = "plain word is \"use\""

# Long reference docs keep a budget near their current size, so they can't keep growing unnoticed.
[docs.budgets.files]
"plugin/docs/standards.md" = 5600
"plugin/docs/testing-playbook.md" = 7100
"docs/e2e-report.md" = 1900
"plugin/docs/hooks.md" = 1050
"docs/adrs/0001-review-severity-for-standards-violations.md" = 1750
"docs/adrs/0002-consumer-plugin-in-plugin-dir.md" = 1050
