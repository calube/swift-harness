schema = 1
xcode = "26.2"
app_scheme = "SampleApp"
packages = ["Packages/*"]

[simulator]
device = "iPhone 17"
os = "26.2"

[[flows]]
name = "counter"
reason = "the one end-to-end path: launch, count, fetch a fact through the live API client"

[[scenarios]]
name = "live"
reason = "the shipping dependencies, so a flow runs against the real fact API"

[[scenarios]]
name = "fixed-fact"
reason = "the API client returns 1 fixed fact, so the counter flow needs no network"

[clients]
vendor_modules = []

[[modules]]
name = "GameEngine"
kind = "engine"
reason = "tic-tac-toe rules as a pure (State, Input) -> State step with a seeded RNG; a reducer adds ceremony only"

[[modules]]
name = "AccessibilityIDs"
kind = "library"
reason = "one String-backed enum of identifiers shared by the views and the UI tests; no state, no reducer"

[qa]
accessibility_ids = "Packages/AccessibilityIDs/Sources/AccessibilityIDs/AccessibilityID.swift"
