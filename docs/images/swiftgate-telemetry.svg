  <rect class="p-pass" x="1124" y="547" width="42" height="14" rx="7"/><text class="pill pass" x="1145" y="557">PASS</text>
  <rect class="row" x="902" y="568" width="270" height="20" rx="4"/><text class="bl mono" x="910" y="582">R2 flow  ▶ video</text>
