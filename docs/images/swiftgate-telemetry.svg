  <rect class="bqa" x="306" y="612" width="120" height="18" rx="3"/><text class="bl" x="312" y="625">validation</text>
  <rect class="bg" x="292" y="634" width="18" height="18" rx="3"/>
  <rect class="bg" x="314" y="634" width="14" height="18" rx="3"/>
  <rect class="bred" x="398" y="634" width="14" height="18" rx="3"/>
  <rect class="bg" x="420" y="634" width="20" height="18" rx="3"/>
  <rect class="bg" x="462" y="634" width="30" height="18" rx="3"/>
  <rect class="bok" x="470" y="656" width="10" height="18" rx="3"/>
  <rect class="bok" x="484" y="656" width="10" height="18" rx="3"/>
  <rect class="bok" x="498" y="656" width="10" height="18" rx="3"/>
  <text class="sub" x="70" y="648">gates</text>
  <text class="sub" x="70" y="670">qa flows</text>
  <text class="sub" x="70" y="692">RED spans say why they failed</text>
  <text class="sub mono" x="70" y="724">0</text><text class="sub mono center" x="180" y="724">10</text><text class="sub mono center" x="290" y="724">20</text><text class="sub mono center" x="400" y="724">30</text><text class="sub mono" x="482" y="724">40 min</text>

  <!-- board -->
  <rect class="pane" x="536" y="516" width="340" height="220" rx="10"/>
  <text class="plabel" x="550" y="536">BOARD · KANBAN</text>
  <rect class="col" x="550" y="546" width="50" height="132" rx="6"/><text class="kh" x="575" y="560">QUEUED</text>
