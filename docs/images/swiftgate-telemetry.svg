  <rect class="kc" x="771" y="598" width="40" height="26" rx="4"/><rect class="kc-green" x="771" y="598" width="40" height="3"/>
  <rect class="kc" x="771" y="628" width="40" height="26" rx="4"/><rect class="kc-green" x="771" y="628" width="40" height="3"/>
  <rect class="kc" x="825" y="568" width="40" height="26" rx="4"/><rect class="kc-red" x="825" y="568" width="40" height="3"/>
  <text class="sub" x="550" y="712" style="font-size:10.5px">cards move on the 1 s poll</text>

