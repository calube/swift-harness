  <rect class="col" x="766" y="546" width="50" height="132" rx="6"/><text class="kh" x="791" y="560">MERGED</text>
  <rect class="col" x="820" y="546" width="50" height="132" rx="6"/><text class="kh" x="845" y="560">BLOCKED</text>
