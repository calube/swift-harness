<svg class="tm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 770" width="1240" height="770" role="img" aria-labelledby="tm-title tm-desc">
  <title id="tm-title">Telemetry and the run dashboard</title>
  <desc id="tm-desc">Hooks, gates, the build loop, agents, QA and the judge write typed JSON-line events to a local event store. The run view joins those events with the plan ledger and run.json. swiftgate view serves it live, polling every second, and report --html writes an offline copy. The dashboard has a timeline of nested spans drawn as a flame graph, a kanban board of tasks, validation rows with video, and token and cost bars by role.</desc>
  <style>
    .tm { --panel:#FBFAF8; --card:#FFFFFF; --stroke:#DADDE4; --ink:#1B1F2A; --muted:#5B6272; --line:#9097A6; --frame:#B4BAC6; --sunk:#F1F2F5; --bar:#C9CEDA; --bar-2:#AEB5C4; --accent:#E5512B; --accent-ink:#B83A18; --accent-soft:#FDECE6; --jev:#5B4FD6; --jev-soft:#ECEAFD; --green:#1E8E4E; --green-soft:#E3F4EA; --red:#C93434; --red-soft:#FBE7E7; --amber:#A86A00; --amber-soft:#FBF0DA; }
    @media (prefers-color-scheme: dark) {
      .tm { --panel:#10131A; --card:#181D27; --stroke:#2B3240; --ink:#E8EBF1; --muted:#9AA2B3; --line:#687184; --frame:#394152; --sunk:#141821; --bar:#343C4B; --bar-2:#465063; --accent:#FF6B3F; --accent-ink:#FF8A63; --accent-soft:#2B1912; --jev:#9D95FF; --jev-soft:#1E1B3A; --green:#43C77B; --green-soft:#12271B; --red:#FF6E6E; --red-soft:#2C1517; --amber:#F2B44A; --amber-soft:#2A2110; }
    }
    .tm .panel { fill: var(--panel); }
    .tm .card { fill: var(--card); stroke: var(--stroke); stroke-width: 1.5; }
    .tm .store { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
    .tm .store-top { fill: var(--card); stroke: var(--accent); stroke-width: 2.5; }
    .tm .small { fill: var(--card); stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .tm .view { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
    .tm .out { fill: var(--card); stroke: var(--accent); stroke-width: 1.8; }
    .tm .wire { fill: none; stroke: var(--line); stroke-width: 1.8; }
    .tm .wire-hot { fill: none; stroke: var(--accent); stroke-width: 2; }
    .tm .head { fill: var(--line); }
    .tm .head-hot { fill: var(--accent); }
    .tm .browser { fill: var(--card); stroke: var(--stroke); stroke-width: 1.5; }
    .tm .chrome { fill: var(--sunk); }
    .tm .dot { fill: var(--bar-2); }
    .tm .pane { fill: var(--sunk); }
    .tm .tabline { stroke: var(--stroke); stroke-width: 1; }
    .tm .tab-on { stroke: var(--accent); stroke-width: 2.5; }
    .tm .b0 { fill: var(--bar-2); }
    .tm .b1 { fill: var(--bar); }
    .tm .bt { fill: var(--jev-soft); stroke: var(--jev); stroke-width: 1; }
    .tm .bg { fill: var(--accent); }
    .tm .bred { fill: var(--red); }
    .tm .bqa { fill: var(--green-soft); stroke: var(--green); stroke-width: 1; }
    .tm .bok { fill: var(--green); }
    .tm .col { fill: var(--card); stroke: var(--stroke); stroke-width: 1; }
    .tm .kc { fill: var(--card); stroke: var(--stroke); stroke-width: 1; }
    .tm .kc-top { fill: var(--jev); }
    .tm .kc-green { fill: var(--green); }
    .tm .kc-red { fill: var(--red); }
    .tm .kc-amber { fill: var(--amber); }
    .tm .row { fill: var(--card); stroke: var(--stroke); stroke-width: 1; }
    .tm .p-pass { fill: var(--green-soft); stroke: var(--green); stroke-width: 1; }
    .tm .p-red { fill: var(--red-soft); stroke: var(--red); stroke-width: 1; }
    .tm .p-wait { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1; }
    .tm .tok { fill: var(--accent); fill-opacity: .8; }
    .tm text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .tm .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .tm .title { font-size: 15px; font-weight: 650; }
    .tm .big { font-size: 19px; font-weight: 700; }
    .tm .sub { font-size: 11.5px; fill: var(--muted); }
    .tm .ink { font-size: 12px; fill: var(--ink); }
    .tm .label { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; fill: var(--muted); }
    .tm .plabel { font-size: 10px; font-weight: 700; letter-spacing: .12em; fill: var(--muted); }
    .tm .tab { font-size: 11.5px; fill: var(--muted); }
    .tm .tab-active { font-size: 11.5px; font-weight: 700; fill: var(--ink); }
    .tm .bl { font-size: 9.5px; fill: var(--ink); }
    .tm .bl-on { font-size: 9.5px; fill: var(--card); font-weight: 600; }
    .tm .kh { font-size: 8.5px; font-weight: 700; letter-spacing: .06em; fill: var(--muted); text-anchor: middle; }
    .tm .pill { font-size: 9.5px; font-weight: 700; text-anchor: middle; }
    .tm .pass { fill: var(--green); } .tm .redt { fill: var(--red); } .tm .wait { fill: var(--amber); }
    .tm .hot { fill: var(--accent-ink); }
    .tm .center { text-anchor: middle; }
  </style>
  <defs>
    <marker id="tm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="tm-a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-hot" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="panel" x="0" y="0" width="1240" height="770" rx="20"/>

  <!-- writers -->
  <text class="label" x="40" y="44">WHAT WRITES EVENTS</text>
  <rect class="card" x="40" y="60" width="320" height="48" rx="10"/>
  <text class="title" x="56" y="80">Hooks</text><text class="sub mono" x="56" y="98">hook.decision on every tool call</text>
  <rect class="card" x="40" y="116" width="320" height="48" rx="10"/>
  <text class="title" x="56" y="136">Gates</text><text class="sub mono" x="56" y="154">gate.run · gate.step · test · prove</text>
  <rect class="card" x="40" y="172" width="320" height="48" rx="10"/>
  <text class="title" x="56" y="192">Build loop</text><text class="sub mono" x="56" y="210">span start/end · halt · return-checked</text>
  <rect class="card" x="40" y="228" width="320" height="48" rx="10"/>
  <text class="title" x="56" y="248">Agents</text><text class="sub mono" x="56" y="266">tokens · cost · tools, never text</text>
  <rect class="card" x="40" y="284" width="320" height="48" rx="10"/>
  <text class="title" x="56" y="304">QA</text><text class="sub mono" x="56" y="322">qa.check · qa.flow · qa.setup · repair</text>
  <rect class="card" x="40" y="340" width="320" height="48" rx="10"/>
  <text class="title" x="56" y="360">Judge</text><text class="sub mono" x="56" y="378">judge.call · judge.decision</text>

  <path class="wire" d="M360,84 C400,84 396,200 428,206" marker-end="url(#tm-a)"/>
  <path class="wire" d="M360,140 C396,140 398,212 428,214" marker-end="url(#tm-a)"/>
  <path class="wire" d="M360,196 C392,196 400,222 428,222" marker-end="url(#tm-a)"/>
  <path class="wire" d="M360,252 C392,252 400,232 428,230" marker-end="url(#tm-a)"/>
  <path class="wire" d="M360,308 C396,308 398,240 428,238" marker-end="url(#tm-a)"/>
  <path class="wire" d="M360,364 C400,364 396,250 428,246" marker-end="url(#tm-a)"/>

  <!-- event store -->
  <path class="store" d="M430,96 L430,330 A130,18 0 0 0 690,330 L690,96"/>
  <ellipse class="store-top" cx="560" cy="96" rx="130" ry="18"/>
  <text class="big center" x="560" y="146">Event store</text>
  <text class="ink mono center" x="560" y="174">.harness/events/</text>
  <text class="ink mono center" x="560" y="192">&lt;stream&gt;.jsonl</text>
  <text class="sub center" x="560" y="222">10 streams of typed JSON lines</text>
  <text class="sub center" x="560" y="242">local only, on by default</text>
  <text class="sub center" x="560" y="262">never gates a verdict</text>
  <text class="sub center" x="560" y="282">sealed past 4 MiB, never deleted</text>

  <rect class="small" x="754" y="96" width="100" height="36" rx="8"/>
  <text class="ink mono center" x="804" y="119">plan ledger</text>
  <rect class="small" x="868" y="96" width="100" height="36" rx="8"/>
  <text class="ink mono center" x="918" y="119">run.json</text>
  <path class="wire" d="M804,132 L804,178" marker-end="url(#tm-a)"/>
  <path class="wire" d="M918,132 L918,178" marker-end="url(#tm-a)"/>

  <!-- run view -->
  <path class="wire-hot" d="M690,200 C720,200 724,214 752,214" marker-end="url(#tm-a-hot)"/>

  <rect class="view" x="754" y="180" width="214" height="110" rx="12"/>
  <text class="big" x="774" y="212">Run view</text>
  <text class="ink mono" x="774" y="238">view.json</text>
  <text class="sub" x="774" y="258">events + ledger, joined</text>
  <text class="sub" x="774" y="276">no source, no prompts</text>

  <path class="wire" d="M690,300 C720,330 730,346 752,346" marker-end="url(#tm-a)"/>
  <rect class="card" x="754" y="318" width="214" height="80" rx="12"/>
  <text class="title mono" x="774" y="344">events summary</text>
  <text class="sub" x="774" y="366">slow gates · flaky tests</text>
  <text class="sub" x="774" y="384">cost · halt waits</text>

  <!-- outputs -->
  <path class="wire-hot" d="M968,214 C1000,214 996,140 1024,140" marker-end="url(#tm-a-hot)"/>
  <path class="wire-hot" d="M968,256 C1000,256 996,282 1024,282" marker-end="url(#tm-a-hot)"/>
  <rect class="out" x="1026" y="90" width="174" height="104" rx="12"/>
  <text class="title mono hot" x="1044" y="118">swiftgate view</text>
  <text class="ink" x="1044" y="142">live on 127.0.0.1</text>
  <text class="sub" x="1044" y="162">polls every 1 s</text>
  <text class="sub" x="1044" y="180">"now" strip, stall badges</text>
  <rect class="out" x="1026" y="232" width="174" height="104" rx="12"/>
  <text class="title mono hot" x="1044" y="260">report --html</text>
  <text class="ink" x="1044" y="284">the same page, offline</text>
  <text class="sub" x="1044" y="304">self-contained folder</text>
  <text class="sub" x="1044" y="322">flow videos included</text>

  <path class="wire-hot" d="M1113,336 L1113,440" marker-end="url(#tm-a-hot)"/>

