  <text class="tab" x="60" y="494">Overview</text>
  <text class="tab-active" x="132" y="494">Timeline</text>
  <text class="tab-active" x="204" y="494">Board</text>
  <text class="tab" x="256" y="494">Graph</text>
  <text class="tab" x="308" y="494">Spec</text>
  <text class="tab" x="352" y="494">Gates</text>
  <text class="tab-active" x="404" y="494">Tokens</text>
  <text class="tab-active" x="464" y="494">Validation</text>
  <line class="tabline" x1="40" y1="504" x2="1200" y2="504"/>
  <line class="tab-on" x1="132" y1="504" x2="186" y2="504"/>
  <line class="tab-on" x1="204" y1="504" x2="240" y2="504"/>
  <line class="tab-on" x1="404" y1="504" x2="448" y2="504"/>
  <line class="tab-on" x1="464" y1="504" x2="530" y2="504"/>

