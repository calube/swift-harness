  <text class="plabel" x="70" y="536">TIMELINE · NESTED SPANS</text>
  <rect class="b0" x="70" y="546" width="440" height="18" rx="3"/><text class="bl-on" x="76" y="559">run</text>
  <rect class="b1" x="70" y="568" width="22" height="18" rx="3"/>
  <rect class="b1" x="93" y="568" width="65" height="18" rx="3"/><text class="bl" x="99" y="581">plan</text>
  <rect class="b1" x="159" y="568" width="43" height="18" rx="3"/><text class="bl" x="163" y="581">contract</text>
