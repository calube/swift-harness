<svg class="bv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1200" width="1240" height="1200" role="img" aria-labelledby="bv-title bv-desc">
  <title id="bv-title">Brownfield run, end to end</title>
  <desc id="bv-desc">swiftgate run takes one spec.md and, with no human input, discovers the repository's own commands, warms builds, explores, writes PLAN.md, lands a contract commit, builds tasks in parallel worktrees behind slice gates with prove, routes review by diff risk, merges behind a merge gate while QA rows run, and finishes with a final gate, simulator QA on video and a report.</desc>
  <style>
    .bv { --panel:#FBFAF8; --card:#FFFFFF; --stroke:#D3D7DF; --ink:#1B1F2A; --muted:#5B6272; --line:#8E95A4; --frame:#B4BAC6; --rule:#E3E5EA; --plan:#4C45C9; --plan-soft:#ECEAFD; --gate:#A86A00; --gate-soft:#FBF0DA; --green:#1E8E4E; --green-soft:#E3F4EA; --accent:#E5512B; --accent-ink:#B83A18; --accent-soft:#FDECE6; --red:#C93434; }
    @media (prefers-color-scheme: dark) {
      .bv { --panel:#121417; --card:#191C21; --stroke:#363B45; --ink:#E8EBF1; --muted:#9AA2B3; --line:#7A8292; --frame:#454C58; --rule:#2A2F38; --plan:#9D95FF; --plan-soft:#1E1D3B; --gate:#E6A93D; --gate-soft:#2A2214; --green:#43C77B; --green-soft:#13261B; --accent:#FF6B3F; --accent-ink:#FF8A63; --accent-soft:#2B1912; --red:#FF6E6E; }
    }
    .bv .panel { fill: var(--panel); }
    .bv .box { fill: var(--card); stroke: var(--stroke); stroke-width: 1.5; }
    .bv .pill { fill: var(--card); stroke: var(--ink); stroke-width: 1.5; }
    .bv .plan { fill: var(--plan-soft); stroke: var(--plan); stroke-width: 2; }
    .bv .gate { fill: var(--gate-soft); stroke: var(--gate); stroke-width: 2; }
    .bv .qa { fill: var(--green-soft); stroke: var(--green); stroke-width: 2; }
    .bv .risk { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .bv .final { fill: var(--card); stroke: var(--frame); stroke-width: 1.8; stroke-dasharray: 7 5; }
    .bv .warm { fill: none; stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .bv .wire { fill: none; stroke: var(--line); stroke-width: 1.8; }
    .bv .wire-qa { fill: none; stroke: var(--green); stroke-width: 1.8; }
    .bv .head { fill: var(--line); }
    .bv .head-qa { fill: var(--green); }
    .bv .rule { stroke: var(--rule); stroke-width: 1; }
    .bv text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bv .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .bv .c { text-anchor: middle; }
    .bv .h { font-size: 16px; font-weight: 700; }
    .bv .hm { font-size: 16px; font-weight: 700; font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .bv .s { font-size: 12.5px; fill: var(--muted); }
    .bv .side { font-size: 12.5px; fill: var(--muted); }
    .bv .plan-ink { fill: var(--plan); }
    .bv .gate-ink { fill: var(--gate); }
    .bv .qa-ink { fill: var(--green); }
    .bv .risk-ink { fill: var(--accent-ink); }
    .bv .red { fill: var(--red); }
    .bv .heading { font-size: 26px; font-weight: 700; }
    .bv .kicker { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; fill: var(--muted); }
    .bv .n { font-size: 13px; fill: var(--muted); }
    .bv .nt { font-size: 14.5px; font-weight: 700; }
    .bv .nb { font-size: 13.5px; fill: var(--muted); }
    .bv .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; fill: var(--ink); font-size: 12.5px; }
  </style>
  <defs>
    <marker id="bv-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="bv-a-qa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-qa" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="panel" x="0" y="0" width="1240" height="1200" rx="20"/>
  <text class="kicker" x="40" y="44">SWIFTGATE RUN · BROWNFIELD PROFILE</text>
  <text class="heading" x="40" y="78">End-to-end flow</text>
  <line class="rule" x1="40" y1="98" x2="1200" y2="98"/>

  <!-- ===== flow column, centre x=290 ===== -->
  <rect class="pill" x="200" y="124" width="180" height="44" rx="22"/>
  <text class="hm c" x="290" y="152">spec.md</text>
  <text class="side" x="396" y="151">clock starts · 40 min box</text>
  <path class="wire" d="M290,168 L290,190" marker-end="url(#bv-a)"/>

  <rect class="box" x="90" y="192" width="400" height="62" rx="8"/>
  <text class="hm c" x="290" y="219">swiftgate discover</text>
  <text class="s c" x="290" y="241">areas · the repo's own commands · no network</text>

  <!-- warm-up rail -->
  <path class="warm" d="M490,223 L528,223 L528,690"/>
  <text class="side" x="536" y="300" transform="rotate(90 536 300)">warm-up: generate, build, test at base</text>
  <path class="wire" d="M528,690 L528,712 L498,712" marker-end="url(#bv-a)" style="stroke-dasharray:4 5"/>

  <path class="wire" d="M290,254 L290,268 L180,268 L180,288" marker-end="url(#bv-a)"/>
  <path class="wire" d="M290,268 L400,268 L400,288" marker-end="url(#bv-a)"/>
  <rect class="box" x="90" y="290" width="180" height="76" rx="8"/>
  <text class="h c" x="180" y="314">Sonnet explorers</text>
  <text class="s c" x="180" y="334">1 per area, parallel</text>
  <text class="s c" x="180" y="352">3 min soft · 4 hard</text>
  <rect class="box" x="310" y="290" width="180" height="76" rx="8"/>
  <text class="h c" x="400" y="314">Opus reads</text>
  <text class="s c" x="400" y="334">small repo</text>
  <text class="s c" x="400" y="352">or 1 area</text>
  <path class="wire" d="M180,366 L180,382 L400,382 L400,366"/>
  <path class="wire" d="M290,382 L290,402" marker-end="url(#bv-a)"/>

  <rect class="plan" x="90" y="404" width="400" height="62" rx="8"/>
  <text class="hm c plan-ink" x="290" y="431">PLAN.md</text>
  <text class="s c" x="290" y="453">1 live file · about 8 min from spec.md</text>
  <path class="wire" d="M290,466 L290,486" marker-end="url(#bv-a)"/>

  <rect class="pill" x="190" y="488" width="200" height="44" rx="22"/>
  <text class="h c" x="290" y="516">executor starts</text>
  <path class="wire" d="M290,532 L290,552" marker-end="url(#bv-a)"/>

  <rect class="box" x="90" y="554" width="400" height="62" rx="8"/>
  <text class="h c" x="290" y="580">contract commit</text>
  <text class="s c" x="290" y="602">types · stubs · accessibility ids · no behavior</text>

  <!-- fan out to 3 workers + validation worker -->
  <path class="wire" d="M290,616 L290,630"/>
  <path class="wire" d="M100,630 L470,630"/>
  <path class="wire" d="M100,630 L100,648" marker-end="url(#bv-a)"/>
  <path class="wire" d="M225,630 L225,648" marker-end="url(#bv-a)"/>
  <path class="wire" d="M350,630 L350,648" marker-end="url(#bv-a)"/>
  <path class="wire-qa" d="M470,630 L470,648" marker-end="url(#bv-a-qa)"/>

  <rect class="box" x="44" y="650" width="112" height="56" rx="8"/>
  <text class="h c" x="100" y="673">worker A</text><text class="s c" x="100" y="693">own worktree</text>
  <rect class="box" x="169" y="650" width="112" height="56" rx="8"/>
  <text class="h c" x="225" y="673">worker B</text><text class="s c" x="225" y="693">own worktree</text>
  <rect class="box" x="294" y="650" width="112" height="56" rx="8"/>
  <text class="h c" x="350" y="673">worker C</text><text class="s c" x="350" y="693">own worktree</text>
  <rect class="qa" x="414" y="650" width="112" height="56" rx="8"/>
  <text class="h c qa-ink" x="470" y="673">validation</text><text class="s c" x="470" y="693">QA checks first</text>

  <path class="wire" d="M100,706 L100,724" marker-end="url(#bv-a)"/>
  <path class="wire" d="M225,706 L225,724" marker-end="url(#bv-a)"/>
  <path class="wire" d="M350,706 L350,724" marker-end="url(#bv-a)"/>
  <rect class="gate" x="44" y="726" width="112" height="56" rx="8"/>
  <text class="h c" x="100" y="749">slice gate</text><text class="s c" x="100" y="769">prove · ≤ 30 s</text>
  <rect class="gate" x="169" y="726" width="112" height="56" rx="8"/>
  <text class="h c" x="225" y="749">slice gate</text><text class="s c" x="225" y="769">prove · ≤ 30 s</text>
  <rect class="gate" x="294" y="726" width="112" height="56" rx="8"/>
  <text class="h c" x="350" y="749">slice gate</text><text class="s c" x="350" y="769">prove · ≤ 30 s</text>

  <path class="wire" d="M100,782 L100,796 L350,796 L350,782"/>
  <path class="wire" d="M225,782 L225,796"/>
  <path class="wire" d="M225,796 L225,814" marker-end="url(#bv-a)"/>
  <rect class="risk" x="44" y="816" width="362" height="62" rx="8"/>
  <text class="h c risk-ink" x="225" y="842">review by diff risk</text>
  <text class="s c" x="225" y="864">low: gate only · medium: +1 · high: full</text>
  <path class="wire" d="M225,878 L225,898" marker-end="url(#bv-a)"/>

  <rect class="gate" x="44" y="900" width="362" height="62" rx="8"/>
  <text class="h c" x="225" y="926">merge gate</text>
  <text class="s c" x="225" y="948">each merge · test, lint, build vs baseline</text>

  <path class="wire-qa" d="M470,706 L470,898" marker-end="url(#bv-a-qa)"/>
  <rect class="qa" x="414" y="900" width="112" height="62" rx="8"/>
  <text class="h c qa-ink" x="470" y="926">qa run</text>
  <text class="s c" x="470" y="948">as tasks merge</text>

  <path class="wire" d="M225,962 L225,976 L290,976 L290,990" marker-end="url(#bv-a)"/>
  <path class="wire-qa" d="M470,962 L470,976 L290,976"/>

  <rect class="final" x="90" y="992" width="400" height="76" rx="8"/>
  <text class="h c" x="290" y="1018">final</text>
  <text class="s c" x="290" y="1038">every area + UI and e2e · qa run --final, video</text>
  <text class="s c red" x="290" y="1056">RED → 1 fix task, final once more</text>
  <path class="wire" d="M290,1068 L290,1088" marker-end="url(#bv-a)"/>

  <rect class="pill" x="190" y="1090" width="200" height="44" rx="22"/>
  <text class="h c" x="290" y="1118">report</text>
  <text class="side" x="406" y="1117">plan branch · user's tree untouched</text>

  <!-- ===== numbered notes ===== -->
  <g transform="translate(640,0)">
    <text class="n mono" x="0" y="134">01</text>
    <text class="nt" x="36" y="134">spec.md.</text>
    <text class="nb" x="36" y="156">The only input: <tspan class="code">swiftgate run spec.md</tspan>. The time box</text>
    <text class="nb" x="36" y="176">starts here, 40 minutes by default.</text>
    <line class="rule" x1="0" y1="196" x2="560" y2="196"/>

    <text class="n mono" x="0" y="222">02</text>
    <text class="nt" x="36" y="222">Discover, then warm up.</text>
    <text class="nb" x="36" y="244">Tracked files only, no build, no network. It applies each area's own</text>
    <text class="nb" x="36" y="264">test, lint and build commands. A warm-up then builds and tests every</text>
    <text class="nb" x="36" y="284">area at the base, in parallel and never cancelled, so gates start warm.</text>
    <line class="rule" x1="0" y1="304" x2="560" y2="304"/>

    <text class="n mono" x="0" y="330">03</text>
    <text class="nt" x="36" y="330">Explorers or Opus reads.</text>
    <text class="nb" x="36" y="352">1 read-only Sonnet explorer per area, in parallel, each back in 300</text>
    <text class="nb" x="36" y="372">words or fewer. A small repo or 1 area: Opus reads it directly.</text>
    <line class="rule" x1="0" y1="392" x2="560" y2="392"/>

    <text class="n mono" x="0" y="418">04</text>
    <text class="nt" x="36" y="418">PLAN.md.</text>
    <text class="nb" x="36" y="440">1 live file in the git common dir. Every open question gets an answer,</text>
    <text class="nb" x="36" y="460">written down as an assumption, plus a validation row per requirement.</text>
    <line class="rule" x1="0" y1="480" x2="560" y2="480"/>

    <text class="n mono" x="0" y="506">05</text>
    <text class="nt" x="36" y="506">Executor starts.</text>
    <text class="nb" x="36" y="528">On its own. The user can read PLAN.md, edit it or stop the run,</text>
    <text class="nb" x="36" y="548">but is never asked anything.</text>
    <line class="rule" x1="0" y1="568" x2="560" y2="568"/>

    <text class="n mono" x="0" y="594">06</text>
    <text class="nt" x="36" y="594">Contract commit.</text>
    <text class="nb" x="36" y="616">Types and stubs that build in every touched area and change no</text>
    <text class="nb" x="36" y="636">behavior, plus every name a QA check drives, so checks can exist first.</text>
    <line class="rule" x1="0" y1="656" x2="560" y2="656"/>

    <text class="n mono" x="0" y="682">07</text>
    <text class="nt" x="36" y="682">Parallel workers.</text>
    <text class="nb" x="36" y="704">Up to 3, test-first, each in its own worktree with its own write set.</text>
    <text class="nb" x="36" y="724">A validation worker writes the QA checks before the code exists.</text>
    <line class="rule" x1="0" y1="744" x2="560" y2="744"/>

    <text class="n mono" x="0" y="770">08</text>
    <text class="nt" x="36" y="770">Slice gate with prove.</text>
    <text class="nb" x="36" y="792">Every changed test must fail with its change reverted. The gate</text>
    <text class="nb" x="36" y="812">aims for 30 seconds or less.</text>
    <line class="rule" x1="0" y1="832" x2="560" y2="832"/>

    <text class="n mono" x="0" y="858">09</text>
    <text class="nt" x="36" y="858">Review by diff risk.</text>
    <text class="nb" x="36" y="880">A classifier rates each task's diff. Low: the gate alone. Medium: 1</text>
    <text class="nb" x="36" y="900">extra reviewer. High: the full review. Sensitive paths are always high.</text>
    <line class="rule" x1="0" y1="920" x2="560" y2="920"/>

    <text class="n mono" x="0" y="946">10</text>
    <text class="nt" x="36" y="946">Merge gate and QA.</text>
    <text class="nb" x="36" y="968">Each merge: test, lint and build against the baseline. A QA row runs</text>
    <text class="nb" x="36" y="988">in a simulator as soon as its tasks have merged.</text>
    <line class="rule" x1="0" y1="1008" x2="560" y2="1008"/>

    <text class="n mono" x="0" y="1034">11</text>
    <text class="nt" x="36" y="1034">Final and report.</text>
    <text class="nb" x="36" y="1056">Every area, plus UI and e2e. Each flow is recorded on video. A RED</text>
    <text class="nb" x="36" y="1076">final gets 1 fix task and one more final. Everything lands on a plan</text>
    <text class="nb" x="36" y="1096">branch; the user's checkout is never touched.</text>
  </g>
</svg>
