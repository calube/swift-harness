<title>Run Viewer</title>
<style>
/* Layout: summary header, full-width flame timeline in its own scroller, then a 2-column grid of spec, proof, tokens and gates that stacks at phone width. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --sunken: #eef0f4;
  --line: #dde1e8;
  --fg: #11181c;
  --muted: #5d6673;
  --accent: #006fee;
  --accent-soft: #e6f1fe;
  --ok: #12a150;
  --ok-soft: #e8faf0;
  --warn: #c4841d;
  --warn-soft: #fefce8;
  --bad: #d31248;
  --bad-soft: #fee7ef;
  --bar-phase: #7c8a9e;
  --bar-task: #3b82f6;
  --bar-worker: #60a5fa;
  --bar-review: #8b9dc3;
  --bar-gate: #12a150;
  --bar-red: #d31248;
  --bar-merge: #11181c;
  --bar-text: #ffffff;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d10; --surface: #15181d; --sunken: #1d2128; --line: #2a2f38;
    --fg: #ecedee; --muted: #9aa3ae; --accent: #338ef7; --accent-soft: #10253e;
    --ok: #17c964; --ok-soft: #0e2a1b; --warn: #f5a524; --warn-soft: #2e2208;
    --bad: #f31260; --bad-soft: #3a0d1c;
    --bar-phase: #5b6676; --bar-task: #2f6fd6; --bar-worker: #4a8ae0; --bar-review: #6a7aa0;
    --bar-gate: #139a52; --bar-red: #d0104f; --bar-merge: #ecedee; --bar-text: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d10; --surface: #15181d; --sunken: #1d2128; --line: #2a2f38;
  --fg: #ecedee; --muted: #9aa3ae; --accent: #338ef7; --accent-soft: #10253e;
  --ok: #17c964; --ok-soft: #0e2a1b; --warn: #f5a524; --warn-soft: #2e2208;
  --bad: #f31260; --bad-soft: #3a0d1c;
  --bar-phase: #5b6676; --bar-task: #2f6fd6; --bar-worker: #4a8ae0; --bar-review: #6a7aa0;
  --bar-gate: #139a52; --bar-red: #d0104f; --bar-merge: #ecedee; --bar-text: #ffffff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.wrap > * { min-width: 0; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
h1 { font-size: 20px; margin: 0; font-weight: 600; text-wrap: balance; }
h2 { font-size: 12px; margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.panel > *, .cols > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.plain { background: var(--sunken); color: var(--muted); }
.chip.plain::before { display: none; }

/* header */
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.head .meta { color: var(--muted); overflow-wrap: anywhere; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.stat { background: var(--sunken); border-radius: var(--radius-md); padding: 10px 12px; }
.stat b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }

/* timeline */
.tl-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.tl-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tl { position: relative; min-width: calc(900px * var(--zoom, 1)); }
.tl-row { display: grid; grid-template-columns: 190px 1fr; height: 24px; align-items: center; border-bottom: 1px solid var(--sunken); }
.tl-row:last-child { border-bottom: 0; }
.tl-label { position: sticky; left: 0; z-index: 2; background: var(--surface); height: 100%; display: flex; align-items: center; padding-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; border-right: 1px solid var(--line); }
.tl-track { position: relative; height: 100%; }
.bar { position: absolute; top: 3px; height: 17px; border-radius: 4px; color: var(--bar-text); font-size: 11px; line-height: 17px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 0; cursor: pointer; font-family: var(--font-ui); text-align: left; }
.bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.bar.sel { box-shadow: 0 0 0 2px var(--fg); }
/* Bars too narrow for their label drop the text; the title and popover still carry it. */
.bar.notext { font-size: 0; padding: 0; }
.axis { height: 26px; }
.axis .tick { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line); font-size: 11px; color: var(--muted); padding: 5px 0 0 4px; font-variant-numeric: tabular-nums; }
.grid-lines { position: absolute; inset: 26px 0 0 190px; pointer-events: none; }
.grid-lines i { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--sunken); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.tl-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; min-width: 0; }
.zoom { display: inline-flex; background: var(--sunken); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.zoom button { border: 0; background: transparent; color: var(--muted); font: 600 12px/1 var(--font-ui); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-variant-numeric: tabular-nums; }
.zoom button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* span popover: anchored to the clicked bar; a bottom sheet at phone width */
.pop { position: fixed; z-index: 20; top: 0; left: 0; width: min(360px, calc(100vw - 32px)); max-height: min(70vh, 520px); overflow-y: auto; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: 0 12px 32px rgba(0, 0, 0, .22); padding: 12px 14px 14px; display: grid; gap: 10px; }
.pop[hidden] { display: none; }
.pop-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
.pop-head h3 { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.pop-close { flex: none; border: 0; background: var(--sunken); color: var(--muted); width: 26px; height: 26px; border-radius: 50%; font-size: 16px; line-height: 1; cursor: pointer; }
.pop-close:hover { color: var(--fg); }
.pop-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pop dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.pop dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.pop dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pop h4 { margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pop-tools { display: grid; gap: 8px; border-top: 1px solid var(--sunken); padding-top: 10px; }
.pop-files { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.pop-files li { font-family: var(--font-mono); font-size: 11px; overflow-wrap: anywhere; }
.pop-files li.more { font-family: var(--font-ui); color: var(--muted); }
.pop .sub { color: var(--muted); font-size: 12px; margin: 0; }
@media (max-width: 520px) {
  .pop { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 75vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; border-bottom: 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}

/* grids and tables */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
.tbl-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--sunken); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td .sub { color: var(--muted); font-size: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-family: var(--font-mono); font-size: 11px; background: var(--sunken); border-radius: var(--radius-sm); padding: 1px 6px; }

/* tokens */
.tok-row { display: grid; grid-template-columns: 110px 1fr 70px; gap: 10px; align-items: center; font-size: 13px; }
.tok-bar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; background: var(--sunken); }
.tok-bar i { display: block; height: 100%; }
.tok-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.tok-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

/* gates */
.gate { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 10px 12px; display: grid; gap: 8px; }
.gate-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; }
.step { font-size: 11px; border-radius: var(--radius-sm); padding: 2px 7px; background: var(--ok-soft); color: var(--ok); font-variant-numeric: tabular-nums; }
.step.red { background: var(--bad-soft); color: var(--bad); }

/* plan graph: layered left to right, scrolls inside its own box at narrow widths */
.graph-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-md); }
.graph-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.graph { display: block; width: 100%; min-width: 760px; height: auto; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: .75; }
.arrow { fill: var(--muted); }
.gnode { cursor: pointer; outline: none; }
.gnode .box { fill: var(--sf); stroke: var(--sc); stroke-width: 1.5; }
.gnode .dot { fill: var(--sc); }
.gnode .gid { fill: var(--fg); font: 600 12px var(--font-mono); }
.gnode .gsub { fill: var(--muted); font: 11px var(--font-ui); font-variant-numeric: tabular-nums; }
.gnode:hover .box { stroke-width: 2.5; }
.gnode:focus-visible .box { stroke: var(--accent); stroke-width: 3; }
.gnode.sel .box { stroke: var(--fg); stroke-width: 2.5; }
.st-done { --sf: var(--ok-soft); --sc: var(--ok); }
.st-running { --sf: var(--accent-soft); --sc: var(--accent); }
.st-red { --sf: var(--bad-soft); --sc: var(--bad); }
.st-queued { --sf: var(--sunken); --sc: var(--muted); }

/* board: 6 lanes that scroll horizontally inside their own box */
.board-scroll { overflow-x: auto; border-radius: var(--radius-md); }
.board-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(176px, 1fr)); gap: 8px; }
.lane { background: var(--sunken); border-radius: var(--radius-md); padding: 8px; display: grid; gap: 8px; align-content: start; min-height: 150px; min-width: 0; }
.lane.blocked { background: transparent; border: 1px dashed var(--line); }
.lane-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 2px 2px 0; }
.lane-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 4px; border: 1px dashed var(--line); border-radius: var(--radius-sm); }
.card { font: inherit; text-align: left; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--line)); border-radius: var(--radius-sm); padding: 8px 10px; display: grid; gap: 6px; cursor: pointer; width: 100%; min-width: 0; transition: box-shadow .12s; }
.card:hover { box-shadow: 0 0 0 1px var(--muted); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.sel { box-shadow: 0 0 0 2px var(--fg); }
.card-top, .card-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.card-id { font-family: var(--font-mono); font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
.card-meta .num { color: var(--muted); font-size: 12px; }
footer { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
@media (max-width: 520px) {
  .tok-row { grid-template-columns: 84px 1fr 58px; }
  .tl-row { grid-template-columns: 132px 1fr; }
  .grid-lines { left: 132px; }
  .tl-label { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  <div class="pop" id="pop" role="dialog" aria-modal="false" aria-labelledby="pop-title" hidden>
    <div class="pop-head"><h3 id="pop-title"></h3><button type="button" class="pop-close" aria-label="Close span details">×</button></div>
    <div id="pop-body" style="display:grid;gap:10px"></div>
  </div>

  <div class="cols">
    <section class="panel" aria-label="Spec mapping">

    <section class="panel" aria-label="Proof">
      <h2>Proof for each changed test</h2>
      <div class="tbl-scroll"><table id="proof"></table></div>
    </section>
    <section class="panel" aria-label="Tokens and time">
      <h2>Tokens and time</h2>
      <div class="tok-legend">
        <span style="--c:var(--accent)">input</span>
        <span style="--c:var(--bar-review)">cache read</span>
        <span style="--c:var(--warn)">cache write</span>
        <span style="--c:var(--ok)">output</span>
      </div>
      <div id="tokens" style="display:grid;gap:8px"></div>
      <h2 style="margin-top:6px">By role</h2>
      <div id="roles" style="display:grid;gap:8px"></div>
    </section>
    <section class="panel" aria-label="Gate runs">
      <h2>Gate runs</h2>
      <div id="gates" style="display:grid;gap:8px"></div>
    </section>
  </div>

  <footer id="foot"></footer>
</div>

<script>
(function () {
  const view = JSON.parse(document.getElementById("run-view").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const sum = (t) => t.input + t.output + t.cacheRead + t.cacheWrite;
  const fmtTok = (n) => n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : Math.round(n / 1e3) + "k";
  const fmtMin = (m) => { const s = Math.round(m * 60); return s >= 60 ? Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s" : s + "s"; };
  const fmtMs = (ms) => fmtMin(ms / 60000);
  const shortRun = (id) => id.slice(9, 15) + "…" + id.slice(-4);
  const verdictChip = (v) => `<span class="chip ${v === "GREEN" ? "ok" : v === "RED" ? "bad" : "warn"}">${esc(v)}</span>`;

  // header
  const r = view.run;
  const wall = Math.max(...view.spans.map((s) => s.end));
  const totalTok = view.tasks.reduce((a, t) => a + sum(t.tokens), 0) + view.roles.filter((x) => x.role === "orchestrator" || x.role === "explorer").reduce((a, x) => a + sum(x.tokens), 0);
  $("meta").innerHTML = [`run ${esc(r.id)}`, `plan ${esc(r.plan)}`, `preset ${esc(r.preset)}`, `started ${esc(r.startedAt.replace("T", " ").replace("Z", " UTC"))}`].map((x) => `<span>${x}</span>`).join("");
  const proven = view.proofs.filter((p) => p.outcome === "proven").length;
  const stats = [
    [fmtMin(wall), "wall time"],
    [fmtTok(totalTok), "tokens"],
    [view.tasks.length + " tasks", "3 workers in parallel"],
    [proven + " / " + new Set(view.proofs.map((p) => p.test)).size, "tests proven"],
    [view.gates.length + " gates", view.gates.filter((g) => g.verdict === "RED").length + " RED, then fixed"],
    [view.halts.length + " halts", "no stalls"]
  ];
  $("stats").innerHTML = stats.map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");

  // timeline
  const colour = { run: "--bar-phase", "spec-read": "--bar-phase", discover: "--bar-phase", explore: "--bar-phase", plan: "--bar-phase", contract: "--bar-phase", final: "--bar-phase", task: "--bar-task", worker: "--bar-worker", review: "--bar-review", fix: "--bar-worker", merge: "--bar-merge" };
  const kids = {};
  view.spans.forEach((s) => { (kids[s.parent] = kids[s.parent] || []).push(s); });
  const rows = [];
  function lane(span, depth) {
    // A task's stages share 1 row under the task row, so a worker's whole story reads left to right.
    rows.push({ depth, spans: [span], label: span.label, isTask: span.phase === "task" });
    const children = kids[span.id] || [];
    if (span.phase === "task" || span.phase === "final") {
      if (children.length) rows.push({ depth: depth + 1, spans: children, label: span.phase === "task" ? "stages" : "gate" });
      const gates = children.filter((c) => c.gateRun && c.phase !== "merge");
      gates.forEach((gs) => {
        const g = view.gates.find((x) => x.runId === gs.gateRun);
        if (!g) return;
        const scale = (gs.end - gs.start) / (g.ms / 60000);
        const tiers = [...new Set(g.steps.map((st) => st.tier))];
        tiers.forEach((tier) => {
          rows.push({ depth: depth + 2, label: `${tier} · ${g.verdict === "RED" ? "RED run" : "run"} ${shortRun(g.runId)}`, spans: g.steps.filter((st) => st.tier === tier).map((st) => ({
            id: gs.id + st.step, phase: "step", label: st.step, start: gs.start + (st.startMs / 60000) * scale, end: gs.start + ((st.startMs + st.ms) / 60000) * scale,
            outcome: st.verdict === "RED" ? "red" : "ok", gateRun: g.runId, task: gs.task, ms: st.ms, tier
          })) });
        });
      });
    } else {
      children.forEach((c) => lane(c, depth + 1));
    }
  }
  lane(view.spans[0], 0);

  const pct = (m) => (m / wall) * 100;
  let html = `<div class="tl-row axis"><div class="tl-label" style="font-weight:600;color:var(--muted)">span</div><div class="tl-track">`;
  for (let m = 0; m <= wall; m += 5) html += `<div class="tick" style="left:${pct(m)}%">${m}m</div>`;
  html += `</div></div><div class="grid-lines">`;
  for (let m = 5; m <= wall; m += 5) html += `<i style="left:${pct(m)}%"></i>`;
  html += `</div>`;
  const all = {};
  rows.forEach((row) => {
    html += `<div class="tl-row"><div class="tl-label" style="padding-left:${8 + row.depth * 14}px;${row.isTask ? "font-weight:600" : row.depth > 2 ? "color:var(--muted)" : ""}">${esc(row.label)}</div><div class="tl-track">`;
    row.spans.forEach((s) => {
      all[s.id] = s;
      const c = s.phase === "gate" || s.phase === "step" ? (s.outcome === "red" ? "--bar-red" : "--bar-gate") : colour[s.phase] || "--bar-phase";
      const textColor = s.phase === "merge" ? "var(--bg)" : "var(--bar-text)";
      html += `<button class="bar" data-id="${esc(s.id)}" style="left:${pct(s.start)}%;width:calc(${pct(s.end - s.start)}% - 2px);background:var(${c});color:${textColor}" title="${esc(s.label)} · ${fmtMin(s.end - s.start)}" aria-label="${esc(s.label)}, ${esc(s.phase)}, ${fmtMin(s.end - s.start)}" aria-haspopup="dialog" aria-expanded="false">${esc(s.label)}</button>`;
    });
    html += `</div></div>`;
  });
  $("tl").innerHTML = html;

  const scroller = $("tl-scroll");
  const tl = $("tl");

  // Rough width of a bar label at 11px plus its 12px of padding.
  function fitBars() {
    tl.querySelectorAll(".bar").forEach((b) => {
      const s = all[b.dataset.id];
      b.classList.toggle("notext", b.clientWidth < s.label.length * 6.3 + 12);
    });
  }

  // span popover
  const pop = $("pop");
  const sheet = window.matchMedia("(max-width: 520px)");
  let openBar = null;

  function toolsHtml(t, filesLabel = "Files touched") {
    if (!t) return `<p class="sub">no tool activity recorded</p>`;
    const counts = Object.entries(t.counts).sort((a, b) => b[1] - a[1]);
    const calls = counts.reduce((a, [, n]) => a + n, 0);
    const shown = t.files.slice(0, 6);
    const more = t.files.length - shown.length;
    const files = t.files.length
      ? `<ul class="pop-files">${shown.map((f) => `<li>${esc(f)}</li>`).join("")}${more > 0 ? `<li class="more">+${more} more</li>` : ""}</ul>`
      : `<p class="sub">no files touched</p>`;
    return `${counts.length ? `<div class="tags">${counts.map(([k, n]) => `<span class="chip plain num">${esc(k)} ${n}</span>`).join("")}</div>` : ""}
      <p class="sub num">${calls} calls · ${fmtMs(t.toolMs)} tool time</p>
      <h4>${esc(filesLabel)} (${t.files.length})</h4>${files}`;
  }

  function place() {
    if (!openBar) return;
    if (sheet.matches) { pop.style.left = ""; pop.style.top = ""; return; }
    const r = openBar.getBoundingClientRect();
    const m = 8, gap = 6;
    const vw = document.documentElement.clientWidth, vh = window.innerHeight;
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    const left = Math.min(Math.max(m, r.left), vw - pw - m);
    let top = r.bottom + gap;
    if (top + ph > vh - m) top = r.top - gap - ph;
    if (top < m) top = Math.max(m, vh - ph - m);
    pop.style.left = Math.max(m, left) + "px";
    pop.style.top = top + "px";
  }

  // Any trigger (timeline bar, board card, graph node) can open the popover with its own span and files label.
  function openPop(bar, s = all[bar.dataset.id], filesLabel) {
    if (openBar) closePop(false);
    openBar = bar;
    bar.classList.add("sel");
    bar.setAttribute("aria-expanded", "true");
    const fields = [
      ["phase", s.phase],
      ["task", s.task || "none"],
      ["start", "+" + fmtMin(s.start)],
      ["duration", s.ms ? fmtMs(s.ms) : fmtMin(s.end - s.start)],
      ["gate run", s.gateRun || "none"],
      ["outcome", s.outcome ? (s.outcome === "red" ? "RED" : "GREEN") : "none"]
    ];
    $("pop-title").textContent = s.label;
    $("pop-body").innerHTML = `<dl>${fields.map(([k, v]) => `<dt>${k}</dt><dd class="${k === "gate run" && s.gateRun ? "mono" : ""}">${k === "outcome" && s.outcome ? verdictChip(v) : esc(v)}</dd>`).join("")}</dl>
      <div class="pop-tools"><h4>Tools</h4>${toolsHtml(s.tools, filesLabel)}</div>`;
    pop.hidden = false;
    place();
    pop.querySelector(".pop-close").focus({ preventScroll: true });
  }

  function closePop(restoreFocus = true) {
    if (!openBar) return;
    const bar = openBar;
    openBar = null;
    pop.hidden = true;
    bar.classList.remove("sel");
    bar.setAttribute("aria-expanded", "false");
    if (restoreFocus) bar.focus({ preventScroll: true });
  }

  tl.addEventListener("click", (e) => {
    const b = e.target.closest(".bar");
    if (!b) return;
    if (b === openBar) closePop(); else openPop(b);
  });
  pop.querySelector(".pop-close").addEventListener("click", () => closePop());
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openBar) { e.preventDefault(); closePop(); } });
  document.addEventListener("pointerdown", (e) => {
    if (openBar && !pop.contains(e.target) && !e.target.closest(".bar, .card, .gnode")) closePop();
  });
  window.addEventListener("scroll", place, { capture: true, passive: true });
  window.addEventListener("resize", () => { fitBars(); place(); });
  sheet.addEventListener("change", place);

  // zoom: scale the track and keep the time at the middle of the visible track in view
  const zoomBtns = [...document.querySelectorAll("#zoom button")];
  function setZoom(z) {
    const labelW = tl.querySelector(".tl-label").offsetWidth;
    const mid = (labelW + scroller.clientWidth) / 2;
    const f = (scroller.scrollLeft + mid - labelW) / (tl.offsetWidth - labelW);
    tl.style.setProperty("--zoom", z);
    scroller.scrollLeft = labelW + f * (tl.offsetWidth - labelW) - mid;
    zoomBtns.forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.z) === z)));
    fitBars();
    place();
  }
  zoomBtns.forEach((b) => b.addEventListener("click", () => setZoom(Number(b.dataset.z))));
  fitBars();

  const specTags = (id) => view.spec.filter((q) => q.tasks.includes(id)).map((q) => q.id);
  const spanOfTask = Object.fromEntries(view.spans.filter((s) => s.phase === "task").map((s) => [s.task, s.id]));
  function toggleFrom(el, s, label) { if (el === openBar) closePop(); else openPop(el, s, label); }

  // Sum the tool activity of a span's descendants, and swap the files list for the node's write set.
  function writeSetSpan(spanId, writes) {
    const counts = {};
    let toolMs = 0;
    const walk = (id) => (kids[id] || []).forEach((c) => {
      if (c.tools) { toolMs += c.tools.toolMs; Object.entries(c.tools.counts).forEach(([k, n]) => { counts[k] = (counts[k] || 0) + n; }); }
      walk(c.id);
    });
    walk(spanId);
    const base = all[spanId];
    return Object.assign({}, base, { tools: Object.assign({}, base.tools, { counts, toolMs: base.tools ? base.tools.toolMs + toolMs : toolMs, files: writes }) });
  }

  // plan graph
  const gnodes = [
    ...view.stages.map((st) => ({ id: st.id, span: st.span, deps: st.deps, writes: st.writes, kind: "stage" })),
    ...view.tasks.map((t) => ({ id: t.id, span: spanOfTask[t.id], deps: t.deps, writes: t.writes, kind: "task", model: t.model }))
  ];
  const gBy = Object.fromEntries(gnodes.map((n) => [n.id, n]));
  // Longest-path layering keeps every edge pointing right.
  const layerOf = (n) => n.layer != null ? n.layer : (n.layer = n.deps.length ? 1 + Math.max(...n.deps.map((d) => layerOf(gBy[d]))) : 0);
  gnodes.forEach(layerOf);
  const layers = [];
  gnodes.forEach((n) => (layers[n.layer] = layers[n.layer] || []).push(n));
  const NW = 136, NH = 52, GX = 44, PAD = 20, ROW = 84;
  const maxRows = Math.max(...layers.map((l) => l.length));
  const GH = PAD * 2 + NH + (maxRows - 1) * ROW, mid = GH / 2;
  const GW = PAD * 2 + layers.length * NW + (layers.length - 1) * GX;
  layers.forEach((l, i) => {
    // A lone node sits level with its deps; a crowded layer spreads around the middle.
    l.forEach((n, j) => {
      n.x = PAD + i * (NW + GX);
      n.cy = l.length === 1 && n.deps.length ? n.deps.reduce((a, d) => a + gBy[d].cy, 0) / n.deps.length : mid + (j - (l.length - 1) / 2) * ROW;
    });
  });
  const nodeState = (n) => {
    const s = all[n.span];
    if (!s) return "queued";
    const gatesRed = (kids[n.span] || []).filter((c) => c.phase === "gate").slice(-1).some((c) => c.outcome === "red");
    return gatesRed ? "red" : s.end <= wall ? "done" : "running";
  };
  let svg = `<svg class="graph" viewBox="0 0 ${GW} ${GH}" role="group" aria-label="Plan dependency graph">
    <defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 L10 5 L0 10 z"/></marker></defs>`;
  gnodes.forEach((n) => n.deps.forEach((d) => {
    const a = gBy[d], x1 = a.x + NW, x2 = n.x - 2, mx = (x1 + x2) / 2;
    svg += `<path class="edge" d="M${x1} ${a.cy} C${mx} ${a.cy}, ${mx} ${n.cy}, ${x2} ${n.cy}" marker-end="url(#arrowhead)"/>`;
  }));
  gnodes.forEach((n) => {
    const st = nodeState(n), files = n.writes.length + (n.writes.length === 1 ? " file" : " files");
    const sub = n.kind === "task" ? `${files} · ${n.model}` : files;
    svg += `<g class="gnode st-${st}" tabindex="0" role="button" data-node="${esc(n.id)}" aria-haspopup="dialog" aria-expanded="false" aria-label="${esc(n.id)}, ${st}, writes ${files}">
      <rect class="box" x="${n.x}" y="${n.cy - NH / 2}" width="${NW}" height="${NH}" rx="8"/>
      <circle class="dot" cx="${n.x + 14}" cy="${n.cy - 8}" r="4"/>
      <text class="gid" x="${n.x + 24}" y="${n.cy - 4}">${esc(n.id)}</text>
      <text class="gsub" x="${n.x + 24}" y="${n.cy + 14}">${esc(sub)}</text></g>`;
  });
  $("graph-scroll").innerHTML = svg + `</svg>`;
  const openNode = (g) => { const n = gBy[g.dataset.node]; toggleFrom(g, writeSetSpan(n.span, n.writes), "Write set"); };
  $("graph-scroll").addEventListener("click", (e) => { const g = e.target.closest(".gnode"); if (g) openNode(g); });
  $("graph-scroll").addEventListener("keydown", (e) => {
    const g = e.target.closest(".gnode");
    if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openNode(g); }
  });

  // board
  const lanes = ["queued", "building", "gating", "review", "merged", "blocked"];
  const snap = view.liveSnapshot;
  const modelOf = Object.fromEntries([...view.tasks, ...snap.extraTasks].map((t) => [t.id, t.model]));
  const lastGateOf = (id) => {
    const g = (kids[spanOfTask[id]] || []).filter((c) => c.phase === "gate").slice(-1)[0];
    return g ? (g.outcome === "red" ? "RED" : "GREEN") : null;
  };
  const halted = new Set(view.halts.map((h) => h.task));
  let cardSpans = {};
  function boardCards(mode) {
    const cards = mode === "live"
      ? snap.board.map((b) => {
          const sp = all[spanOfTask[b.task]];
          return { id: b.task, column: b.column, lastGate: b.lastGate, elapsed: sp ? fmtMin(snap.at - sp.start) : "waiting" };
        })
      : view.tasks.map((t) => {
          const sp = all[spanOfTask[t.id]];
          return { id: t.id, column: "merged", lastGate: lastGateOf(t.id), elapsed: fmtMin(sp.end - sp.start) };
        });
    cards.forEach((c) => { if (halted.has(c.id)) c.column = "blocked"; });
    return cards;
  }
  const laneColour = { queued: "--muted", building: "--bar-worker", gating: "--warn", review: "--bar-review", merged: "--ok", blocked: "--bad" };
  function renderBoard(mode) {
    const cards = boardCards(mode);
    cardSpans = {};
    $("board-note").textContent = mode === "live"
      ? `Snapshot at +${fmtMin(snap.at)}: ${cards.filter((c) => c.column !== "merged").length} tasks in flight.`
      : `Final state at +${fmtMin(wall)}: every task merged.`;
    $("board").innerHTML = lanes.map((lane) => {
      const inLane = cards.filter((c) => c.column === lane);
      const body = inLane.length ? inLane.map((c) => {
        const sid = spanOfTask[c.id];
        cardSpans[c.id] = all[sid] || { id: "q-" + c.id, phase: "task", task: c.id, label: c.id, start: snap.at, end: snap.at };
        const tags = specTags(c.id);
        return `<button type="button" class="card" style="--c:var(${laneColour[lane]})" data-task="${esc(c.id)}" aria-haspopup="dialog" aria-expanded="false"
            aria-label="${esc(c.id)}, ${esc(lane)}, ${esc(modelOf[c.id])}, ${esc(c.elapsed)}, last gate ${esc(c.lastGate || "none")}">
          <span class="card-top"><span class="card-id">${esc(c.id)}</span><span class="chip plain">${esc(modelOf[c.id])}</span></span>
          <span class="card-meta"><span class="num">${esc(c.elapsed)}</span>${c.lastGate ? verdictChip(c.lastGate) : `<span class="chip plain">no gate yet</span>`}</span>
          <span class="tags">${tags.length ? tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("") : `<span class="sub" style="color:var(--muted);font-size:12px">no spec id</span>`}</span>
        </button>`;
      }).join("") : `<div class="lane-empty">${lane === "blocked" ? "no halts" : "empty"}</div>`;
      return `<div class="lane${lane === "blocked" ? " blocked" : ""}" role="group" aria-label="${lane}, ${inLane.length} tasks"><div class="lane-head"><span>${lane}</span><span class="num">${inLane.length}</span></div>${body}</div>`;
    }).join("");
  }
  const modeBtns = [...document.querySelectorAll("#board-mode button")];
  function setMode(mode) {
    if (openBar && openBar.classList.contains("card")) closePop(false);
    modeBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
    renderBoard(mode);
  }
  modeBtns.forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
  $("board").addEventListener("click", (e) => {
    const c = e.target.closest(".card");
    if (c) toggleFrom(c, cardSpans[c.dataset.task]);
  });
  setMode("live");

  // spec mapping
  const taskBy = Object.fromEntries(view.tasks.map((t) => [t.id, t]));
  const gateBy = Object.fromEntries(view.gates.map((g) => [g.runId, g]));
  $("spec").innerHTML = `<thead><tr><th>requirement</th><th>tasks</th><th>merged commits</th><th>merge gate</th></tr></thead><tbody>` +
    view.spec.map((q) => {
      const ts = q.tasks.map((id) => taskBy[id]);
      const verdicts = ts.map((t) => gateBy[t.mergeGateRun] ? gateBy[t.mergeGateRun].verdict : "GREEN");
      const v = verdicts.includes("RED") ? "RED" : "GREEN";
      return `<tr><td><span class="mono">${esc(q.id)}</span><div class="sub">${esc(q.title)}</div></td>
        <td><div class="tags">${q.tasks.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div></td>
        <td><div class="tags">${ts.flatMap((t) => t.commits).map((c) => `<span class="tag">${esc(c)}</span>`).join("")}</div></td>
        <td>${verdictChip(v)}</td></tr>`;
    }).join("") + `</tbody>`;

  // proof
  const outcomeText = { proven: ["failed", "ok", "proven"], "passes-reverted": ["passed", "bad", "not proven"], "compile-only": ["didn't compile", "warn", "not proven"], crashed: ["crashed", "warn", "not proven"], skipped: ["skipped", "warn", "not proven"] };
  $("proof").innerHTML = `<thead><tr><th>test</th><th>with the change reverted</th><th>assertion</th></tr></thead><tbody>` +
    view.proofs.map((p) => {
      const [txt, cls, label] = outcomeText[p.outcome];
      const a = p.assertion ? `<span class="mono">${esc(p.assertion.file.split("/").pop())}:${p.assertion.line}</span><div class="sub">#${esc(p.assertion.kind)}</div>` : `<span class="sub">none failed</span>`;
      return `<tr><td><span class="mono">${esc(p.test)}</span><div class="sub">${esc(p.task)} · base ${esc(p.proofBase)} · run <span class="mono" title="${esc(p.gateRun)}">${esc(shortRun(p.gateRun))}</span></div></td>
        <td><span class="chip ${cls}">${label}</span><div class="sub">${txt}</div></td><td>${a}</td></tr>`;
    }).join("") + `</tbody>`;

  // tokens
  function tokRows(items, labelKey, timeFn) {
    const max = Math.max(...items.map((x) => sum(x.tokens)));
    return items.map((x) => {
      const t = x.tokens, w = (n) => (n / max) * 100;
      return `<div class="tok-row"><span class="mono">${esc(x[labelKey])}</span>
        <div class="tok-bar" title="input ${fmtTok(t.input)}, cache read ${fmtTok(t.cacheRead)}, cache write ${fmtTok(t.cacheWrite)}, output ${fmtTok(t.output)}">
          <i style="width:${w(t.input)}%;background:var(--accent)"></i><i style="width:${w(t.cacheRead)}%;background:var(--bar-review)"></i><i style="width:${w(t.cacheWrite)}%;background:var(--warn)"></i><i style="width:${w(t.output)}%;background:var(--ok)"></i>
        </div><span class="num" style="text-align:right">${fmtTok(sum(t))}${timeFn ? `<div class="sub" style="color:var(--muted);font-size:11px">${timeFn(x)}</div>` : ""}</span></div>`;
    }).join("");
  }
  const taskSpan = Object.fromEntries(view.spans.filter((s) => s.phase === "task").map((s) => [s.task, s]));
  $("tokens").innerHTML = tokRows(view.tasks, "id", (t) => fmtMin(taskSpan[t.id].end - taskSpan[t.id].start));
  $("roles").innerHTML = tokRows(view.roles, "role");

  // gates
  $("gates").innerHTML = view.gates.map((g) => {
    const rules = Object.entries(g.ruleCounts);
    return `<div class="gate"><div class="gate-top">${verdictChip(g.verdict)}<span class="mono">${esc(g.runId)}</span></div>
      <div class="sub" style="color:var(--muted);font-size:12px">${esc(g.task || "final")} · swiftgate ${esc(g.command)} · ${fmtMs(g.ms)} · ${g.tests.passed} passed, ${g.tests.failed} failed, ${g.tests.skipped} skipped</div>
      <div class="steps">${g.steps.map((s) => `<span class="step ${s.verdict === "RED" ? "red" : ""}">${esc(s.tier)} ${esc(s.step)} ${fmtMs(s.ms)}</span>`).join("")}</div>
      ${rules.length ? `<div class="tags">${rules.map(([k, n]) => `<span class="tag">${esc(k)} ${n}</span>`).join("")}</div>` : ""}</div>`;
  }).join("");

  $("foot").innerHTML = `<span>RunView schema ${view.schemaVersion}</span><span>damage: ${view.damage.length ? view.damage.length + " files" : "none"}</span><span>0 dropped events</span><span>ids, counts, times and repo-relative paths only</span>`;
})();
</script>
