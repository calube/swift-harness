<title>Run Viewer</title>
<link rel="stylesheet" href="run-viewer.css">

<div class="wrap">
  <section class="panel" aria-label="Run summary">
    <div class="head">
      <h1>Offline drafts</h1>
      <span class="chip ok">GREEN</span>
      <span class="chip plain">Report</span>
    </div>
    <div class="head"><div class="meta mono" id="meta"></div></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="panel" aria-label="Plan graph">
    <div class="head" style="justify-content:space-between">
      <h2>Plan</h2>
      <div class="legend">
        <span style="--c:var(--ok)">done</span>
        <span style="--c:var(--accent)">running</span>
        <span style="--c:var(--bad)">RED</span>
        <span style="--c:var(--muted)">queued</span>
      </div>
    </div>
    <div class="graph-scroll" id="graph-scroll" tabindex="0" aria-label="Plan dependency graph, scrolls horizontally"></div>
  </section>

  <section class="panel" aria-label="Board">
    <div class="head" style="justify-content:space-between">
      <h2>Board</h2>
      <div class="zoom" role="group" aria-label="Board state" id="board-mode">
        <button type="button" data-mode="report" aria-pressed="false">Report</button>
        <button type="button" data-mode="live" aria-pressed="true">Live snapshot</button>
      </div>
    </div>
    <p class="sub" id="board-note" style="margin:0;color:var(--muted);font-size:12px"></p>
    <div class="board-scroll" id="board-scroll" tabindex="0" aria-label="Task board, scrolls horizontally"><div class="board" id="board"></div></div>
  </section>

  <section class="panel" aria-label="Timeline">
    <div class="head" style="justify-content:space-between">
      <h2>Timeline</h2>
      <div class="tl-controls">
      <div class="zoom" role="group" aria-label="Timeline zoom" id="zoom">
        <button type="button" data-z="1" aria-pressed="true">1x</button>
        <button type="button" data-z="2" aria-pressed="false">2x</button>
        <button type="button" data-z="4" aria-pressed="false">4x</button>
      </div>
      <div class="legend">
        <span style="--c:var(--bar-phase)">phase</span>
        <span style="--c:var(--bar-task)">task</span>
        <span style="--c:var(--bar-worker)">worker</span>
        <span style="--c:var(--bar-review)">review</span>
        <span style="--c:var(--bar-gate)">gate GREEN</span>
        <span style="--c:var(--bar-red)">gate RED</span>
        <span style="--c:var(--bar-merge)">merge</span>
      </div>
      </div>
    </div>
    <div class="tl-scroll" id="tl-scroll" tabindex="0" aria-label="Timeline, scrolls horizontally"><div class="tl" id="tl"></div></div>
  </section>

  <div class="pop" id="pop" role="dialog" aria-modal="false" aria-labelledby="pop-title" hidden>
    <div class="pop-head"><h3 id="pop-title"></h3><button type="button" class="pop-close" aria-label="Close span details">×</button></div>
    <div id="pop-body" style="display:grid;gap:10px"></div>
  </div>

  <div class="cols">
    <section class="panel" aria-label="Spec mapping">
      <h2>Spec to tasks, commits and gates</h2>
      <div class="tbl-scroll"><table id="spec"></table></div>
    </section>
    <section class="panel" aria-label="Proof">
      <h2>Proof for each changed test</h2>
      <div class="tbl-scroll"><table id="proof"></table></div>
    </section>
    <section class="panel" aria-label="Tokens and time">
      <h2>Tokens and time</h2>
      <div class="tok-legend">
        <span style="--c:var(--accent)">input</span>
        <span style="--c:var(--bar-review)">cache read</span>
        <span style="--c:var(--warn)">cache write</span>
        <span style="--c:var(--ok)">output</span>
      </div>
      <div id="tokens" style="display:grid;gap:8px"></div>
      <h2 style="margin-top:6px">By role</h2>
      <div id="roles" style="display:grid;gap:8px"></div>
    </section>
    <section class="panel" aria-label="Gate runs">
      <h2>Gate runs</h2>
      <div id="gates" style="display:grid;gap:8px"></div>
    </section>
  </div>

  <footer id="foot"></footer>
</div>

<div class="scrim" id="drawer-scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title" inert>
  <header class="dr-head">
    <div class="dr-kicker"><span class="mono" id="dr-id"></span><span class="chip" id="dr-status"></span></div>
    <button type="button" class="pop-close dr-close" aria-label="Close task">×</button>
    <h3 class="dr-title" id="dr-title"></h3>
  </header>
  <div class="dr-body" id="dr-body"></div>
</aside>

<script type="application/json" id="run-view"></script>

<script src="run-view-model.js"></script>
<script src="run-viewer.js"></script>
