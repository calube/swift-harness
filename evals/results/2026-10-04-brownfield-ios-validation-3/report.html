<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Viewer</title>
<style>
/* Layout: the run's title, a sticky tab strip whose badges carry the run's state to every tab, then 1 tab's panels at a time: Overview, Timeline, Board, Graph, Spec, Gates and Tokens, plus any tab a module adds. The footer shows under every tab. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --sunken: #eef0f4;
  --line: #dde1e8;
  --fg: #11181c;
  --muted: #5d6673;
  --accent: #006fee;
  --accent-soft: #e6f1fe;
  --ok: #12a150;
  --ok-soft: #e8faf0;
  --warn: #c4841d;
  --warn-soft: #fefce8;
  --bad: #d31248;
  --bad-soft: #fee7ef;
  --bar-phase: #7c8a9e;
  --bar-task: #3b82f6;
  --bar-worker: #60a5fa;
  --bar-review: #8b9dc3;
  --bar-gate: #12a150;
  --bar-red: #d31248;
  --bar-baseline: #a16207;
  --bar-merge: #11181c;
  --bar-text: #ffffff;
  --label-1: #7c3aed; --label-2: #0e9f9a; --label-3: #d97706; --label-4: #db2777; --label-5: #2563eb;
  --shadow: rgba(16, 24, 40, .22);
  --scrim: rgba(17, 24, 28, .32);
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d10; --surface: #15181d; --sunken: #1d2128; --line: #2a2f38;
    --fg: #ecedee; --muted: #9aa3ae; --accent: #338ef7; --accent-soft: #10253e;
    --ok: #17c964; --ok-soft: #0e2a1b; --warn: #f5a524; --warn-soft: #2e2208;
    --bad: #f31260; --bad-soft: #3a0d1c;
    --bar-phase: #5b6676; --bar-task: #2f6fd6; --bar-worker: #4a8ae0; --bar-review: #6a7aa0;
    --bar-gate: #139a52; --bar-red: #d0104f; --bar-baseline: #a16207; --bar-merge: #ecedee; --bar-text: #ffffff;
    --label-1: #a78bfa; --label-2: #2dd4bf; --label-3: #fbbf24; --label-4: #f472b6; --label-5: #60a5fa;
    --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d10; --surface: #15181d; --sunken: #1d2128; --line: #2a2f38;
  --fg: #ecedee; --muted: #9aa3ae; --accent: #338ef7; --accent-soft: #10253e;
  --ok: #17c964; --ok-soft: #0e2a1b; --warn: #f5a524; --warn-soft: #2e2208;
  --bad: #f31260; --bad-soft: #3a0d1c;
  --bar-phase: #5b6676; --bar-task: #2f6fd6; --bar-worker: #4a8ae0; --bar-review: #6a7aa0;
  --bar-gate: #139a52; --bar-red: #d0104f; --bar-baseline: #a16207; --bar-merge: #ecedee; --bar-text: #ffffff;
    --label-1: #a78bfa; --label-2: #2dd4bf; --label-3: #fbbf24; --label-4: #f472b6; --label-5: #60a5fa;
    --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.wrap > * { min-width: 0; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
h1 { font-size: 20px; margin: 0; font-weight: 600; text-wrap: balance; }
h2 { font-size: 12px; margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.panel > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.plain { background: var(--sunken); color: var(--muted); }
.chip.plain::before { display: none; }

/* tabs: the strip scrolls inside itself at phone width; each tab's badges count what it holds that needs a look */
.topbar { display: grid; gap: 8px; min-width: 0; }
.tabs { position: sticky; top: 0; z-index: 10; background: var(--bg); display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; min-width: 0; }
.tab { font: 600 13px/1 var(--font-ui); color: var(--muted); background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; margin-bottom: -1px; flex: none; }
.tab:hover { color: var(--fg); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--radius-sm); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab-badges { display: inline-flex; gap: 4px; }
.tab-badges:empty { display: none; }
.badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.info { background: var(--accent-soft); color: var(--accent); }
.badge.plain { background: var(--sunken); color: var(--muted); }
.tab-panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.tab-panel > * { min-width: 0; }
.task-link { font: 600 12px var(--font-mono); color: var(--fg); background: var(--sunken); border: 1px solid transparent; border-radius: var(--radius-sm); padding: 3px 8px; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
.task-link:hover { border-color: var(--line); }
.task-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.task-link.sel { box-shadow: 0 0 0 2px var(--fg); }
.pop .pop-open { justify-self: start; font-weight: 600; }

/* header */
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.head .meta { color: var(--muted); overflow-wrap: anywhere; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.stat { background: var(--sunken); border-radius: var(--radius-md); padding: 10px 12px; }
.stat b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }

/* timeline */
.tl-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.tl-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tl { position: relative; min-width: 900px; }
.tl-row { display: grid; grid-template-columns: 190px 1fr; height: 24px; align-items: center; border-bottom: 1px solid var(--sunken); }
.tl-row:last-child { border-bottom: 0; }
.tl-label { position: sticky; left: 0; z-index: 2; background: var(--surface); height: 100%; display: flex; align-items: center; padding-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; border-right: 1px solid var(--line); }
.tl-track { position: relative; height: 100%; }
.bar { position: absolute; top: 3px; height: 17px; border-radius: 4px; color: var(--bar-text); font-size: 11px; line-height: 17px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 0; cursor: pointer; font-family: var(--font-ui); text-align: left; }
.bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.bar.sel { box-shadow: 0 0 0 2px var(--fg); }
/* Bars too narrow for their label drop the text; the title and popover still carry it. */
.bar.notext { font-size: 0; padding: 0; }
/* An open span is cut at the run's last event; the hatched end says it never closed. */
.bar.open { background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255, 255, 255, .28) 6px 9px); }
.axis { height: 26px; }
.axis .tick { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line); font-size: 11px; color: var(--muted); padding: 5px 0 0 4px; font-variant-numeric: tabular-nums; }
.grid-lines { position: absolute; inset: 26px 0 0 190px; pointer-events: none; }
.grid-lines i { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--sunken); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.tl-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; min-width: 0; }
.zoom { display: inline-flex; background: var(--sunken); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.zoom button { border: 0; background: transparent; color: var(--muted); font: 600 12px/1 var(--font-ui); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-variant-numeric: tabular-nums; }
.zoom button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* span popover: anchored to the clicked bar; a bottom sheet at phone width */
.pop { position: fixed; z-index: 20; top: 0; left: 0; width: min(360px, calc(100vw - 32px)); max-height: min(70vh, 520px); overflow-y: auto; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: 0 12px 32px var(--shadow); padding: 12px 14px 14px; display: grid; gap: 10px; }
.pop[hidden] { display: none; }
.pop-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
.pop-head h3 { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.pop-close { flex: none; border: 0; background: var(--sunken); color: var(--muted); width: 26px; height: 26px; border-radius: 50%; font-size: 16px; line-height: 1; cursor: pointer; }
.pop-close:hover { color: var(--fg); }
.pop-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pop dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.pop dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.pop dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pop h4 { margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pop-tools { display: grid; gap: 8px; border-top: 1px solid var(--sunken); padding-top: 10px; }
.pop-files { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.pop-files li { font-family: var(--font-mono); font-size: 11px; overflow-wrap: anywhere; }
.pop-files li.more { font-family: var(--font-ui); color: var(--muted); }
.pop .sub { color: var(--muted); font-size: 12px; margin: 0; }
/* why a span failed: the gate's tiers, gating findings and failing tests */
.pop-fail { display: grid; gap: 6px; border-top: 1px solid var(--sunken); padding-top: 10px; }
.pop-fail p, .dr-card .fail-line, .gate-fail p { margin: 0; }
.fail-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; }
.fail-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.fail-list li { display: grid; gap: 2px; min-width: 0; }
.fail-list li.more { color: var(--muted); font-size: 12px; }
.fail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; }
.fail-head .mono, .fail-msg .mono { overflow-wrap: anywhere; }
.fail-msg { font-size: 12px; color: var(--fg); overflow-wrap: anywhere; }
.pop code, .gate code { font-family: var(--font-mono); font-size: 11px; background: var(--sunken); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.dr-fail { display: grid; gap: 6px; border-top: 1px solid var(--sunken); padding-top: 10px; }
.gate-fail { display: grid; gap: 6px; }
@media (max-width: 520px) {
  .pop { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 75vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; border-bottom: 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}

/* tables */
.tbl-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--sunken); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td .sub { color: var(--muted); font-size: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-family: var(--font-mono); font-size: 11px; background: var(--sunken); border-radius: var(--radius-sm); padding: 1px 6px; }

/* tokens */
.tok-row { display: grid; grid-template-columns: 110px 1fr 70px; gap: 10px; align-items: center; font-size: 13px; }
.tok-bar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; background: var(--sunken); }
.tok-bar i { display: block; height: 100%; }
.tok-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.tok-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

/* gates */
.gate { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 10px 12px; display: grid; gap: 8px; }
.gate-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; }
.step { font-size: 11px; border-radius: var(--radius-sm); padding: 2px 7px; background: var(--ok-soft); color: var(--ok); font-variant-numeric: tabular-nums; }
.step.red { background: var(--bad-soft); color: var(--bad); }

footer { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
footer .damage-line { color: var(--bad); flex-basis: 100%; overflow-wrap: anywhere; }

/* task drawer: a ticket view that slides in from the right; a full-height sheet at phone width */
html.drawer-open { overflow: hidden; }
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; visibility: hidden; transition: opacity .2s, visibility 0s linear .2s; }
.scrim.open { opacity: 1; visibility: visible; transition: opacity .2s; }
.drawer { position: fixed; z-index: 31; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--bg); color: var(--fg); border-left: 1px solid var(--line); box-shadow: -16px 0 40px var(--shadow); overflow-y: auto; overscroll-behavior: contain; transform: translateX(100%); visibility: hidden; transition: transform .24s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .24s; }
.drawer.open { transform: none; visibility: visible; transition: transform .24s cubic-bezier(.2, .8, .2, 1); }
.dr-head { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; align-items: center; }
.dr-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--muted); min-width: 0; }
.dr-kicker .mono { font-weight: 500; overflow-wrap: anywhere; }
.dr-title { grid-column: 1 / -1; margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.dr-body { padding: 16px 20px 32px; display: grid; gap: 12px; }
.dr-body > * { min-width: 0; }
.dr-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.dr-card h4, .dr-fold summary { margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.dr-card p { margin: 0; overflow-wrap: anywhere; }
.dr-ref { color: var(--muted); font-size: 13px; }
.dr-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; overflow-wrap: anywhere; }
.dr-list li::marker { color: var(--muted); }
.drawer code { font-family: var(--font-mono); font-size: 12px; background: var(--sunken); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.props { margin: 0; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px 12px; font-size: 13px; align-items: baseline; }
.props dt { color: var(--muted); }
.props dd { margin: 0; min-width: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.props dd.block { display: block; }
.muted { color: var(--muted); }
.nowrap { white-space: nowrap; }
.drawer .sub { color: var(--muted); font-size: 12px; margin: 0; }
.label-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-family: var(--font-mono); font-size: 11px; white-space: nowrap; }
.label-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.drawer summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; border-radius: 4px; }
.drawer summary::-webkit-details-marker { display: none; }
.drawer summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; flex: none; }
.drawer details[open] > summary::before { transform: rotate(45deg); }
.drawer summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ws summary { font-variant-numeric: tabular-nums; }
.ws .pop-files { margin-top: 6px; }
.dr-fold[open] { gap: 12px; }
.dr-fold:not([open]) { gap: 0; }
.links { display: grid; gap: 6px; }
.link-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; gap: 10px; font-size: 13px; }
.link-row > span { color: var(--muted); }
.link-btn { font: inherit; color: var(--fg); text-align: left; background: var(--sunken); border: 1px solid transparent; border-radius: var(--radius-sm); padding: 6px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; min-width: 0; }
.link-btn:hover { border-color: var(--line); }
.link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.link-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.link-btn .mono { flex: none; font-weight: 600; }
.link-btn .goal { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.act { list-style: none; margin: 0; padding: 0; display: grid; }
.act li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; position: relative; padding-bottom: 14px; font-size: 13px; }
.act li:last-child { padding-bottom: 0; }
.act li::before { content: ""; position: absolute; left: 6px; top: 16px; bottom: 0; width: 1px; background: var(--line); }
.act li:last-child::before { display: none; }
.act .dot { width: 9px; height: 9px; border-radius: 50%; margin: 5px 0 0 2px; background: var(--c, var(--muted)); }
.act .ev { min-width: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.act .ev .sub { flex-basis: 100%; color: var(--muted); font-size: 12px; }
.act time { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (max-width: 520px) {
  .drawer { width: 100%; border-left: 0; transform: translateY(100%); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .dr-head { padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px; }
  .dr-body { padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .dr-card { padding: 12px 14px; }
}
@media (max-width: 520px) {
  .tok-row { grid-template-columns: 84px 1fr 58px; }
  .tl-row { grid-template-columns: 132px 1fr; }
  .grid-lines { left: 132px; }
  .tl-label { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* now strip (live mode) and the failed-poll line */
.now-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.now-card { background: var(--sunken); border-radius: var(--radius-md); padding: 10px 12px; display: grid; gap: 4px; border-left: 3px solid var(--accent); min-width: 0; }
.now-card.stalled { border-left-color: var(--warn); }
.now-card.halted { border-left-color: var(--bad); }
.now-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.now-top b { overflow-wrap: anywhere; }
.now-stage { display: flex; justify-content: space-between; gap: 8px; }
.now-card .sub, .now .sub { color: var(--muted); font-size: 12px; margin: 0; }
.now-note { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.live-error { color: var(--bad); background: var(--bad-soft); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12px; }

</style>
<style>
/* board: 6 lanes that scroll horizontally inside their own box */
.board-scroll { overflow-x: auto; border-radius: var(--radius-md); }
.board-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(176px, 1fr)); gap: 8px; }
.lane { background: var(--sunken); border-radius: var(--radius-md); padding: 8px; display: grid; gap: 8px; align-content: start; min-height: 150px; min-width: 0; }
.lane.blocked { background: transparent; border: 1px dashed var(--line); }
.lane-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 2px 2px 0; }
.lane-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 4px; border: 1px dashed var(--line); border-radius: var(--radius-sm); }
.card { font: inherit; text-align: left; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--line)); border-radius: var(--radius-sm); padding: 8px 10px; display: grid; gap: 6px; cursor: pointer; width: 100%; min-width: 0; transition: box-shadow .12s; }
.card:hover { box-shadow: 0 0 0 1px var(--muted); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.sel { box-shadow: 0 0 0 2px var(--fg); }
.card-top, .card-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.card-id { font-family: var(--font-mono); font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
.card-meta .num { color: var(--muted); font-size: 12px; }
.board-note { margin: 0; color: var(--muted); font-size: 12px; }
.card-none { color: var(--muted); font-size: 12px; }

</style>
<style>
/* plan graph: layered left to right, scrolls inside its own box at narrow widths */
.graph-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-md); }
.graph-scroll:empty { display: none; }
.graph-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.graph { display: block; width: 100%; height: auto; }
.graph .edge { fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: .75; }
.graph .edge.stage { stroke-dasharray: 4 3; }
.graph .arrow { fill: var(--muted); }
.gnode { cursor: pointer; outline: none; --sc: var(--muted); --sf: var(--surface); }
.gnode .box { fill: var(--sf); stroke: var(--sc); stroke-width: 1.5; }
.gnode.stage .box { stroke-dasharray: 5 3; }
.gnode .dot { fill: var(--sc); }
.gnode .gid { fill: var(--fg); font: 600 12px var(--font-mono); }
.gnode .gsub { fill: var(--muted); font: 11px var(--font-ui); font-variant-numeric: tabular-nums; }
.gnode:hover .box { stroke-width: 2.5; }
.gnode:focus-visible .box { stroke: var(--accent); stroke-width: 3; }
.gnode.sel .box { stroke: var(--fg); stroke-width: 2.5; }
.gnode.ln-merged { --sc: var(--ok); --sf: var(--ok-soft); }
.gnode.ln-building { --sc: var(--accent); --sf: var(--accent-soft); }
.gnode.ln-gating { --sc: var(--warn); --sf: var(--warn-soft); }
.gnode.ln-review { --sc: var(--bar-review); --sf: color-mix(in srgb, var(--bar-review) 16%, var(--surface)); }
.gnode.ln-blocked { --sc: var(--bad); --sf: var(--bad-soft); }
.graph-notes:empty { display: none; }
.graph-notes .damage-line { margin: 0 0 8px; }

</style>
<style>
/* validation: a count strip, then 1 group of rows per task */
.qa-count[data-result="red"] b { color: var(--bad); }
.qa-count[data-result="unverified"] b { color: var(--warn); }
.qa-count[data-result="pass"] b { color: var(--ok); }
.qa-group { display: grid; gap: 6px; }
.qa-group h3 { margin: 0; font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qa-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.qa-row, .qa-kept-flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius-sm); min-width: 0; }
.qa-row.qa-waiting { border-style: dashed; color: var(--muted); }
.qa-layer { font-size: 12px; color: var(--muted); }
.qa-req, .qa-check { overflow-wrap: anywhere; min-width: 0; }
.qa-check { font-family: var(--font-mono); font-size: 11px; background: var(--sunken); border-radius: 4px; padding: 1px 5px; }
.qa-why { margin-left: auto; }
.qa-output pre { margin: 0; max-height: 220px; overflow: auto; font: 11px/1.45 var(--font-mono); background: var(--sunken); border-radius: var(--radius-sm); padding: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.qa-flow { flex-basis: 100%; display: grid; gap: 4px; padding-left: 4px; }
.qa-steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 12px; }
.qa-step { display: flex; align-items: baseline; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.qa-step .num { margin-left: auto; }
.qa-mark { font-weight: 700; width: 1em; flex: none; }
.qa-mark.ok { color: var(--ok); }
.qa-mark.bad { color: var(--bad); }
.qa-links { font-size: 12px; }
.qa-kept-group { display: grid; gap: 4px; }
.qa-kept-group h4 { margin: 4px 0 0; font-size: 12px; }
.pop-validation { margin-top: 8px; }
.pop-validation h4 { margin: 0 0 4px; font-size: 12px; }
.tl-tick { position: absolute; top: 1px; height: 21px; width: 3px; margin-left: -1px; border-radius: 1px; background: var(--fg); opacity: .75; z-index: 1; }
.tl-tick.bad { background: var(--bad); opacity: 1; }
.tl-tick:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

</style>
</head>
<body>
<div class="wrap">
  <header class="topbar" id="topbar">
    <div class="head">
      <h1 id="title">Run</h1>
      <span class="chip plain" id="state"></span>
      <span class="chip plain" id="mode">Report</span>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="Report sections" id="tabs"></div>

  <div class="tab-panel" data-tab="overview" hidden>
    <section class="panel" aria-label="Run summary" id="summary">
      <div class="head"><div class="meta mono" id="meta"></div></div>
      <div class="stats" id="stats"></div>
    </section>
    <section class="panel" aria-label="Tasks">
      <div class="head" style="justify-content:space-between"><h2>Tasks</h2><div class="tags" id="lane-counts"></div></div>
      <div class="tbl-scroll"><table id="task-table"></table></div>
    </section>
  </div>

  <div class="tab-panel" data-tab="timeline" hidden>
    <section class="panel" aria-label="Timeline">
      <div class="head" style="justify-content:space-between">
        <h2>Timeline</h2>
        <div class="tl-controls">
        <div class="zoom" role="group" aria-label="Timeline zoom" id="zoom">
          <button type="button" data-z="1" aria-pressed="true">1x</button>
          <button type="button" data-z="2" aria-pressed="false">2x</button>
          <button type="button" data-z="4" aria-pressed="false">4x</button>
        </div>
        <div class="legend">
          <span style="--c:var(--bar-phase)">phase</span>
          <span style="--c:var(--bar-task)">task</span>
          <span style="--c:var(--bar-worker)">worker</span>
          <span style="--c:var(--bar-review)">review</span>
          <span style="--c:var(--bar-gate)">gate GREEN</span>
          <span style="--c:var(--bar-red)">gate RED</span>
          <span style="--c:var(--bar-merge)">merge</span>
        </div>
        </div>
      </div>
      <div class="tl-scroll" id="tl-scroll" tabindex="0" aria-label="Timeline, scrolls horizontally"><div class="tl" id="tl"></div></div>
    </section>
  </div>

  <div class="tab-panel" data-tab="board" hidden>
    <section class="panel" aria-label="Board" data-module="board" hidden></section>
  </div>

  <div class="tab-panel" data-tab="graph" hidden>
    <section class="panel" aria-label="Plan graph" data-module="graph" hidden></section>
  </div>

  <div class="tab-panel" data-tab="spec" hidden>
    <section class="panel" aria-label="Spec mapping">
      <h2>Spec to tasks, commits and gates</h2>
      <div class="tbl-scroll"><table id="spec-table"></table></div>
    </section>
  </div>

  <div class="tab-panel" data-tab="gates" hidden>
    <section class="panel" aria-label="Gate runs">
      <h2>Gate runs</h2>
      <div id="gate-list" style="display:grid;gap:8px"></div>
    </section>
    <section class="panel" aria-label="Proof">
      <h2>Proof for each changed test</h2>
      <div class="tbl-scroll"><table id="proof"></table></div>
    </section>
  </div>

  <div class="tab-panel" data-tab="tokens" hidden>
    <section class="panel" aria-label="Tokens and time">
      <h2>Tokens and time</h2>
      <div class="tok-legend">
        <span style="--c:var(--accent)">input</span>
        <span style="--c:var(--bar-review)">cache read</span>
        <span style="--c:var(--warn)">cache write</span>
        <span style="--c:var(--ok)">output</span>
      </div>
      <div id="token-rows" style="display:grid;gap:8px"></div>
      <h2 style="margin-top:6px">By role</h2>
      <div id="roles" style="display:grid;gap:8px"></div>
    </section>
  </div>

  <div class="pop" id="pop" role="dialog" aria-modal="false" aria-labelledby="pop-title" hidden>
    <div class="pop-head"><h3 id="pop-title"></h3><button type="button" class="pop-close" aria-label="Close details">×</button></div>
    <div id="pop-body" style="display:grid;gap:10px"></div>
  </div>

  <footer id="foot"></footer>
</div>

<div class="scrim" id="drawer-scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title" inert>
  <header class="dr-head">
    <div class="dr-kicker"><span class="mono" id="dr-id"></span><span class="chip" id="dr-status"></span></div>
    <button type="button" class="pop-close dr-close" aria-label="Close task">×</button>
    <h3 class="dr-title" id="dr-title"></h3>
  </header>
  <div class="dr-body" id="dr-body"></div>
</aside>

<script>
// Pure functions over a RunView: merging partials, laying out the timeline, and formatting.
// Loaded as a classic script so the report can inline it; it publishes one global.
(function (root) {
  // The key each RunView array merges on. A partial row replaces the row with the same key.
  const KEYS = {
    spec: (x) => x.id,
    tasks: (x) => x.id,
    roles: (x) => x.role,
    spans: (x) => x.id,
    gates: (x) => x.runId,
    proofs: (x) => x.gateRun + "\u0000" + x.test,
    halts: (x) => (x.task || "") + "\u0000" + x.at,
    damage: (x) => x.source + "\u0000" + x.reason
  };

  function mergeBy(rows, partial, key) {
    const out = rows.slice();
    const index = new Map(out.map((row, i) => [key(row), i]));
    partial.forEach((row) => {
      const k = key(row);
      if (index.has(k)) out[index.get(k)] = row;
      else { index.set(k, out.length); out.push(row); }
    });
    return out;
  }

  function apply(view, partial) {
    const out = Object.assign({}, view);
    Object.keys(partial || {}).forEach((field) => {
      const value = partial[field];
      out[field] = KEYS[field] && Array.isArray(value) ? mergeBy(view[field] || [], value, KEYS[field]) : value;
    });
    return out;
  }

  const ms = (iso) => (iso == null ? null : Date.parse(iso));

  // The run's last event: what an open span is cut at in the report.
  function lastEventMs(view) {
    const times = [ms(view.run.startedAt), ms(view.run.endedAt)];
    (view.spans || []).forEach((s) => times.push(ms(s.start), ms(s.end)));
    (view.halts || []).forEach((h) => times.push(ms(h.at)));
    (view.tasks || []).forEach((t) => times.push(ms(t.createdAt), ms(t.mergedAt)));
    return Math.max.apply(null, times.filter((t) => t != null && !Number.isNaN(t)));
  }

  function spanLabel(s) {
    if (s.phase === "run") return "build run";
    if (s.phase === "task") return s.task || "task";
    if (s.phase === "gate") return "gate";
    return s.phase.replace(/[-.]/g, " ");
  }

  // Spans in minutes from the run's start, with open spans cut at the run's last event.
  function normalize(view, nowMs) {
    const t0 = ms(view.run.startedAt);
    const cut = nowMs != null ? nowMs : lastEventMs(view);
    const toMin = (t) => (t - t0) / 60000;
    const gateBy = {};
    (view.gates || []).forEach((g) => { gateBy[g.runId] = g; });
    const spans = (view.spans || []).map((s) => {
      const open = s.end == null;
      const g = s.gateRun && gateBy[s.gateRun];
      let label = spanLabel(s);
      if (s.phase === "gate" && g) label = "gate " + gateTier(g.command);
      return Object.assign({}, s, { start: toMin(ms(s.start)), end: toMin(open ? cut : ms(s.end)), open, label });
    });
    return { spans, wall: Math.max(0, toMin(cut)), t0 };
  }

  function gateTier(command) {
    const m = /--tier\s+(\S+)/.exec(command || "");
    return m ? m[1] : command || "";
  }

  // Greedy first-fit: each span takes the first row it doesn't overlap.
  function pack(spans) {
    const rows = [];
    spans.slice().sort((a, b) => a.start - b.start).forEach((s) => {
      const row = rows.find((r) => r[r.length - 1].end <= s.start);
      if (row) row.push(s); else rows.push([s]);
    });
    return rows;
  }

  // Timeline rows. A task's (or the final phase's) descendants share rows under it, so a worker's
  // whole story reads left to right; its gate runs add 1 row per tier, steps from the gate record.
  function lanes(spans, gates) {
    const byId = {};
    const kids = {};
    spans.forEach((s) => { byId[s.id] = s; });
    spans.forEach((s) => {
      const p = s.parent != null && byId[s.parent] ? s.parent : null;
      (kids[p] = kids[p] || []).push(s);
    });
    Object.keys(kids).forEach((k) => kids[k].sort((a, b) => a.start - b.start));
    const gateBy = {};
    (gates || []).forEach((g) => { gateBy[g.runId] = g; });
    const descendants = (s) => (kids[s.id] || []).reduce((acc, c) => acc.concat([c], descendants(c)), []);
    const rows = [];

    function gateRows(gs, depth) {
      const g = gateBy[gs.gateRun];
      if (!g || !g.steps || !g.steps.length) return;
      const minutes = g.ms / 60000;
      const factor = minutes > 0 ? (gs.end - gs.start) / minutes : 0;
      // A GREEN run's red steps are the ones its baseline excused.
      const excused = spans.some((x) => x.phase === "step" && x.gateRun === g.runId && x.baseline);
      const tiers = [];
      g.steps.forEach((st) => { if (tiers.indexOf(st.tier) < 0) tiers.push(st.tier); });
      tiers.forEach((tier) => {
        let cursor = 0;
        const steps = g.steps.filter((st) => st.tier === tier).map((st) => {
          // A step with no start offset is laid end to end after the last and marked approximate.
          const approximate = st.startMs == null;
          const startMs = approximate ? cursor : st.startMs;
          cursor = startMs + st.ms;
          return {
            id: gs.id + ":" + tier + ":" + st.step, parent: gs.id, phase: "step", label: st.step,
            start: gs.start + (startMs / 60000) * factor, end: gs.start + ((startMs + st.ms) / 60000) * factor,
            outcome: st.verdict === "RED" ? "red" : "ok", gateRun: g.runId, task: gs.task, ms: st.ms, tier, approximate,
            baseline: excused && st.verdict === "RED"
          };
        });
        rows.push({ depth, label: tier + " · " + (g.verdict === "RED" ? "RED run" : "run") + " " + shortRun(g.runId), spans: steps });
      });
    }

    function walk(s, depth) {
      rows.push({ depth, spans: [s], label: s.label, isTask: s.phase === "task" });
      if (s.phase === "task" || s.phase === "final") {
        const all = descendants(s);
        pack(all).forEach((r, i) => rows.push({ depth: depth + 1, spans: r, label: i === 0 ? (s.phase === "task" ? "stages" : "gate") : "" }));
        all.filter((c) => c.phase === "gate" && c.gateRun).forEach((gs) => gateRows(gs, depth + 2));
      } else {
        (kids[s.id] || []).forEach((c) => walk(c, depth + 1));
      }
    }
    (kids.null || []).forEach((s) => walk(s, 0));
    return rows;
  }

  const ZOOMS = [1, 2, 4];
  const scale = (zoom, width) => width * (ZOOMS.indexOf(zoom) >= 0 ? zoom : 1);
  // Rough width of a bar label at 11px plus its 12px of padding.
  const labelFits = (text, px) => px >= String(text).length * 6.3 + 12;

  const sum = (t) => t.input + t.output + t.cacheRead + t.cacheWrite;
  const fmtTok = (n) => (n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : Math.round(n / 1e3) + "k");
  const fmtTokens = (t) => (t == null ? "pending" : fmtTok(sum(t)));
  const fmtMin = (m) => {
    const s = Math.round(m * 60);
    return s >= 60 ? Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s" : s + "s";
  };
  const fmtMs = (n) => fmtMin(n / 60000);
  const shortRun = (id) => (id && id.length > 15 ? id.slice(9, 15) + "…" + id.slice(-4) : String(id));
  const durationText = (s) => (s.open ? "never ended" : s.ms != null ? fmtMs(s.ms) : fmtMin(s.end - s.start));

  function blocks(view, id) {
    return (view.tasks || []).filter((t) => (t.deps || []).indexOf(id) >= 0).map((t) => t.id);
  }

  // A task's wave counts only task deps; a dep cycle stops at the task already being visited.
  function waveOf(view, id) {
    const byId = {};
    (view.tasks || []).forEach((t) => { byId[t.id] = t; });
    const memo = {};
    const visit = (tid, seen) => {
      if (memo[tid]) return memo[tid];
      const deps = (byId[tid] ? byId[tid].deps || [] : []).filter((d) => byId[d] && seen.indexOf(d) < 0);
      memo[tid] = deps.length ? 1 + Math.max.apply(null, deps.map((d) => visit(d, seen.concat([tid])))) : 1;
      return memo[tid];
    };
    return visit(id, []);
  }

  // A task's events in time order: created, worker and fix starts, gate verdicts, review, halts
  // and merge. `at` is milliseconds since the epoch.
  function activity(view, id) {
    const t = (view.tasks || []).find((x) => x.id === id);
    if (!t) return [];
    const events = [];
    if (t.createdAt) events.push({ at: ms(t.createdAt), kind: "created", text: "Created", c: "--muted" });
    const gateBy = {};
    (view.gates || []).forEach((g) => { gateBy[g.runId] = g; });
    const gatesSeen = {};
    (view.spans || []).filter((s) => s.task === id).forEach((s) => {
      if (s.phase === "worker") events.push({ at: ms(s.start), kind: "worker", text: "Worker started", sub: (t.model || "") + " build worker", c: "--bar-worker" });
      else if (s.phase === "fix") events.push({ at: ms(s.start), kind: "fix", text: "Fix started", sub: s.tools ? s.tools.files.length + " files touched" : "", c: "--warn" });
      else if (s.phase === "review") events.push({ at: ms(s.start), kind: "review", text: "Review started", c: "--bar-review" });
      else if (s.phase === "verify") events.push({ at: ms(s.start), kind: "verify", text: "Verify started", c: "--warn" });
      else if (s.phase === "gate" && s.gateRun) {
        gatesSeen[s.gateRun] = true;
        const g = gateBy[s.gateRun];
        const verdict = g ? g.verdict : s.outcome === "red" ? "RED" : "GREEN";
        const sub = (g ? gateTier(g.command) + " gate · " : "") + "run " + shortRun(s.gateRun);
        if (s.end == null) events.push({ at: ms(s.start), kind: "gate", text: "Gate running", sub, c: "--warn" });
        else events.push({ at: ms(s.end), kind: "gate", text: "Gate " + verdict, codes: g ? (g.failure && g.failure.findings.length ? g.failure.findings.map((x) => x.rule) : Object.keys(g.ruleCounts || {})) : [], sub, c: verdict === "RED" ? "--bad" : "--ok" });
      }
    });
    (view.halts || []).filter((h) => h.task === id).forEach((h) => {
      events.push({ at: ms(h.at), kind: "halt", text: "Halted", sub: h.reason + (h.gateRun ? " · gate run " + shortRun(h.gateRun) : ""), c: "--bad" });
    });
    if (t.mergedAt) {
      const g = gateBy[t.mergeGateRun];
      events.push({ at: ms(t.mergedAt), kind: "merge", text: "Merged", codes: t.commits || [], sub: g ? "merge gate " + g.verdict : "", c: "--fg" });
    }
    // At the same instant a verdict comes before the stage it starts: a RED gate, then its fix.
    const rank = (e) => (e.kind === "created" ? 0 : e.kind === "gate" && e.text !== "Gate running" ? 1 : 2);
    return events.filter((e) => e.at != null && !Number.isNaN(e.at)).sort((a, b) => a.at - b.at || rank(a) - rank(b));
  }

  // The tool summary of a span and every span under it, in the RunView `tools` shape.
  function toolSummary(spans, spanId) {
    const kids = {};
    let rootSpan = null;
    spans.forEach((s) => {
      if (s.id === spanId) rootSpan = s;
      (kids[s.parent] = kids[s.parent] || []).push(s);
    });
    if (!rootSpan) return null;
    const calls = {};
    const files = [];
    let otherCount = 0, total = 0, droppedPaths = 0, any = false;
    const walk = (s) => {
      if (s.tools) {
        any = true;
        s.tools.calls.forEach((c) => {
          const row = calls[c.tool] || (calls[c.tool] = { tool: c.tool, count: 0, ms: 0 });
          row.count += c.count;
          row.ms += c.ms;
        });
        otherCount += s.tools.otherCount || 0;
        total += s.tools.ms || 0;
        droppedPaths += s.tools.droppedPaths || 0;
        s.tools.files.forEach((f) => { if (files.indexOf(f) < 0) files.push(f); });
      }
      (kids[s.id] || []).forEach(walk);
    };
    walk(rootSpan);
    if (!any) return null;
    const sorted = Object.keys(calls).map((k) => calls[k]).sort((a, b) => b.count - a.count || (a.tool < b.tool ? -1 : 1));
    return { calls: sorted, otherCount, ms: total, files, droppedPaths };
  }

  // What explains a span's red or halted outcome: the RED gate run it is or names, the task's
  // block when it stopped there, and the run's halts. Null when nothing does.
  function failureOf(view, span) {
    const gates = {};
    (view.gates || []).forEach((g) => { gates[g.runId] = g; });
    const task = span.task != null ? (view.tasks || []).find((t) => t.id === span.task) : null;
    const runId = span.gateRun || span.causeGateRun || null;
    const gate = runId && gates[runId] && gates[runId].failure ? gates[runId] : null;
    const block = span.phase === "task" && task && task.blocked ? task.blocked : null;
    const halts = span.phase === "run" && span.outcome === "halted" ? openHalts(view) : [];
    if (!gate && !block && !halts.length) return null;
    return { gate, block, halts, gateOf: (id) => gates[id] || null };
  }

  const NEVER_ENDED = "Never ended; no end event recorded.";
  const NO_REASON = "No reason recorded.";

  // A span's one-line failure reason: the builder's, its gate run's for a step row the page
  // derives, or "never ended" for a span still open in a report. Null for a span that is ok or
  // still running live.
  function failureReason(view, s, live) {
    if (s.failureReason) return s.failureReason;
    const open = s.open != null ? s.open : s.end == null;
    if (open) return live ? null : NEVER_ENDED;
    if (s.outcome == null || s.outcome === "ok") return null;
    const spans = view.spans || [];
    // A red step row the page derives takes the reason of the builder's red step of that run.
    const step = s.gateRun ? spans.find((x) => (x.phase === "step" || x.phase === "tier") && x.gateRun === s.gateRun && x.outcome === "red" && x.failureReason) : null;
    const gate = s.gateRun ? spans.find((x) => x.phase === "gate" && x.gateRun === s.gateRun && x.failureReason) : null;
    return step ? step.failureReason : gate ? gate.failureReason : NO_REASON;
  }

  // `file:line`, `file`, or null for a finding or test no file locates.
  const location = (file, line) => (file == null ? null : line == null ? file : file + ":" + line);

  // `text` cut to `max` characters with an ellipsis.
  const clip = (text, max) => (text.length > max ? text.slice(0, Math.max(0, max - 1)) + "…" : text);

  // Halts with no resume yet: the builder fills `answer` and `waitMs` only from a `build.resume`.
  const openHalts = (view) => (view.halts || []).filter((h) => h.answer == null && h.waitMs == null);

  // The newest time anything of a task happened: a span starting or ending, a halt or its resume.
  function lastTaskEventMs(view, id) {
    const times = [];
    (view.spans || []).filter((s) => s.task === id).forEach((s) => times.push(ms(s.start), ms(s.end)));
    (view.halts || []).filter((h) => h.task === id).forEach((h) => {
      times.push(ms(h.at));
      if (h.waitMs != null) times.push(ms(h.at) + h.waitMs);
    });
    const known = times.filter((t) => t != null && !Number.isNaN(t));
    return known.length ? Math.max.apply(null, known) : null;
  }

  // The now strip: 1 card per task with an open task span, naming its newest open stage.
  function workers(view, nowMs, stallMin) {
    const spans = view.spans || [];
    const halted = {};
    openHalts(view).forEach((h) => { if (h.task != null) halted[h.task] = h; });
    return spans.filter((s) => s.phase === "task" && s.task != null && s.end == null).map((ts) => {
      const stages = spans.filter((s) => s.task === ts.task && s.id !== ts.id && s.end == null)
        .sort((a, b) => ms(b.start) - ms(a.start));
      const stage = stages[0] || null;
      const last = lastTaskEventMs(view, ts.task);
      return {
        task: ts.task, phase: stage ? stage.phase : "task", gateRun: stage ? stage.gateRun : null,
        elapsedMs: nowMs - ms(ts.start), lastEventMs: last,
        stalled: last != null && nowMs - last > stallMin * 60000, halted: !!halted[ts.task],
        halt: halted[ts.task] || null
      };
    });
  }

  // Tasks whose open span has had no event of that task for `stallMin` minutes at `nowMs`.
  const stalls = (view, nowMs, stallMin) => workers(view, nowMs, stallMin).filter((w) => w.stalled).map((w) => w.task);

  // The header's line for a run's time box: its minutes and where they came from, then the clock
  // times starts stop, the cutoff comes and the box ends. `null` for a run without a box.
  const clock = (iso) => iso.slice(11, 16) + " UTC";
  function timeBoxText(run) {
    const box = run && run.timeBox;
    if (!box) return null;
    const from = { config: "config", flag: "--time-box", default: "default" }[box.source] || box.source;
    return `box ${box.budgetMin} min (${from}): starts stop ${clock(box.noNewStartsAt)}, cutoff ${clock(box.cutoffAt)}, ends ${clock(box.endsAt)}`;
  }

  // Gate runs in time order: by the end of each run's gate span, falling back to the view's order
  // for a run with no span.
  function gatesInTime(view, gates) {
    const ended = {};
    (view.spans || []).forEach((s) => { if (s.phase === "gate" && s.gateRun && s.end != null) ended[s.gateRun] = ms(s.end); });
    const index = new Map((view.gates || []).map((g, i) => [g.runId, i]));
    return gates.slice().sort((a, b) => {
      const ta = ended[a.runId], tb = ended[b.runId];
      return (ta != null && tb != null ? ta - tb : 0) || index.get(a.runId) - index.get(b.runId);
    });
  }

  // A task's newest gate run, or null when it has none.
  function latestGate(view, id) {
    const own = gatesInTime(view, (view.gates || []).filter((g) => g.task === id));
    return own.length ? own[own.length - 1] : null;
  }

  // Gate runs of a task that came after its first RED one.
  function gateRetries(view) {
    const byTask = {};
    (view.gates || []).forEach((g) => { if (g.task != null) (byTask[g.task] = byTask[g.task] || []).push(g); });
    return Object.keys(byTask).reduce((total, id) => {
      const runs = gatesInTime(view, byTask[id]);
      const firstRed = runs.findIndex((g) => g.verdict === "RED");
      return total + (firstRed < 0 ? 0 : runs.length - firstRed - 1);
    }, 0);
  }

  const BLOCKED_STATUS = ["blocked", "needs-replan", "abandoned"];
  const plural = (n, one, many) => (n === 1 ? one : many || one + "s");

  // Each tab's badges, by tab id: what the tab would show that needs a look, so it reads from any
  // tab. A badge is `{key, kind, n, text, title}`; a zero count gets none. `now` is the live clock,
  // null for a report, where an open span never ended; a stall needs both `now` and `stallMin`.
  function tabBadges(view, opts) {
    const o = opts || {};
    const live = o.now != null;
    const spans = view.spans || [], tasks = view.tasks || [], gates = view.gates || [];
    const badge = (key, kind, n, text, title) => (n > 0 ? [{ key, kind, n, text, title }] : []);
    const halts = openHalts(view);
    const haltedTask = new Set(halts.filter((h) => h.task != null).map((h) => h.task));
    // Tier and step spans repeat their gate's outcome, so a RED gate counts once.
    // A warm-up step the baseline recorded failed as expected, so it isn't counted.
    const failed = spans.filter((s) => (s.outcome === "red" || s.outcome === "halted") && !s.baseline && s.phase !== "tier" && s.phase !== "step").length;
    const stalled = live && typeof o.stallMin === "number" ? stalls(view, o.now, o.stallMin).length : 0;
    const unended = live ? 0 : spans.filter((s) => s.end == null).length;
    const blocked = tasks.filter((t) => BLOCKED_STATUS.indexOf(t.status) >= 0 || haltedTask.has(t.id)).length;
    const active = tasks.filter((t) => t.status === "in-progress" && !haltedTask.has(t.id)).length;
    const merged = tasks.filter((t) => t.status === "done").length;
    const red = gates.filter((g) => g.verdict === "RED").length;
    const retries = gateRetries(view);
    const unproven = (view.proofs || []).filter((p) => p.outcome !== "proven").length;
    const uncovered = (view.spec || []).filter((q) => !(q.tasks || []).length).length;
    const pending = tasks.filter((t) => t.tokens == null).length;
    return {
      overview: badge("halted", "bad", halts.length, halts.length + " halted", halts.length + " open " + plural(halts.length, "halt")),
      timeline: badge("failed", "bad", failed, failed + " failed", failed + " red or halted " + plural(failed, "span"))
        .concat(badge("stalled", "warn", stalled, stalled + " stalled", stalled + " " + plural(stalled, "task") + " quiet past stall_min"))
        .concat(badge("unended", "plain", unended, unended + " open", unended + " " + plural(unended, "span") + " never ended")),
      board: badge("blocked", "bad", blocked, blocked + " blocked", blocked + " " + plural(blocked, "task") + " blocked or halted")
        .concat(badge("active", "info", active, active + " in flight", active + " " + plural(active, "task") + " in progress")),
      graph: badge("merged", "plain", merged, merged + "/" + tasks.length, merged + " of " + tasks.length + " tasks merged"),
      spec: badge("uncovered", "warn", uncovered, uncovered + " uncovered", uncovered + " " + plural(uncovered, "requirement") + " no task covers"),
      gates: badge("red", "bad", red, red + " RED", red + " RED gate " + plural(red, "run"))
        .concat(badge("retries", "warn", retries, retries + " " + plural(retries, "retry", "retries"), retries + " gate " + plural(retries, "run") + " after a RED one of the same task"))
        .concat(badge("unproven", "warn", unproven, unproven + " not proven", unproven + " changed " + plural(unproven, "test") + " prove couldn't prove")),
      tokens: badge("pending", "plain", pending, pending + " pending", pending + " " + plural(pending, "task") + " with tokens not yet ingested")
    };
  }

  // The Validation tab's groups: 1 per task a row runs after, in ledger order, then tasks the
  // ledger lacks, then rows whose report named no task. A row that runs after several tasks shows
  // under each. Each group's waiting rows come last, as its "waiting on" rows.
  function validationGroups(view) {
    const v = view.validation;
    if (!v) return [];
    const order = (view.tasks || []).map((t) => t.id);
    const byTask = new Map();
    const add = (task, row) => { if (!byTask.has(task)) byTask.set(task, []); byTask.get(task).push(row); };
    v.rows.forEach((row) => { if (row.runsAfter.length) row.runsAfter.forEach((t) => add(t, row)); else add(null, row); });
    const rank = (task) => (task == null ? Infinity : order.indexOf(task) < 0 ? order.length : order.indexOf(task));
    return [...byTask.keys()].sort((a, b) => rank(a) - rank(b) || String(a).localeCompare(String(b))).map((task) => {
      const rows = byTask.get(task);
      return { task, rows: rows.filter((r) => r.result !== "waiting"), waiting: rows.filter((r) => r.result === "waiting") };
    });
  }

  // The Validation tab's badges: its red, unverified and waiting counts.
  function validationBadges(view) {
    const v = view.validation;
    if (!v) return [];
    const c = v.counts;
    const badge = (key, kind, n, text, title) => (n > 0 ? [{ key, kind, n, text, title }] : []);
    return badge("red", "bad", c.red, c.red + " red", c.red + " red validation " + plural(c.red, "row"))
      .concat(badge("unverified", "warn", c.unverified, c.unverified + " unverified", c.unverified + " validation " + plural(c.unverified, "row") + " with no answer"))
      .concat(badge("waiting", "plain", c.waiting, c.waiting + " waiting", c.waiting + " validation " + plural(c.waiting, "row") + " waiting on a task"));
  }

  // A link to a file a run left, relative to the page: a report sits in `reports/` beside
  // `runs/`, and the live page at `/` reaches `/runs/`. With `offsetMs` it opens the video there.
  function evidenceHref(run, path, offsetMs) {
    const href = "../runs/" + encodeURIComponent(run) + "/" + String(path).split("/").map(encodeURIComponent).join("/");
    return offsetMs == null ? href : href + "#t=" + Math.max(0, offsetMs) / 1000;
  }

  // Why a final pass or a kept XCUITest left no video or no contact sheet.
  const GAP_TEXT = {
    recorderBusy: "a recording outside the harness held the simulator past the 5-minute retry bound",
    recordLockTimedOut: "another final pass held the recording slot past the wait",
    recordFailed: "record start or record stop failed",
    sheetFailed: "the contact sheet couldn't be made from the video",
    noVideoAttachment: "the UI test kept no screen recording in its result bundle"
  };
  function gapText(reason) {
    return GAP_TEXT[reason] || "no reason recorded (" + reason + ")";
  }

  // The kept flows list: 1 group per `[[flows]]` entry, each with its tests in order.
  function keptFlowGroups(view) {
    const v = view.validation;
    if (!v || !v.keptFlows) return [];
    const groups = new Map();
    v.keptFlows.forEach((k) => {
      const key = k.name == null ? null : k.name;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(k);
    });
    return [...groups.entries()].map(([name, flows]) => ({ name, flows }));
  }

  root.RunViewModel = {
    validationGroups, validationBadges, evidenceHref, gapText, keptFlowGroups,
    apply, latestGate, tabBadges, stalls, openHalts, workers, failureOf, failureReason, location, clip, normalize, lanes, scale, labelFits, blocks, activity, waveOf, toolSummary, durationText, timeBoxText,
    lastEventMs, gateTier, sum, fmtTok, fmtTokens, fmtMin, fmtMs, shortRun
  };
})(globalThis);

</script>
<script>
(function () {
  const M = window.RunViewModel;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const { fmtTok, fmtTokens, fmtMin, fmtMs, shortRun, sum } = M;
  const verdictChip = (v) => `<span class="chip ${v === "GREEN" ? "ok" : v === "RED" ? "bad" : "warn"}">${esc(v)}</span>`;
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many || one + "s");

  // Errors anywhere on the page are counted where a headless check can read them.
  document.body.dataset.errors = "0";
  const countError = () => { document.body.dataset.errors = String(Number(document.body.dataset.errors) + 1); };
  window.addEventListener("error", countError);
  window.addEventListener("unhandledrejection", countError);

  const pageDamage = [];
  let view = null;
  // Served by `swiftgate view` the page carries no data and fetches it; opened as a file, it is a report.
  let liveMode = false;
  try {
    const text = $("run-view").textContent.trim();
    if (text) view = JSON.parse(text);
    else if (location.protocol !== "file:") liveMode = true;
    else pageDamage.push({ source: "page", reason: "no run data embedded" });
  } catch (error) {
    pageDamage.push({ source: "page", reason: "run data is not JSON: " + error.message });
  }

  // State the page derives from the view on each render.
  let spans = [], wall = 0, t0 = 0, byId = {}, kids = {}, gateBy = {}, taskBy = {};

  // A live run's open spans grow with the clock; a finished run stops at its last event.
  const liveNowMs = () => (liveMode && view.run.state !== "done" ? Date.now() : null);

  function derive() {
    const n = M.normalize(view, liveNowMs());
    spans = n.spans; wall = n.wall || 1; t0 = n.t0;
    byId = {}; kids = {};
    spans.forEach((s) => { byId[s.id] = s; (kids[s.parent] = kids[s.parent] || []).push(s); });
    gateBy = Object.fromEntries(view.gates.map((g) => [g.runId, g]));
    taskBy = Object.fromEntries(view.tasks.map((t) => [t.id, t]));
  }
  const taskSpan = (id) => spans.find((s) => s.phase === "task" && s.task === id);
  const minOf = (iso) => (Date.parse(iso) - t0) / 60000;

  // header
  function renderHeader() {
    const r = view.run;
    $("title").textContent = r.plan || r.id;
    const state = $("state");
    state.textContent = r.state;
    state.className = "chip " + ({ done: "ok", running: "info", halted: "bad" }[r.state] || "plain");
    const box = M.timeBoxText(r);
    $("meta").innerHTML = [`run ${esc(r.id)}`, `plan ${esc(r.plan)}`, `preset ${esc(r.preset)}`, `started ${esc(r.startedAt.replace("T", " ").replace("Z", " UTC"))}`].concat(box ? [esc(box)] : []).map((x) => `<span>${x}</span>`).join("");
    const roleTok = view.roles.filter((x) => x.tokens).reduce((a, x) => a + sum(x.tokens), 0);
    const taskTok = view.tasks.filter((t) => t.tokens).reduce((a, t) => a + sum(t.tokens), 0);
    const pending = view.tasks.filter((t) => t.tokens == null).length;
    const tests = new Set(view.proofs.map((p) => p.test)).size;
    const proven = new Set(view.proofs.filter((p) => p.outcome === "proven").map((p) => p.test)).size;
    const red = view.gates.filter((g) => g.verdict === "RED").length;
    const taskSpans = spans.filter((s) => s.phase === "task");
    const parallel = taskSpans.reduce((m, s) => Math.max(m, taskSpans.filter((o) => o.start < s.end && s.start < o.end).length), 0);
    const answered = view.halts.filter((h) => h.answer != null).length;
    const stats = [
      [fmtMin(wall), "wall time"],
      [fmtTok(roleTok || taskTok), pending ? `tokens, ${plural(pending, "task")} pending` : "tokens"],
      [plural(view.tasks.length, "task"), `${parallel} in parallel at most`],
      [proven + " / " + tests, "tests proven"],
      [plural(view.gates.length, "gate"), red + " RED"],
      [plural(view.halts.length, "halt"), answered + " answered"]
    ];
    $("stats").innerHTML = stats.map(([b, s]) => `<div class="stat"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
  }

  // timeline
  const colour = { run: "--bar-phase", task: "--bar-task", worker: "--bar-worker", fix: "--bar-worker", review: "--bar-review", verify: "--bar-gate", merge: "--bar-merge", "qa.check": "--bar-gate" };
  const barColour = (s) => {
    if (s.baseline) return "--bar-baseline";
    if (s.phase === "gate" || s.phase === "step") return s.outcome === "red" ? "--bar-red" : "--bar-gate";
    if (s.outcome === "red" || s.outcome === "halted") return "--bar-red";
    return colour[s.phase] || "--bar-phase";
  };
  const scroller = $("tl-scroll");
  const tl = $("tl");
  let zoom = 1;
  let all = {};

  function renderTimeline() {
    const rows = M.lanes(spans, view.gates);
    const pct = (m) => (m / wall) * 100;
    const tick = wall > 120 ? 30 : wall > 60 ? 10 : 5;
    let html = `<div class="tl-row axis"><div class="tl-label" style="font-weight:600;color:var(--muted)">span</div><div class="tl-track">`;
    for (let m = 0; m <= wall; m += tick) html += `<div class="tick" style="left:${pct(m)}%">${m}m</div>`;
    html += `</div></div><div class="grid-lines">`;
    for (let m = tick; m <= wall; m += tick) html += `<i style="left:${pct(m)}%"></i>`;
    html += `</div>`;
    all = {};
    rows.forEach((row) => {
      html += `<div class="tl-row"><div class="tl-label" style="padding-left:${8 + row.depth * 14}px;${row.isTask ? "font-weight:600" : row.depth > 2 ? "color:var(--muted)" : ""}">${esc(row.label)}</div><div class="tl-track">`;
      row.spans.forEach((s) => {
        all[s.id] = s;
        const textColor = s.phase === "merge" ? "var(--bg)" : "var(--bar-text)";
        const dur = M.durationText(s);
        html += `<button class="bar${s.open ? " open" : ""}" data-id="${esc(s.id)}" style="left:${pct(s.start)}%;width:calc(${pct(Math.max(0, s.end - s.start))}% - 2px);background-color:var(${barColour(s)});color:${textColor}" title="${esc(s.label)} · ${esc(dur)}" aria-label="${esc(s.label)}, ${esc(s.phase)}, ${esc(dur)}" aria-haspopup="dialog" aria-expanded="false">${esc(s.label)}</button>`;
        if (s.flow) html += ticksHtml(s, pct);
      });
      html += `</div></div>`;
    });
    tl.innerHTML = html;
    sizeTrack();
  }

  // 1 tick per step of the flow a qa.check span drove, at its offset into the span, linked to
  // the video at that offset when the flow has one.
  function ticksHtml(s, pct) {
    const f = s.flow;
    return f.steps.map((st) => {
      const at = Math.min(s.end, Math.max(s.start, s.start + st.offsetMs / 60000));
      const label = `step ${st.n}${st.label != null ? " " + st.label : ""}, ${st.ok ? "passed" : "failed"}, ${(st.offsetMs / 1000).toFixed(1)} s`;
      const attrs = `class="tl-tick ${st.ok ? "ok" : "bad"}" data-span="${esc(s.id)}" data-n="${st.n}" style="left:${pct(at)}%" title="${esc(label)}" aria-label="${esc(label)}"`;
      return f.video != null
        ? `<a ${attrs} href="${esc(M.evidenceHref(f.run, f.video, st.offsetMs))}" target="_blank" rel="noopener"></a>`
        : `<span ${attrs} role="img"></span>`;
    }).join("");
  }

  function sizeTrack() {
    tl.style.width = M.scale(zoom, Math.max(900, scroller.clientWidth)) + "px";
    fitBars();
  }

  function fitBars() {
    tl.querySelectorAll(".bar").forEach((b) => {
      const s = all[b.dataset.id];
      b.classList.toggle("notext", !M.labelFits(s.label, b.clientWidth));
    });
  }

  // span popover
  const pop = $("pop");
  const sheet = window.matchMedia("(max-width: 520px)");
  let openAnchor = null;
  // What the open popover shows: "span", "task", or "other" for a module's rows.
  let popKind = null;

  function toolsHtml(t, filesLabel = "Files touched") {
    if (!t) return `<p class="sub">no tool activity recorded</p>`;
    const calls = t.calls.reduce((a, c) => a + c.count, 0) + (t.otherCount || 0);
    const shown = t.files.slice(0, 6);
    const more = t.files.length - shown.length;
    const files = t.files.length
      ? `<ul class="pop-files">${shown.map((f) => `<li>${esc(f)}</li>`).join("")}${more > 0 ? `<li class="more">+${more} more</li>` : ""}</ul>`
      : `<p class="sub">no files touched</p>`;
    const chips = t.calls.map((c) => `<span class="chip plain num" title="${esc(fmtMs(c.ms))}">${esc(c.tool)} ${c.count}</span>`)
      .concat(t.otherCount ? [`<span class="chip plain num">other ${t.otherCount}</span>`] : []);
    return `${chips.length ? `<div class="tags">${chips.join("")}</div>` : ""}
      <p class="sub num">${calls} calls · ${fmtMs(t.ms)} tool time</p>
      <h4>${esc(filesLabel)} (${t.files.length})</h4>${files}
      ${t.droppedPaths ? `<p class="sub">${plural(t.droppedPaths, "path")} dropped: outside the repository</p>` : ""}`;
  }

  // Why a gate run, a stage or a task failed. The popover shows a few lines, each message cut;
  // the task drawer shows every line the view carries, whole.
  const POP_LINES = 3, POP_MESSAGE = 140;
  const stageText = { task: "task gate", worker: "worker's gate", merge: "merge gate", final: "final gate" };
  const blockText = {
    "gate-red": "its last gate run was RED",
    "return-rejected": "build check-return rejected its return",
    "return-not-stored": "no return of it was stored: none came back, or a check-return that records nothing rejected it",
    halt: "a halt stopped it"
  };
  function failureHeadline(g) {
    const f = g.failure;
    const tiers = f.tiers.length ? f.tiers.join(", ") + " failed" : g.verdict;
    return [tiers, f.checkTier ? f.checkTier + " tier" : null, f.stage ? stageText[f.stage] : null].filter(Boolean).join(" · ");
  }
  function findingHtml(x, max) {
    const at = M.location(x.file, x.line);
    const message = max ? M.clip(x.message, max) : x.message;
    const cut = !max && x.truncated ? ` <span class="muted">(cut; the report holds the rest)</span>` : "";
    return `<li><div class="fail-head"><span class="chip ${x.severity === "blocker" || x.severity === "major" ? "bad" : "warn"}">${esc(x.severity)}</span><code>${esc(x.rule)}</code>${at ? `<span class="mono">${esc(at)}</span>` : ""}</div><div class="fail-msg">${esc(message)}${cut}</div></li>`;
  }
  function testHtml(t) {
    const at = M.location(t.file, t.line);
    const how = t.proof ? "not proven: " + t.proof : "failed" + (t.tier ? " in " + t.tier : "");
    return `<li><div class="fail-head"><span class="mono">${esc(t.test)}</span></div><div class="fail-msg">${esc(how)}${at ? ` at <span class="mono">${esc(at)}</span>` : ""}</div></li>`;
  }
  function more(n, where) { return n > 0 ? `<li class="more">+${n} more ${where}</li>` : ""; }
  // 1 gate run's failure; `full` is the drawer's form.
  function gateFailureHtml(g, full) {
    const f = g.failure;
    const n = full ? Infinity : POP_LINES;
    const findings = f.findings.slice(0, n), tests = f.failedTests.slice(0, n);
    const hiddenF = f.findings.length - findings.length, hiddenT = f.failedTests.length - tests.length;
    const counts = g.tests ? `<p class="sub num">${g.tests.passed} passed, ${g.tests.failed} failed, ${g.tests.skipped} skipped</p>` : "";
    const rules = !f.findings.length && Object.keys(g.ruleCounts || {}).length
      ? `<div class="tags">${Object.entries(g.ruleCounts).map(([k, v]) => `<span class="tag">${esc(k)} ${v}</span>`).join("")}</div>` : "";
    const where = full ? "in the report" : "in the task drawer";
    return `<p class="fail-line"><span class="chip bad">${esc(g.verdict)}</span> ${esc(failureHeadline(g))}</p>${counts}
      ${findings.length ? `<h4>Gating findings</h4><ul class="fail-list">${findings.map((x) => findingHtml(x, full ? 0 : POP_MESSAGE)).join("")}${more(hiddenF, where)}${more(f.moreFindings, "in the report")}</ul>` : rules}
      ${tests.length ? `<h4>Failing tests</h4><ul class="fail-list">${tests.map(testHtml).join("")}${more(hiddenT, where)}${more(f.moreFailedTests, "in the report")}</ul>` : ""}
      <p class="sub">run <span class="mono">${esc(g.runId)}</span></p>
      <p class="sub">${f.report ? `report <code>${esc(f.report)}</code>` : "its report.json isn't in any live checkout"} · <code>${esc(f.command)}</code></p>`;
  }
  // What build check-return said about a rejected return; `full` is the drawer's form.
  function rejectionHtml(r, full) {
    const shown = r.findings.slice(0, full ? Infinity : POP_LINES);
    const hidden = r.findings.length - shown.length;
    const rows = shown.map((x) => `<li><div class="fail-head"><code>${esc(x.rule)}</code></div><div class="fail-msg">${esc(full ? x.message : M.clip(x.message, POP_MESSAGE))}${full && x.truncated ? ` <span class="muted">(cut)</span>` : ""}</div></li>`);
    const list = shown.length
      ? `<ul class="fail-list">${rows.join("")}${more(hidden, "in the task drawer")}${more(r.moreFindings, "in check-return's output")}</ul>`
      : r.rules.length ? `<div class="tags">${r.rules.map((k) => `<span class="tag">${esc(k)}</span>`).join("")}</div>` : "";
    return `<p class="sub">check-return ${esc(r.verdict)}${r.fix ? " on the fixer's return" : ""}: ${esc(full ? r.message : M.clip(r.message, POP_MESSAGE))}</p>${list}`;
  }
  function blockHtml(b, gateOf, full) {
    const g = b.gateRun ? gateOf(b.gateRun) : null;
    return `<p class="fail-line"><span class="chip bad">stopped</span> at ${esc(clock(Date.parse(b.at)))}${b.cause ? `: ${esc(blockText[b.cause] || b.cause)}` : ""}</p>
      ${b.rejection ? rejectionHtml(b.rejection, full) : ""}
      ${b.halt ? `<p class="sub">halt raised: ${esc(b.halt)}</p>` : ""}
      ${b.gateRun ? `<p class="sub">last gate run <span class="mono">${esc(b.gateRun)}</span> ${g ? esc(g.verdict) : ""}</p>` : `<p class="sub">no gate run</p>`}`;
  }
  // The popover's "Why it failed" section for a span; empty when nothing explains it.
  function spanFailureHtml(s) {
    const why = M.failureOf(view, s);
    if (!why) return "";
    const parts = [];
    if (why.block) parts.push(blockHtml(why.block, why.gateOf, false));
    if (why.gate) parts.push(gateFailureHtml(why.gate, false));
    why.halts.forEach((h) => {
      const g = h.gateRun ? why.gateOf(h.gateRun) : null;
      parts.push(`<p class="fail-line"><span class="chip bad">halted</span> ${esc(h.task || "the run")}: ${esc(h.reason)}</p>${g && g.failure ? gateFailureHtml(g, false) : ""}`);
    });
    const task = s.task && taskBy[s.task] ? `<button type="button" class="link-btn" data-open-task="${esc(s.task)}">Open ${esc(s.task)} for every line</button>` : "";
    const heading = why.gate || why.halts.length ? "Why it failed" : "Why it stopped";
    return `<div class="pop-fail" role="group" aria-label="${heading}"><h4>${heading}</h4>${parts.join("")}${task}</div>`;
  }

  function place() {
    if (!openAnchor) return;
    if (sheet.matches) { pop.style.left = ""; pop.style.top = ""; return; }
    const r = openAnchor.getBoundingClientRect();
    const m = 8, gap = 6;
    const vw = document.documentElement.clientWidth, vh = window.innerHeight;
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    const left = Math.min(Math.max(m, r.left), vw - pw - m);
    let top = r.bottom + gap;
    if (top + ph > vh - m) top = r.top - gap - ph;
    if (top < m) top = Math.max(m, vh - ph - m);
    pop.style.left = Math.max(m, left) + "px";
    pop.style.top = top + "px";
  }

  // Anchors a popover of label and value rows to any element; modules use it through runViewer.
  function openPopover(anchor, rows, title, extraHtml = "", focus = true) {
    if (openAnchor) closePop(false);
    openAnchor = anchor;
    anchor.classList.add("sel");
    anchor.setAttribute("aria-expanded", "true");
    $("pop-title").textContent = title != null ? title : anchor.getAttribute("aria-label") || "";
    $("pop-body").innerHTML = `<dl>${rows.map(([k, v, html]) => `<dt>${esc(k)}</dt><dd>${html != null ? html : esc(v)}</dd>`).join("")}</dl>${extraHtml}`;
    pop.hidden = false;
    place();
    if (focus) pop.querySelector(".pop-close").focus({ preventScroll: true });
  }

  function openSpan(bar, focus = true) {
    const s = all[bar.dataset.id];
    const outcome = s.outcome ? (s.outcome === "red" ? "RED" : s.outcome === "ok" ? "GREEN" : s.outcome) : null;
    // A warm-up step that failed at the base commit, recorded and excused, isn't the run's fault.
    const outcomeHtml = s.baseline ? `<span class="chip warn" title="fails at the base commit; the baseline recorded it, so gates excuse it">baseline</span>` : outcome ? verdictChip(outcome) : null;
    const reason = M.failureReason(view, s, liveNowMs() != null);
    const rows = [
      ["phase", s.tier ? `${s.tier} ${s.phase}` : s.phase],
      ["span", s.phase === "step" ? s.parent : s.id, `<span class="mono">${esc(s.phase === "step" ? s.parent : s.id)}</span>`],
      ["task", s.task || "none"],
      ["start", "+" + fmtMin(s.start)],
      ["duration", M.durationText(s) + (s.approximate ? " (approximate)" : "")],
      ["gate run", s.gateRun || "none", s.gateRun ? `<span class="mono">${esc(s.gateRun)}</span>` : null],
      ["outcome", outcome || "none", outcomeHtml]
    ].concat(reason ? [["failure reason", reason]] : []);
    const tools = s.phase === "step" ? null : M.toolSummary(spans, s.id);
    openPopover(bar, rows, s.label, `${spanFailureHtml(s)}<div class="pop-tools"><h4>Tools</h4>${toolsHtml(tools)}</div>`, focus);
    popKind = "span";
  }

  function closePop(restoreFocus = true) {
    if (!openAnchor) return;
    const anchor = openAnchor;
    openAnchor = null;
    popKind = null;
    pop.hidden = true;
    pinned = false;
    anchor.classList.remove("sel");
    anchor.setAttribute("aria-expanded", "false");
    if (restoreFocus && anchor.isConnected) {
      restoring = true;
      anchor.focus({ preventScroll: true });
      restoring = false;
    }
  }

  // Hovering or focusing a bar previews its popover without moving focus; a click or Enter pins
  // it and moves focus in. A preview closes when the pointer or focus leaves its bar.
  let pinned = false, restoring = false;
  tl.addEventListener("click", (e) => {
    const b = e.target.closest(".bar");
    if (!b) return;
    if (b === openAnchor && pinned) { closePop(); return; }
    openSpan(b);
    pinned = true;
  });
  const preview = (b) => { if (b && b !== openAnchor && !pinned && !restoring) { openSpan(b, false); pinned = false; } };
  tl.addEventListener("focusin", (e) => preview(e.target.closest(".bar")));
  tl.addEventListener("mouseover", (e) => preview(e.target.closest(".bar")));
  tl.addEventListener("focusout", (e) => {
    if (pinned || !openAnchor || e.target !== openAnchor) return;
    if (!e.relatedTarget || (!pop.contains(e.relatedTarget) && !e.relatedTarget.closest(".bar"))) closePop(false);
  });
  tl.addEventListener("mouseout", (e) => {
    const b = e.target.closest(".bar");
    if (pinned || !b || b !== openAnchor || document.activeElement === b) return;
    if (!e.relatedTarget || (!pop.contains(e.relatedTarget) && e.relatedTarget.closest(".bar") !== b)) closePop(false);
  });
  pop.addEventListener("click", (e) => {
    const l = e.target.closest("[data-open-task]");
    if (l) openTaskDrawer(l.dataset.openTask, openAnchor);
  });
  pop.querySelector(".pop-close").addEventListener("click", () => closePop());
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (drawerId) { e.preventDefault(); closeDrawer(); } else if (openAnchor) { e.preventDefault(); closePop(); }
  });
  document.addEventListener("pointerdown", (e) => {
    if (openAnchor && !pop.contains(e.target) && !openAnchor.contains(e.target)) closePop();
  });
  window.addEventListener("scroll", place, { capture: true, passive: true });
  window.addEventListener("resize", () => { if (view) sizeTrack(); place(); });
  sheet.addEventListener("change", place);

  // zoom: scale the track and keep the time at the middle of the visible track in view
  const zoomBtns = [...document.querySelectorAll("#zoom button")];
  function setZoom(z) {
    const labelW = tl.querySelector(".tl-label").offsetWidth;
    const mid = (labelW + scroller.clientWidth) / 2;
    const f = (scroller.scrollLeft + mid - labelW) / (tl.offsetWidth - labelW);
    zoom = z;
    sizeTrack();
    scroller.scrollLeft = labelW + f * (tl.offsetWidth - labelW) - mid;
    zoomBtns.forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.z) === z)));
    place();
  }
  zoomBtns.forEach((b) => b.addEventListener("click", () => setZoom(Number(b.dataset.z))));

  // spec mapping
  function renderSpec() {
    $("spec-table").innerHTML = `<thead><tr><th>requirement</th><th>tasks</th><th>merged commits</th><th>merge gate</th></tr></thead><tbody>` +
      view.spec.map((q) => {
        const ts = q.tasks.map((id) => taskBy[id]).filter(Boolean);
        const verdicts = ts.map((t) => (gateBy[t.mergeGateRun] ? gateBy[t.mergeGateRun].verdict : null));
        const v = !q.tasks.length ? `<span class="chip warn">uncovered</span>`
          : verdicts.includes("RED") ? verdictChip("RED")
          : verdicts.length && verdicts.every((x) => x === "GREEN") ? verdictChip("GREEN")
          : `<span class="chip plain">not merged</span>`;
        return `<tr><td><span class="mono">${esc(q.id)}</span><div class="sub">${esc(q.title)}</div></td>
          <td><div class="tags">${q.tasks.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div></td>
          <td><div class="tags">${ts.flatMap((t) => t.commits).map((c) => `<span class="tag">${esc(c)}</span>`).join("")}</div></td>
          <td>${v}</td></tr>`;
      }).join("") + `</tbody>`;
  }

  // proof: the assertion's file, line and kind only; a report never carries source
  const outcomeText = { proven: ["failed", "ok", "proven"], "passes-reverted": ["passed", "bad", "not proven"], "compile-only": ["didn't compile", "warn", "not proven"], crashed: ["crashed", "warn", "not proven"], skipped: ["skipped", "warn", "not proven"] };
  function renderProof() {
    $("proof").innerHTML = `<thead><tr><th>test</th><th>with the change reverted</th><th>assertion</th></tr></thead><tbody>` +
      view.proofs.map((p) => {
        const [txt, cls, label] = outcomeText[p.outcome] || [p.outcome, "warn", "unknown"];
        const a = p.assertion ? `<span class="mono" title="${esc(p.assertion.file)}">${esc(p.assertion.file.split("/").pop())}:${esc(p.assertion.line)}</span><div class="sub">#${esc(p.assertion.kind)}</div>` : `<span class="sub">none failed</span>`;
        return `<tr><td><span class="mono">${esc(p.test)}</span><div class="sub">${esc(p.task)} · base ${esc(p.proofBase || "none")} · run <span class="mono" title="${esc(p.gateRun)}">${esc(shortRun(p.gateRun))}</span></div></td>
          <td><span class="chip ${cls}">${esc(label)}</span><div class="sub">${esc(txt)}</div></td><td>${a}</td></tr>`;
      }).join("") + `</tbody>`;
  }

  // tokens
  function tokRows(items, labelKey, timeFn) {
    const max = Math.max(1, ...items.filter((x) => x.tokens).map((x) => sum(x.tokens)));
    return items.map((x) => {
      const t = x.tokens, w = (n) => (n / max) * 100;
      const bar = t
        ? `<div class="tok-bar" title="input ${fmtTok(t.input)}, cache read ${fmtTok(t.cacheRead)}, cache write ${fmtTok(t.cacheWrite)}, output ${fmtTok(t.output)}">
