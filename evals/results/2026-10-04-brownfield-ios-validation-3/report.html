          <i style="width:${w(t.input)}%;background:var(--accent)"></i><i style="width:${w(t.cacheRead)}%;background:var(--bar-review)"></i><i style="width:${w(t.cacheWrite)}%;background:var(--warn)"></i><i style="width:${w(t.output)}%;background:var(--ok)"></i>
        </div>`
        : `<div class="tok-bar" title="tokens arrive when the worker's transcript is ingested"></div>`;
      const time = timeFn ? timeFn(x) : "";
      return `<div class="tok-row"><span class="mono">${esc(x[labelKey])}</span>${bar}<span class="num" style="text-align:right">${fmtTokens(t)}${time ? `<div class="sub" style="color:var(--muted);font-size:11px">${esc(time)}</div>` : ""}</span></div>`;
    }).join("");
  }
  function renderTokens() {
    $("token-rows").innerHTML = tokRows(view.tasks, "id", (t) => { const s = taskSpan(t.id); return s ? M.durationText(s) : ""; });
    $("roles").innerHTML = tokRows(view.roles, "role");
  }

  // gates
  function renderGates() {
    $("gate-list").innerHTML = view.gates.map((g) => {
      const rules = Object.entries(g.ruleCounts || {});
      return `<div class="gate"><div class="gate-top">${verdictChip(g.verdict)}<span class="mono">${esc(g.runId)}</span></div>
        <div class="sub" style="color:var(--muted);font-size:12px">${esc(g.task || "no task")} · swiftgate ${esc(g.command)} · ${fmtMs(g.ms)}${g.tests ? ` · ${g.tests.passed} passed, ${g.tests.failed} failed, ${g.tests.skipped} skipped` : ""}</div>
        <div class="steps">${g.steps.map((s) => `<span class="step ${s.verdict === "RED" ? "red" : ""}">${esc(s.tier)} ${esc(s.step)} ${fmtMs(s.ms)}</span>`).join("")}</div>
        ${rules.length ? `<div class="tags">${rules.map(([k, n]) => `<span class="tag">${esc(k)} ${n}</span>`).join("")}</div>` : ""}
        ${g.failure ? `<div class="gate-fail"><p class="sub">${esc(failureHeadline(g))}</p>${g.failure.findings.length ? `<ul class="fail-list">${g.failure.findings.slice(0, POP_LINES).map((x) => findingHtml(x, POP_MESSAGE)).join("")}${more(g.failure.findings.length - Math.min(POP_LINES, g.failure.findings.length) + g.failure.moreFindings, "")}</ul>` : ""}</div>` : ""}</div>`;
    }).join("");
  }

  // task drawer: opened from a board card, a graph node or a link, it reads like a ticket
  const statusChip = { pending: "plain", "in-progress": "info", done: "ok", blocked: "bad", "needs-replan": "warn", abandoned: "bad" };
  const statusVar = { pending: "--muted", "in-progress": "--accent", done: "--ok", blocked: "--bad", "needs-replan": "--warn", abandoned: "--bad" };
  const clock = (ms) => { const d = new Date(ms); return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0") + " UTC"; };
  const nowMs = () => t0 + wall * 60000;
  const ago = (ms) => { const d = (nowMs() - ms) / 60000; return d < 1 ? "just now" : d < 60 ? Math.round(d) + "m ago" : Math.floor(d / 60) + "h ago"; };
  const when = (ms) => `<time title="+${fmtMin((ms - t0) / 60000)} · ${clock(ms)}">${ago(ms)}</time>`;
  const md = (txt) => esc(txt).replace(/`([^`]+)`/g, "<code>$1</code>");
  const bullets = (xs) => `<ul class="dr-list">${xs.map((x) => `<li>${md(x)}</li>`).join("")}</ul>`;
  const card = (label, body) => `<section class="dr-card"><h4>${label}</h4>${body}</section>`;

  function renderDrawer(id) {
    const t = taskBy[id], b = t.brief;
    $("dr-id").textContent = t.id;
    $("dr-status").className = "chip " + (statusChip[t.status] || "plain");
    $("dr-status").textContent = t.status;
    $("dr-title").textContent = b ? b.title : t.id;
    const specColour = Object.fromEntries(view.spec.map((q, i) => [q.id, `--label-${(i % 5) + 1}`]));
    const writes = t.writes || [];
    const ws = writes.length
      ? `<details class="ws"><summary>${plural(writes.length, "file")}</summary><ul class="pop-files">${writes.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></details>`
      : `<span class="muted">no files</span>`;
    const merged = t.mergedAt
      ? `${(t.commits || []).map((c) => `<code>${esc(c)}</code>`).join("")}<span class="muted">${clock(Date.parse(t.mergedAt))} · ${ago(Date.parse(t.mergedAt))}</span>`
      : `<span class="muted">not yet</span>`;
    const created = t.createdAt ? `<span>${clock(Date.parse(t.createdAt))}</span><span class="muted">· ${ago(Date.parse(t.createdAt))}</span>` : `<span class="muted">unknown</span>`;
    const covers = t.covers || [];
    const props = [
      ["status", `<span class="chip ${statusChip[t.status] || "plain"}">${esc(t.status)}</span>`],
      ...(t.failureReason ? [["failure reason", esc(t.failureReason)]] : []),
      ["worker", `${esc(t.model)} <span class="muted">build worker</span>`],
      ["wave", `wave ${M.waveOf(view, id)}`],
      ["spec ids", covers.length ? covers.map((c) => `<span class="label-chip" style="--c:var(${specColour[c] || "--muted"})">${esc(c)}</span>`).join("") : `<span class="muted">none</span>`],
      ["write set", ws, "block"],
      ["gate", t.gate ? esc(t.gate) : `<span class="muted">none</span>`],
      ["created", created],
      ["merged", merged],
      ["id", `<span class="mono">${esc(id)}</span>`]
    ];

    const linkRows = (label, ids) => ids.map((d) => {
      const x = taskBy[d];
      if (!x) return `<div class="link-row"><span>${label}</span><span class="mono">${esc(d)}</span></div>`;
      const goal = x.brief ? x.brief.title : x.status;
      return `<div class="link-row"><span>${label}</span><button type="button" class="link-btn" data-open="${esc(d)}" style="--c:var(${statusVar[x.status] || "--muted"})" aria-label="${label} ${esc(d)}, ${esc(x.status)}: ${esc(goal)}"><i class="dot"></i><span class="mono">${esc(d)}</span><span class="goal">${esc(goal)}</span></button></div>`;
    }).join("");
    const links = linkRows("Blocked by", t.deps || []) + linkRows("Blocks", M.blocks(view, id));

    const ev = M.activity(view, id);
    const acts = ev.length
      ? `<ol class="act">${ev.map((e) => `<li style="--c:var(${e.c})"><i class="dot"></i><div class="ev"><span>${esc(e.text)}</span>${(e.codes || []).map((c) => `<code>${esc(c)}</code>`).join("")}${e.sub ? `<span class="sub">${esc(e.sub)}</span>` : ""}</div>${when(e.at)}</li>`).join("")}</ol>`
      : `<p class="muted">nothing yet</p>`;
    const ts = taskSpan(id);
    const redGates = view.gates.filter((g) => g.task === id && g.failure);
    const gateOf = (rid) => gateBy[rid] || null;
    const failed = t.blocked || redGates.length
      ? card(redGates.length ? "Why it failed" : "Why it stopped", `${t.blocked ? blockHtml(t.blocked, gateOf, true) : ""}${redGates.map((g) => `<div class="dr-fail">${gateFailureHtml(g, true)}</div>`).join("")}`)
      : "";

    $("dr-body").innerHTML = failed +
      (b ? card("Why", `<p>${md(b.why)}</p>${b.designRef ? `<p class="dr-ref">Implements design ${esc(b.designRef)}</p>` : ""}`) +
        card("Scope", bullets(b.scope)) +
        card("Acceptance", bullets(b.acceptance)) +
        card("Out of scope", bullets(b.outOfScope)) : "") +
      card("Properties", `<dl class="props">${props.map(([k, v, cls]) => `<dt>${k}</dt><dd${cls ? ` class="${cls}"` : ""}>${v}</dd>`).join("")}</dl>`) +
      card("Links", links ? `<div class="links">${links}</div>` : `<p class="muted">no dependencies</p>`) +
      card("Activity", acts) +
      `<details class="dr-card dr-fold"><summary>Tool activity</summary><div style="display:grid;gap:8px">${toolsHtml(ts ? M.toolSummary(spans, ts.id) : null)}</div></details>`;
  }

  const drawer = $("drawer"), scrim = $("drawer-scrim");
  let drawerId = null, drawerOpener = null;
  // With no opener given, focus returns on close to whatever had it when the drawer opened.
  function openTaskDrawer(id, opener) {
    if (!taskBy[id]) return false;
    closePop(false);
    const from = opener || (drawerId ? null : document.activeElement);
    if (from && from !== drawerOpener && from !== document.body) {
      if (drawerOpener) { drawerOpener.classList.remove("sel"); drawerOpener.setAttribute("aria-expanded", "false"); }
      drawerOpener = from;
      if (opener) { opener.classList.add("sel"); opener.setAttribute("aria-expanded", "true"); }
    }
    drawerId = id;
    renderDrawer(id);
    drawer.scrollTop = 0;
    drawer.removeAttribute("inert");
    drawer.classList.add("open");
    scrim.classList.add("open");
    document.documentElement.classList.add("drawer-open");
    drawer.querySelector(".dr-close").focus({ preventScroll: true });
    return true;
  }
  function closeDrawer() {
    if (!drawerId) return;
    drawerId = null;
    drawer.classList.remove("open");
    scrim.classList.remove("open");
    drawer.setAttribute("inert", "");
    document.documentElement.classList.remove("drawer-open");
    const o = reconnect(drawerOpener);
    drawerOpener = null;
    if (o) { o.classList.remove("sel"); o.setAttribute("aria-expanded", "false"); if (o.isConnected) o.focus({ preventScroll: true }); }
  }
  drawer.querySelector(".dr-close").addEventListener("click", closeDrawer);
  scrim.addEventListener("pointerdown", (e) => { e.preventDefault(); closeDrawer(); });
  // Following a link keeps the original opener, so closing still returns focus to it.
  $("dr-body").addEventListener("click", (e) => { const l = e.target.closest("[data-open]"); if (l) openTaskDrawer(l.dataset.open); });
  drawer.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") return;
    const f = [...drawer.querySelectorAll("button, summary, [tabindex]:not([tabindex='-1'])")].filter((el) => el.getClientRects().length);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  // An anchor a redraw replaced: the element now in its place, found by its class and task id.
  function reconnect(el) {
    if (!el || el.isConnected) return el;
    const id = el.dataset && el.dataset.task;
    const cls = el.classList && el.classList[0];
    return id && cls ? document.querySelector(`.${CSS.escape(cls)}[data-task="${CSS.escape(id)}"]`) : null;
  }

  // Each task's board lane. Without the board module, a lane comes from the status alone.
  const LANE_ORDER = ["queued", "building", "gating", "review", "merged", "blocked"];
  const statusLane = (status) => (status === "done" ? "merged" : ["blocked", "needs-replan", "abandoned"].includes(status) ? "blocked" : status === "in-progress" ? "building" : "queued");
  function laneMap() {
    const out = {};
    if (window.RunViewBoard) {
      const cols = window.RunViewBoard.columns(view);
      Object.keys(cols).forEach((lane) => cols[lane].forEach((c) => { out[c.id] = lane; }));
    } else view.tasks.forEach((t) => { out[t.id] = statusLane(t.status); });
    return out;
  }

  // Overview's compact board: the count in each lane, then 1 row per task that opens its details.
  let taskTableHtml = null;
  function renderTaskTable() {
    const lanes = laneMap();
    $("lane-counts").innerHTML = LANE_ORDER.map((l) => [l, view.tasks.filter((t) => lanes[t.id] === l).length])
      .filter(([, n]) => n).map(([l, n]) => `<span class="tag">${esc(l)} ${n}</span>`).join("");
    const html = `<thead><tr><th>task</th><th>status</th><th>column</th><th>latest gate</th><th>commits</th><th>time</th></tr></thead><tbody>` +
      view.tasks.map((t) => {
        const g = M.latestGate(view, t.id);
        const ts = taskSpan(t.id);
        const commits = (t.commits || []).map((c) => `<span class="tag">${esc(c)}</span>`).join("");
        return `<tr><td><button type="button" class="task-link" data-task="${esc(t.id)}" aria-haspopup="dialog" aria-expanded="false">${esc(t.id)}</button>${t.brief ? `<div class="sub">${esc(t.brief.title)}</div>` : ""}</td>
          <td><span class="chip ${statusChip[t.status] || "plain"}">${esc(t.status)}</span></td>
          <td>${esc(lanes[t.id] || "queued")}</td>
          <td>${g ? verdictChip(g.verdict) : `<span class="sub">none</span>`}</td>
          <td><div class="tags">${commits || `<span class="sub">none</span>`}</div></td>
          <td class="num nowrap">${ts ? esc(M.durationText(ts)) : `<span class="sub">${t.status === "pending" ? "waiting" : "no task span"}</span>`}</td></tr>`;
      }).join("") + `</tbody>`;
    // An unchanged table keeps its rows, so a poll leaves a focused row and the drawer's opener in place.
    if (html === taskTableHtml) return;
    const focused = document.activeElement && document.activeElement.classList.contains("task-link") ? document.activeElement : null;
    $("task-table").innerHTML = html;
    taskTableHtml = html;
    const again = reconnect(focused);
    if (again && again !== document.activeElement) again.focus({ preventScroll: true });
  }
  $("task-table").addEventListener("click", (e) => {
    const b = e.target.closest(".task-link");
    if (b) openTaskPopover(b.dataset.task, b);
  });

  // A task's details, anchored to the board card, graph node or task row that opened it: where it
  // stands, why it failed or stopped, and the way into its drawer.
  function taskFailureHtml(t) {
    const red = view.gates.filter((g) => g.task === t.id && g.failure);
    if (!t.blocked && !red.length) return "";
    const heading = red.length ? "Why it failed" : "Why it stopped";
    const gateOf = (rid) => gateBy[rid] || null;
    const rest = red.length > 1 ? `<p class="sub">+${plural(red.length - 1, "more RED gate run")} in the task drawer</p>` : "";
    return `<div class="pop-fail" role="group" aria-label="${heading}"><h4>${heading}</h4>${t.blocked ? blockHtml(t.blocked, gateOf, false) : ""}${red.length ? gateFailureHtml(red[red.length - 1], false) : ""}${rest}</div>`;
  }
  function openTaskPopover(id, anchor, focus = true) {
    const t = taskBy[id];
    if (!t || !anchor) return false;
    if (anchor === openAnchor && popKind === "task") { closePop(); return true; }
    const g = M.latestGate(view, id);
    const ts = taskSpan(id);
    const tags = (xs) => (xs.length ? `<span class="tags">${xs.map((x) => `<span class="tag">${esc(x)}</span>`).join("")}</span>` : null);
    const deps = t.deps || [], commits = t.commits || [], covers = t.covers || [];
    const rows = (t.brief ? [["goal", t.brief.title]] : []).concat([
      ["status", t.status, `<span class="chip ${statusChip[t.status] || "plain"}">${esc(t.status)}</span>`],
      ["column", laneMap()[id] || "queued"],
      ["worker", [t.model, ts ? M.durationText(ts) : t.status === "pending" ? "waiting" : "no task span"].filter(Boolean).join(" · ")],
      ["deps", "none", tags(deps)],
      ["latest gate", "none", g ? `${verdictChip(g.verdict)} <span class="mono">${esc(g.runId)}</span>` : null],
      ...(t.failureReason ? [["failure reason", t.failureReason]] : []),
      ["commits", "none yet", tags(commits)],
      ["covers", "none", tags(covers)]
    ]);
    openPopover(anchor, rows, id, `${taskFailureHtml(t)}${moduleTaskHtml(id)}<button type="button" class="link-btn pop-open" data-open-task="${esc(id)}">Open task</button>`, focus);
    popKind = "task";
    pinned = true;
    return true;
  }

  // Tabs. Each has an id, which is its #token in the URL, a label, the badges it shows and a panel.
  // The core adds its own here; a module adds one through runViewer.addTab, after the core's.
  const tablist = $("tabs");
  const tabs = new Map();
  let selectedTab = null;
  const hashTab = () => { try { return decodeURIComponent(location.hash.slice(1)); } catch (_) { return ""; } };
  // The tab the reader asked for, by link or click; an unknown or unavailable one shows Overview.
  let wantedTab = hashTab();
  const failedBadges = new Set();

  function paintTab(tab) {
    let list = [];
    if (view && tab.badges) {
      try { list = tab.badges(view) || []; } catch (error) {
        if (!failedBadges.has(tab.id)) {
          failedBadges.add(tab.id);
          pageDamage.push({ source: "tab " + tab.id, reason: "badges: " + String(error && error.message ? error.message : error) });
          renderFooter();
        }
      }
    }
    tab.button.querySelector(".tab-badges").innerHTML = list.map((b) =>
      `<span class="badge ${esc(b.kind)}" data-key="${esc(b.key)}" data-n="${esc(b.n)}" title="${esc(b.title || b.text)}">${esc(b.text)}</span>`).join("");
    tab.button.setAttribute("aria-label", [tab.label].concat(list.map((b) => b.text)).join(", "));
  }

  function showTab(id) {
    closePop(false);
    selectedTab = id;
    tabs.forEach((t) => {
      const on = t.id === id;
      t.panel.hidden = !on;
      t.button.setAttribute("aria-selected", String(on));
      t.button.tabIndex = on ? 0 : -1;
    });
    document.body.dataset.tab = id;
    const tab = tabs.get(id);
    if (tab.shown && view) tab.shown();
  }

  // Hides a tab with nothing to show, and keeps the selection unless it went away.
  function syncTabs() {
    tabs.forEach((t) => { t.button.hidden = !t.available(); });
    const open = (id) => tabs.has(id) && !tabs.get(id).button.hidden;
    const pick = open(wantedTab) ? wantedTab : open("overview") ? "overview" : [...tabs.keys()].find(open);
    if (pick && pick !== selectedTab) showTab(pick);
  }

  function addTab(id, spec) {
    if (tabs.has(id)) throw new Error(`tab ${id} is already added`);
    let panel = document.querySelector(`.tab-panel[data-tab="${CSS.escape(id)}"]`);
    if (!panel) {
      panel = document.createElement("div");
      panel.className = "tab-panel";
      panel.dataset.tab = id;
      panel.hidden = true;
      pop.before(panel);
    }
    panel.id = "tab-" + id;
    panel.setAttribute("role", "tabpanel");
    panel.setAttribute("aria-labelledby", "tab-btn-" + id);
    const button = document.createElement("button");
    button.type = "button";
    button.className = "tab";
    button.id = "tab-btn-" + id;
    button.dataset.tab = id;
    button.tabIndex = -1;
    button.setAttribute("role", "tab");
    button.setAttribute("aria-controls", panel.id);
    button.setAttribute("aria-selected", "false");
    button.innerHTML = `<span>${esc(spec.label)}</span><span class="tab-badges"></span>`;
    tablist.appendChild(button);
    const tab = { id, label: spec.label, badges: spec.badges || null, shown: spec.shown || null, available: spec.available || (() => true), panel, button };
    tabs.set(id, tab);
    paintTab(tab);
    syncTabs();
    return panel;
  }

  function chooseTab(id, focus) {
    wantedTab = id;
    // A plain #token is the 1 part of a link that survives publishing; a sandbox may refuse it.
    try { if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id); } catch (_) {}
    syncTabs();
    if (focus) tabs.get(id).button.focus();
  }
  tablist.addEventListener("click", (e) => { const b = e.target.closest("[role=tab]"); if (b) chooseTab(b.dataset.tab, false); });
  tablist.addEventListener("keydown", (e) => {
    const b = e.target.closest("[role=tab]");
    if (!b) return;
    const ids = [...tabs.values()].filter((t) => !t.button.hidden).map((t) => t.id);
    const i = ids.indexOf(b.dataset.tab);
    const next = { ArrowRight: ids[(i + 1) % ids.length], ArrowLeft: ids[(i - 1 + ids.length) % ids.length], Home: ids[0], End: ids[ids.length - 1] }[e.key];
    if (!next) return;
    e.preventDefault();
    chooseTab(next, true);
  });
  const followHash = () => { wantedTab = hashTab(); syncTabs(); };
  window.addEventListener("hashchange", followHash);
  window.addEventListener("popstate", followHash);

  let coreBadges = {};
  function paintTabs() {
    if (!view) return;
    const stallMin = typeof view.run.stallMin === "number" ? view.run.stallMin : null;
    coreBadges = M.tabBadges(view, { now: liveNowMs(), stallMin });
    tabs.forEach(paintTab);
  }
  [["overview", "Overview"], ["timeline", "Timeline"], ["board", "Board"], ["graph", "Graph"], ["spec", "Spec"], ["gates", "Gates"], ["tokens", "Tokens"]].forEach(([id, label]) => {
    // The board and graph are optional modules: their tab shows once the module draws.
    const mount = document.querySelector(`.tab-panel[data-tab="${id}"] [data-module]`);
    addTab(id, {
      label,
      badges: () => coreBadges[id] || [],
      available: mount ? () => !mount.hidden : undefined,
      // A hidden track measured 0 wide, so it sizes again once it shows.
      shown: id === "timeline" ? sizeTrack : undefined
    });
  });

  // footer: every damage row is a visible line, never a silent gap
  function renderFooter() {
    const damage = (view ? view.damage : []).concat(pageDamage);
    $("foot").innerHTML = `<span>RunView schema ${view ? esc(view.schemaVersion) : "none"}</span><span>damage: ${damage.length ? damage.length : "none"}</span><span>plan text, ids, counts, times and repo-relative paths; no source or transcripts</span>` +
      damage.map((d) => `<span class="damage-line">${esc(d.source)}: ${esc(d.reason)}</span>`).join("");
  }

  // Optional modules (board, graph) render into their own hidden panel. One that throws is shown
  // as a damage line and its panel stays hidden, so it can't blank the core regions.
  const modules = new Map();
  function runModule(name, step) {
    const mod = modules.get(name);
    const mount = document.querySelector(`[data-module="${CSS.escape(name)}"]`);
    if (!mod || !mount || !view) return;
    try {
      if (step === "render") mod.render(view, mount); else if (mod.apply) mod.apply(view);
      mount.hidden = false;
    } catch (error) {
      mount.hidden = true;
      pageDamage.push({ source: "module " + name, reason: String(error && error.message ? error.message : error) });
      renderFooter();
    }
    syncTabs();
  }
  // What each module adds to a task's popover; a module that throws adds a damage line instead.
  function moduleTaskHtml(id) {
    let html = "";
    modules.forEach((mod, name) => {
      if (!mod.taskHtml) return;
      try {
        html += mod.taskHtml(view, id) || "";
      } catch (error) {
        pageDamage.push({ source: "module " + name, reason: String(error && error.message ? error.message : error) });
        renderFooter();
      }
    });
    return html;
  }
  function register(name, mod) {
    modules.set(name, mod);
    runModule(name, "render");
  }

  // now strip: live mode only, 1 card per running task with stall and halt badges
  let strip = null;
  function ensureStrip() {
    if (strip) return strip;
    strip = document.createElement("section");
    strip.className = "panel now";
    strip.id = "now";
    strip.setAttribute("aria-label", "Now");
    strip.innerHTML = `<div class="head"><h2>Now</h2><span class="now-note" id="now-note"></span></div><div class="now-cards" id="now-cards" role="list"></div>`;
    $("summary").after(strip);
    return strip;
  }
  const stageLabel = (w) => {
    if (w.phase === "gate") { const g = w.gateRun && gateBy[w.gateRun]; return g ? "gate " + M.gateTier(g.command) : "gate"; }
    return w.phase === "task" ? "starting" : w.phase.replace(/-/g, " ");
  };
  const age = (msAgo) => (msAgo < 60000 ? Math.max(0, Math.round(msAgo / 1000)) + "s ago" : fmtMs(msAgo) + " ago");

  function renderNow() {
    if (!liveMode) return;
    ensureStrip();
    const now = Date.now();
    // Without the preset's stall_min there is nothing to measure a stall against, so the strip says so.
    const stallMin = typeof view.run.stallMin === "number" ? view.run.stallMin : null;
    const cards = M.workers(view, now, stallMin == null ? Infinity : stallMin);
    const runHalts = M.openHalts(view).filter((h) => h.task == null);
    $("now-note").innerHTML = (stallMin == null ? `<span class="sub">stall watch off: the run names no stall_min</span>` : `<span class="sub">stalled after ${plural(stallMin, "minute")} quiet</span>`) +
      runHalts.map((h) => `<span class="chip bad">run halted: ${esc(h.reason)}</span>`).join("");
    $("now-cards").innerHTML = cards.length ? cards.map((w) => `<div class="now-card${w.halted ? " halted" : w.stalled ? " stalled" : ""}" role="listitem" data-task="${esc(w.task)}">
        <div class="now-top"><b class="mono">${esc(w.task)}</b>${w.halted ? `<span class="chip bad" title="${esc(w.halt.reason)}">halted</span>` : ""}${w.stalled ? `<span class="chip warn">stalled</span>` : ""}</div>
        <div class="now-stage"><span>${esc(stageLabel(w))}</span><span class="num">${esc(fmtMs(w.elapsedMs))}</span></div>
        <div class="sub num">last event ${w.lastEventMs == null ? "none" : esc(age(now - w.lastEventMs))}</div>
      </div>`).join("") : `<p class="sub">idle: no task running</p>`;
  }

  function render() {
    derive();
    renderHeader();
    renderNow();
    renderTaskTable();
    renderTimeline();
    renderSpec();
    renderProof();
    renderTokens();
    renderGates();
    renderFooter();
    paintTabs();
  }

  // Merges a partial RunView by id and redraws; live mode calls this on each poll.
  // A redraw keeps what the reader had: the open span popover, the focused bar, and the drawer's
  // focus and folds, so a 1 s poll never pulls them away.
  function apply(partial) {
    view = M.apply(view, partial);
    const active = document.activeElement;
    const popSpan = openAnchor && openAnchor.classList.contains("bar") ? openAnchor.dataset.id : null;
    const popFocus = pop.contains(active);
    const barFocus = active && active.classList && active.classList.contains("bar") ? active.dataset.id : null;
    const drawerFocusables = () => [...drawer.querySelectorAll("#dr-body button, #dr-body summary")];
    const drawerFocus = drawerId ? drawerFocusables().indexOf(active) : -1;
    const folds = drawerId ? [...drawer.querySelectorAll("#dr-body details")].map((d) => d.open) : [];
    const wasPinned = pinned;
    const popTask = popKind === "task" ? { id: openAnchor.dataset.task, anchor: openAnchor } : null;
    closePop(false);
    render();
    modules.forEach((_, name) => runModule(name, "apply"));
    const bar = (id) => (id ? tl.querySelector(`.bar[data-id="${CSS.escape(id)}"]`) : null);
    restoring = true;
    if (barFocus && bar(barFocus)) bar(barFocus).focus({ preventScroll: true });
    restoring = false;
    if (popSpan && bar(popSpan)) {
      openSpan(bar(popSpan), popFocus);
      pinned = wasPinned;
    }
    const taskAnchor = popTask && taskBy[popTask.id] ? reconnect(popTask.anchor) : null;
    if (taskAnchor) openTaskPopover(popTask.id, taskAnchor, popFocus);
    if (drawerId) {
      renderDrawer(drawerId);
      drawer.querySelectorAll("#dr-body details").forEach((d, i) => { if (folds[i]) d.open = true; });
      if (drawerFocus >= 0 && drawerFocusables()[drawerFocus]) drawerFocusables()[drawerFocus].focus({ preventScroll: true });
    }
  }

  // live mode: fetch the whole view once, then merge each change set polled after its cursor
  const POLL_MS = 1000;
  let polls = 0, pollFailures = 0;
  async function fetchJSON(path) {
    const response = await fetch(path, { cache: "no-store" });
    if (!response.ok) throw new Error(`${path.split("?")[0]} answered ${response.status}`);
    return response.json();
  }
  function showLiveError(message) {
    let line = $("live-error");
    if (!line) {
      line = document.createElement("div");
      line.id = "live-error";
      line.className = "live-error";
      line.setAttribute("role", "status");
      $("topbar").appendChild(line);
    }
    line.textContent = message || "";
    line.hidden = !message;
  }
  async function poll() {
    try {
      if (!view) {
        view = await fetchJSON("/view.json");
        render();
        modules.forEach((_, name) => runModule(name, "render"));
      } else {
        apply(await fetchJSON("/changes?after=" + encodeURIComponent(view.cursor)));
      }
      polls++;
      document.body.dataset.polls = String(polls);
      showLiveError(null);
    } catch (error) {
      pollFailures++;
      document.body.dataset.pollFailures = String(pollFailures);
      showLiveError(`live updates paused: ${error.message}; retrying every second`);
    }
    setTimeout(poll, POLL_MS);
  }

  window.runViewer = {
    register,
    addTab,
    // `extraHtml` follows the rows; the module that passes it escapes what it holds.
    openPopover: (anchor, rows, title, extraHtml) => { openPopover(anchor, rows.map(([k, v]) => [k, v]), title, extraHtml || ""); popKind = "other"; },
    openTaskPopover: (id, anchor) => openTaskPopover(id, anchor),
    // The element the open popover is anchored to; `null` when none is open.
    popoverAnchor: () => openAnchor,
    openTaskDrawer,
    apply
  };

  // The core draws once every module script has run, so Overview can read the board's lanes.
  function start() {
    if (liveMode) {
      document.body.dataset.live = "on";
      $("mode").textContent = "Live";
      renderFooter();
      poll();
    } else if (view) render(); else renderFooter();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();

</script>
<script>
// The board module: 1 card per task in queued, building, gating, review, merged, or the blocked
// lane. Loaded after the core page as a classic script; it publishes `RunViewBoard` and registers
// with the page when the page is there.
(function (root) {
  const LANES = ["queued", "building", "gating", "review", "merged", "blocked"];
  const BLOCKED = new Set(["blocked", "needs-replan", "abandoned"]);
  // An open merge span is still waiting on its merge gate, so it reads as review, not merged.
  const STAGE = { worker: "building", fix: "building", verify: "gating", gate: "gating", review: "review", merge: "review" };
  const ms = (iso) => (iso == null ? null : Date.parse(iso));

  function laneFor(task, own, halted) {
    if (halted || BLOCKED.has(task.status)) return "blocked";
    if (task.status === "done") return "merged";
    const open = own.filter((s) => s.end == null && STAGE[s.phase]).sort((a, b) => ms(b.start) - ms(a.start));
    if (open.length) return STAGE[open[0].phase];
    return task.status === "in-progress" ? "building" : "queued";
  }

  // The verdict of the task's latest finished gate span, else of its last gate record.
  function lastGate(task, own, gateBy, gates) {
    const ran = own.filter((s) => s.phase === "gate" && s.gateRun && s.end != null).sort((a, b) => ms(a.start) - ms(b.start));
    const last = ran[ran.length - 1];
    if (last) return gateBy[last.gateRun] ? gateBy[last.gateRun].verdict : last.outcome === "red" ? "RED" : "GREEN";
    const records = gates.filter((g) => g.task === task.id);
    return records.length ? records[records.length - 1].verdict : null;
  }

  function elapsed(task, own, cut) {
    const fmtMin = root.RunViewModel.fmtMin;
    if (!own.length) return "waiting";
    const taskSpan = own.find((s) => s.phase === "task");
    const start = taskSpan ? ms(taskSpan.start) : Math.min(...own.map((s) => ms(s.start)));
    let end = taskSpan && taskSpan.end != null ? ms(taskSpan.end) : ms(task.mergedAt);
    if (end == null) end = own.every((s) => s.end != null) && !taskSpan ? Math.max(...own.map((s) => ms(s.end))) : cut;
    return fmtMin(Math.max(0, end - start) / 60000);
  }

  // Each lane's cards in the view's task order. `now` cuts open spans; it defaults to the run's last
  // event, as the timeline does.
  function columns(view, now) {
    const cut = now != null ? now : root.RunViewModel.lastEventMs(view);
    const spans = view.spans || [];
    const gates = view.gates || [];
    const gateBy = Object.fromEntries(gates.map((g) => [g.runId, g]));
    const halted = new Set((view.halts || []).filter((h) => h.task != null && h.answer == null && h.waitMs == null).map((h) => h.task));
    const out = Object.fromEntries(LANES.map((lane) => [lane, []]));
    (view.tasks || []).forEach((task) => {
      const own = spans.filter((s) => s.task === task.id);
      const lane = laneFor(task, own, halted.has(task.id));
      out[lane].push({
        id: task.id, lane, model: task.model, elapsed: elapsed(task, own, cut),
        lastGate: lastGate(task, own, gateBy, gates), covers: task.covers || []
      });
    });
    return out;
  }

  root.RunViewBoard = { LANES, columns };

  const runViewer = root.runViewer;
  if (!runViewer || typeof document === "undefined") return;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const verdictChip = (v) => `<span class="chip ${v === "GREEN" ? "ok" : v === "RED" ? "bad" : "warn"}">${esc(v)}</span>`;
  const laneColour = { queued: "--muted", building: "--bar-worker", gating: "--warn", review: "--bar-review", merged: "--ok", blocked: "--bad" };

  let board = null, note = null;
  const lanes = {};
  // Cards persist by task id, so a card that moves keeps its focus and stays the drawer's opener.
  const cards = new Map();

  function build(mount) {
    mount.innerHTML = `<div class="head" style="justify-content:space-between"><h2>Board</h2></div>
      <p class="sub board-note"></p>
      <div class="board-scroll" tabindex="0" aria-label="Task board, scrolls horizontally"><div class="board"></div></div>`;
    note = mount.querySelector(".board-note");
    board = mount.querySelector(".board");
    LANES.forEach((lane) => {
      const el = document.createElement("div");
      el.className = "lane" + (lane === "blocked" ? " blocked" : "");
      el.setAttribute("role", "group");
      el.dataset.lane = lane;
      board.appendChild(el);
      lanes[lane] = el;
    });
    cards.clear();
    board.addEventListener("click", (e) => {
      const c = e.target.closest(".card");
      if (c) runViewer.openTaskPopover(c.dataset.task, c);
    });
  }

  function cardFor(c) {
    let el = cards.get(c.id);
    if (!el) {
      el = document.createElement("button");
      el.type = "button";
      el.className = "card";
      el.dataset.task = c.id;
      el.setAttribute("aria-haspopup", "dialog");
      el.setAttribute("aria-expanded", "false");
      cards.set(c.id, el);
    }
    el.style.setProperty("--c", `var(${laneColour[c.lane]})`);
    el.setAttribute("aria-label", [c.id, c.lane, c.model, c.elapsed, `last gate ${c.lastGate || "none"}`].filter(Boolean).join(", "));
    el.innerHTML = `<span class="card-top"><span class="card-id">${esc(c.id)}</span>${c.model ? `<span class="chip plain">${esc(c.model)}</span>` : ""}</span>
      <span class="card-meta"><span class="num">${esc(c.elapsed)}</span>${c.lastGate ? verdictChip(c.lastGate) : `<span class="chip plain">no gate yet</span>`}</span>
      <span class="tags">${c.covers.length ? c.covers.map((t) => `<span class="tag">${esc(t)}</span>`).join("") : `<span class="sub card-none">no spec id</span>`}</span>`;
    return el;
  }

  function update(view) {
    const cut = root.RunViewModel.lastEventMs(view);
    const byLane = columns(view, cut);
    const focused = document.activeElement;
    const seen = new Set();
    LANES.forEach((lane) => {
      const inLane = byLane[lane];
      const head = document.createElement("div");
      head.className = "lane-head";
      head.innerHTML = `<span>${lane}</span><span class="num">${inLane.length}</span>`;
      const body = inLane.length ? inLane.map((c) => { seen.add(c.id); return cardFor(c); }) : [Object.assign(document.createElement("div"), { className: "lane-empty", textContent: lane === "blocked" ? "no halts" : "empty" })];
      lanes[lane].setAttribute("aria-label", `${lane}, ${inLane.length} tasks`);
      lanes[lane].replaceChildren(head, ...body);
    });
    [...cards.keys()].forEach((id) => { if (!seen.has(id)) cards.delete(id); });
    if (focused && focused.classList.contains("card") && focused.isConnected && document.activeElement !== focused) focused.focus({ preventScroll: true });
    const fmtMin = root.RunViewModel.fmtMin;
    const at = fmtMin(Math.max(0, cut - ms(view.run.startedAt)) / 60000);
    const total = (view.tasks || []).length;
    note.textContent = view.run.state === "running"
      ? `Live at +${at}: ${total - byLane.merged.length} tasks in flight.`
      : `Final state at +${at}: ${byLane.merged.length} of ${total} merged, ${byLane.blocked.length} blocked.`;
  }

  runViewer.register("board", {
    render(view, mount) {
      if (!board || !mount.contains(board)) build(mount);
      update(view);
    },
    apply: update
  });
})(globalThis);

</script>
<script>
// The plan graph module: the tasks as a dependency graph in waves left to right, 1 node per task
// coloured by its board lane and 1 edge per dep. Loaded after the core page as a classic script;
// it publishes `RunViewGraph` and registers with the page when the page is there.
(function (root) {
  // A dep on an id outside `tasks` is left out here; the module reports it as a damage line.
  function cycleIn(tasks, by) {
    const state = new Map();
    const stack = [];
    let found = null;
    const visit = (id) => {
      state.set(id, "open");
      stack.push(id);
      for (const d of by.get(id).deps || []) {
        if (found) break;
        if (!by.has(d)) continue;
        if (state.get(d) === "open") found = stack.slice(stack.indexOf(d));
        else if (!state.has(d)) visit(d);
      }
      stack.pop();
      state.set(id, "done");
    };
    for (const t of tasks) {
      if (found) break;
      if (!state.has(t.id)) visit(t.id);
    }
    return found;
  }

  // Each task's wave is the length of its longest dep chain. Then 1 pass orders each wave by the
  // mean centred position of its deps, so edges from a wave's top tend to stay at the top.
  function layers(tasks) {
    const by = new Map(tasks.map((t) => [t.id, t]));
    const cycle = cycleIn(tasks, by);
    if (cycle) return { waves: [], cycle };
    const wave = new Map();
    const waveOf = (id) => {
      if (!wave.has(id)) {
        const known = (by.get(id).deps || []).filter((d) => by.has(d));
        wave.set(id, known.length ? 1 + Math.max(...known.map(waveOf)) : 0);
      }
      return wave.get(id);
    };
    const waves = [];
    tasks.forEach((t) => (waves[waveOf(t.id)] = waves[waveOf(t.id)] || []).push(t.id));
    const pos = new Map();
    waves.forEach((w, i) => {
      if (i > 0) {
        const key = (id) => {
          const known = (by.get(id).deps || []).filter((d) => pos.has(d));
          return known.reduce((a, d) => a + pos.get(d), 0) / known.length;
        };
        const keys = new Map(w.map((id) => [id, key(id)]));
        w.sort((a, b) => keys.get(a) - keys.get(b));
      }
      w.forEach((id, j) => pos.set(id, j - (w.length - 1) / 2));
    });
    return { waves, cycle: null };
  }

  root.RunViewGraph = { layers };

  const runViewer = root.runViewer;
  if (!runViewer || typeof document === "undefined") return;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ms = (iso) => (iso == null ? null : Date.parse(iso));
  // Plan stages come from phase spans; before tasks run spec-read, plan and contract, after them final.
  const PRE = ["spec-read", "plan", "contract"];
  const POST = ["final"];
  const STAGE_LABEL = { "spec-read": "spec read", plan: "plan", contract: "contract", final: "final" };
  const NW = 168, NH = 52, GX = 44, PAD = 20, ROW = 72;
  // A 12px monospace id fits about 18 characters in a node; the tooltip and label keep the whole id.
  const fit = (s) => (s.length > 18 ? s.slice(0, 17) + "…" : s);

  // Without the board module a task's lane comes from its status alone.
  function lanesOf(view) {
    const out = {};
    if (root.RunViewBoard) {
      const cols = root.RunViewBoard.columns(view);
      Object.keys(cols).forEach((lane) => cols[lane].forEach((c) => (out[c.id] = lane)));
      return out;
    }
    (view.tasks || []).forEach((t) => {
      out[t.id] = t.status === "done" ? "merged" : ["blocked", "needs-replan", "abandoned"].includes(t.status) ? "blocked" : t.status === "in-progress" ? "building" : "queued";
    });
    return out;
  }

  function stagesOf(view) {
    const out = {};
    (view.spans || []).forEach((s) => {
      if (!STAGE_LABEL[s.phase]) return;
      const st = out[s.phase] || (out[s.phase] = { phase: s.phase, start: ms(s.start), end: ms(s.end), open: false });
      st.start = Math.min(st.start, ms(s.start));
      if (s.end == null) st.open = true; else st.end = Math.max(st.end || 0, ms(s.end));
    });
    return out;
  }

  // The graph's nodes: plan stages present in the spans, chained around the tasks.
  function nodesOf(view) {
    const tasks = view.tasks || [];
    const ids = new Set(tasks.map((t) => t.id));
    const stages = stagesOf(view);
    const pre = PRE.filter((p) => stages[p]);
    const post = POST.filter((p) => stages[p]);
    const key = (p) => "@" + p;
    const nodes = [];
    pre.forEach((p, i) => nodes.push({ key: key(p), stage: stages[p], deps: i ? [key(pre[i - 1])] : [], stageDeps: true }));
    const depended = new Set(tasks.flatMap((t) => (t.deps || []).filter((d) => ids.has(d))));
    tasks.forEach((t) => {
      const known = (t.deps || []).filter((d) => ids.has(d));
      const lead = !known.length && pre.length ? [key(pre[pre.length - 1])] : [];
      nodes.push({ key: t.id, task: t, deps: lead.concat(known), lead: lead.length });
    });
    const sinks = tasks.filter((t) => !depended.has(t.id)).map((t) => t.id);
    post.forEach((p, i) => nodes.push({ key: key(p), stage: stages[p], deps: i ? [key(post[i - 1])] : sinks, stageDeps: true }));
    return nodes;
  }

  let mount = null, shape = null;

  function taskBits(n, lane) {
    const t = n.task;
    const files = t.writes.length + (t.writes.length === 1 ? " file" : " files");
    const title = t.brief && t.brief.title ? `${t.id}: ${t.brief.title}` : t.id;
    return { cls: `gnode ln-${lane}`, sub: `${files} · ${t.model}`, title, label: `${t.id}, ${lane}, writes ${files}, ${t.model}` };
  }
  function stageBits(n, cut) {
    const s = n.stage;
    const state = s.open ? "running" : "done";
    const sub = s.open ? `running ${root.RunViewModel.fmtMin(Math.max(0, cut - s.start) / 60000)}` : root.RunViewModel.fmtMin(Math.max(0, s.end - s.start) / 60000);
    const name = STAGE_LABEL[s.phase];
    return { cls: `gnode stage ln-${state === "done" ? "merged" : "building"}`, sub, title: `${name} stage`, label: `${name} stage, ${state}, ${sub}` };
  }

  function draw(view, nodes, waves) {
    const by = new Map(nodes.map((n) => [n.key, n]));
    const maxRows = Math.max(1, ...waves.map((w) => w.length));
    const GH = PAD * 2 + NH + (maxRows - 1) * ROW, mid = GH / 2;
    const GW = PAD * 2 + waves.length * NW + Math.max(0, waves.length - 1) * GX;
    waves.forEach((w, i) => w.forEach((k, j) => {
      const n = by.get(k);
      n.x = PAD + i * (NW + GX);
      // A lone node sits level with its deps; a crowded wave spreads around the middle.
      n.cy = w.length === 1 && n.deps.length ? n.deps.reduce((a, d) => a + by.get(d).cy, 0) / n.deps.length : mid + (j - (w.length - 1) / 2) * ROW;
    }));
    let svg = `<svg class="graph" viewBox="0 0 ${GW} ${GH}" style="min-width:${GW}px" role="group" aria-label="Plan dependency graph">
      <defs><marker id="graph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 L10 5 L0 10 z"/></marker></defs>`;
    nodes.forEach((n) => n.deps.forEach((d, i) => {
      const a = by.get(d), x1 = a.x + NW, x2 = n.x - 2, mx = (x1 + x2) / 2;
      const kind = n.stageDeps || i < (n.lead || 0) ? "stage" : "dep";
      svg += `<path class="edge ${kind}" d="M${x1} ${a.cy} C${mx} ${a.cy}, ${mx} ${n.cy}, ${x2} ${n.cy}" marker-end="url(#graph-arrow)"/>`;
    }));
    nodes.forEach((n) => {
      const attr = n.task ? `data-task="${esc(n.task.id)}" aria-haspopup="dialog" aria-expanded="false"` : `data-stage="${esc(n.stage.phase)}"`;
      const name = n.task ? n.task.id : STAGE_LABEL[n.stage.phase];
      svg += `<g class="gnode" tabindex="0" role="button" ${attr}><title></title>
        <rect class="box" x="${n.x}" y="${n.cy - NH / 2}" width="${NW}" height="${NH}" rx="8"/>
        <circle class="dot" cx="${n.x + 14}" cy="${n.cy - 8}" r="4"/>
        <text class="gid" x="${n.x + 24}" y="${n.cy - 4}">${esc(fit(name))}</text>
        <text class="gsub" x="${n.x + 24}" y="${n.cy + 14}"></text></g>`;
    });
    mount.querySelector(".graph-scroll").innerHTML = svg + `</svg>`;
  }

  // Classes, labels and tooltips change in place, so a focused node and the drawer's opener survive a poll.
  function paint(view, nodes) {
    const lanes = lanesOf(view);
    const cut = root.RunViewModel.lastEventMs(view);
    nodes.forEach((n) => {
      const el = n.task
        ? mount.querySelector(`.gnode[data-task="${CSS.escape(n.task.id)}"]`)
        : mount.querySelector(`.gnode[data-stage="${CSS.escape(n.stage.phase)}"]`);
      const bits = n.task ? taskBits(n, lanes[n.task.id] || "queued") : stageBits(n, cut);
      const keep = el.classList.contains("sel");
      el.setAttribute("class", bits.cls + (keep ? " sel" : ""));
      if (n.task) el.dataset.lane = lanes[n.task.id] || "queued";
      el.setAttribute("aria-label", bits.label);
      el.querySelector("title").textContent = bits.title;
      el.querySelector(".gsub").textContent = bits.sub;
    });
  }

  function stageRows(phase, view) {
    const s = stagesOf(view)[phase];
    const fmtMin = root.RunViewModel.fmtMin;
    const t0 = ms(view.run.startedAt);
    return [["stage", STAGE_LABEL[phase]], ["start", "+" + fmtMin(Math.max(0, s.start - t0) / 60000)],
      ["duration", s.open ? "running" : fmtMin(Math.max(0, s.end - s.start) / 60000)]];
  }

  let current = null;
  function open(g) {
    if (g.dataset.task) runViewer.openTaskPopover(g.dataset.task, g);
    else if (g.dataset.stage && current) runViewer.openPopover(g, stageRows(g.dataset.stage, current), STAGE_LABEL[g.dataset.stage]);
  }

  function build(m) {
    mount = m;
    shape = null;
    mount.innerHTML = `<div class="head" style="justify-content:space-between"><h2>Plan</h2>
        <div class="legend"><span style="--c:var(--ok)">merged</span><span style="--c:var(--accent)">building</span><span style="--c:var(--warn)">gating</span><span style="--c:var(--bar-review)">review</span><span style="--c:var(--bad)">blocked</span><span style="--c:var(--muted)">queued</span></div></div>
      <div class="graph-notes"></div>
      <div class="graph-scroll" tabindex="0" aria-label="Plan dependency graph, scrolls horizontally"></div>`;
    const scroll = mount.querySelector(".graph-scroll");
    scroll.addEventListener("click", (e) => { const g = e.target.closest(".gnode"); if (g) open(g); });
    scroll.addEventListener("keydown", (e) => {
      const g = e.target.closest(".gnode");
      if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(g); }
    });
  }

  function update(view) {
    current = view;
    const nodes = nodesOf(view);
    const ids = new Set((view.tasks || []).map((t) => t.id));
    const unknown = (view.tasks || []).flatMap((t) => (t.deps || []).filter((d) => !ids.has(d)).map((d) => `${t.id} → ${d}`));
    const { waves, cycle } = layers(nodes.map((n) => ({ id: n.key, deps: n.deps })));
    const notes = [];
    if (cycle) notes.push(`plan graph: dep cycle ${cycle.concat(cycle[0]).join(" → ")}; no graph drawn`);
    if (unknown.length) notes.push(`plan graph: dep on a task outside the plan, not drawn: ${unknown.join(", ")}`);
    mount.querySelector(".graph-notes").innerHTML = notes.map((n) => `<p class="damage-line">${esc(n)}</p>`).join("");
    if (cycle) {
      shape = null;
      mount.querySelector(".graph-scroll").replaceChildren();
      return;
    }
    const next = JSON.stringify(nodes.map((n) => [n.key, n.deps]));
    if (next !== shape) {
      const focused = document.activeElement;
      const refocus = focused && mount.contains(focused) ? (focused.dataset.task ? `[data-task="${CSS.escape(focused.dataset.task)}"]` : focused.dataset.stage ? `[data-stage="${CSS.escape(focused.dataset.stage)}"]` : null) : null;
      draw(view, nodes, waves);
      shape = next;
      const again = refocus && mount.querySelector(`.gnode${refocus}`);
      if (again) again.focus({ preventScroll: true });
    }
    paint(view, nodes);
  }

  runViewer.register("graph", {
    render(view, m) {
      if (mount !== m || !m.querySelector(".graph-scroll")) build(m);
      update(view);
    },
    apply: update
  });
})(globalThis);

</script>
<script>
// The Validation tab: a strip counting pass, red, unverified and waiting rows, the rows grouped
// by the task each runs after, then the kept XCUITest flows by flow and test. A red row opens "Why
// it failed"; an unverified row, or a flow missing its video or sheet, "Why unverified". A flow
// lists its steps, each linked to the video at its offset, and links its contact sheet. Evidence
// is linked or named by path, never embedded. Loaded after the core page as a classic script; it
// adds its tab, gives the task popover each task's rows, and registers with the page.
(function (root) {
  const M = root.RunViewModel;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const RESULT = { pass: "ok", red: "bad", unverified: "warn", waiting: "plain" };
  let current = null;
  let mount = null;
  // The rows on screen, by their group and row number, for the popover a button opens; the rows
  // of the open task popover are kept apart, since a re-render of the tab mustn't drop them.
  let shown = {};
  let inTask = {};

  const panel = runViewer.addTab("validation", {
    label: "Validation",
    badges: (view) => M.validationBadges(view),
    available: () => !!(current && current.validation && (current.validation.rows.length || (current.validation.keptFlows || []).length))
  });
  mount = document.createElement("section");
  mount.className = "panel";
  mount.setAttribute("aria-label", "Validation");
  mount.dataset.module = "validation";
  mount.hidden = true;
  panel.appendChild(mount);

  const chip = (result) => `<span class="chip ${RESULT[result] || "plain"}">${esc(result)}</span>`;
  const what = (row) => `${row.layer} check ${row.check != null ? row.check : "of row " + row.row}`;

  const gaps = (flow) => (flow ? [flow.videoUnverified, flow.sheetUnverified].some((g) => g != null) : false);
  const whyOf = (row) => (row.result === "red" ? "Why it failed" : row.result === "unverified" || gaps(row.flow) ? "Why unverified" : null);
  const whyButton = (why, key) => `<button type="button" class="link-btn qa-why" data-key="${esc(key)}" aria-haspopup="dialog" aria-expanded="false">${why}</button>`;
  const seconds = (ms) => (Math.max(0, ms) / 1000).toFixed(1) + " s";

  // A flow's steps with their marks, each linked to the video at its offset when there is a
  // video, then its contact sheet's link.
  function flowHtml(flow) {
    const steps = flow.steps.map((st) => {
      const label = `step ${st.n}${st.label != null ? " " + st.label : ""}`;
      const text = flow.video != null
        ? `<a class="qa-step-link" href="${esc(M.evidenceHref(flow.run, flow.video, st.offsetMs))}" target="_blank" rel="noopener">${esc(label)}</a>`
        : `<span>${esc(label)}</span>`;
      return `<li class="qa-step" data-n="${st.n}" data-ok="${st.ok}"><span class="qa-mark ${st.ok ? "ok" : "bad"}" role="img" aria-label="${st.ok ? "passed" : "failed"}">${st.ok ? "✓" : "✗"}</span>${text}<span class="sub num">${seconds(st.offsetMs)}</span></li>`;
    }).join("");
    const links = [
      flow.video != null ? `<a class="qa-video" href="${esc(M.evidenceHref(flow.run, flow.video))}" target="_blank" rel="noopener">video</a>` : `<span class="sub">no video</span>`,
      flow.sheet != null ? `<a class="qa-sheet" href="${esc(M.evidenceHref(flow.run, flow.sheet))}" target="_blank" rel="noopener">contact sheet</a>` : `<span class="sub">no contact sheet</span>`
    ].join(" · ");
    return `<div class="qa-flow"><ol class="qa-steps" aria-label="Flow steps">${steps}</ol><div class="qa-links">${links}</div></div>`;
  }

  function rowHtml(row, key) {
    const why = whyOf(row);
    return `<li class="qa-row" data-row="${row.row}" data-result="${esc(row.result)}">${chip(row.result)}
      <span class="mono">row ${row.row}</span><span class="qa-layer">${esc(row.layer)}</span>
      <span class="qa-req mono">${esc(row.requirement)}</span>
      ${row.check != null ? `<code class="qa-check">${esc(row.check)}</code>` : ""}
      <span class="sub num">${row.result === "waiting" ? "" : esc(M.fmtMs(row.ms))}</span>${why ? whyButton(why, key) : ""}${row.flow ? flowHtml(row.flow) : ""}</li>`;
  }

  function keptHtml(k, key) {
    const test = k.test != null ? k.test : "a test the guard dropped";
    const where = [`gate run <span class="mono">${esc(k.gateRun)}</span>`].concat(k.task != null ? [`task <span class="mono">${esc(k.task)}</span>`] : []).join(" · ");
    const ok = k.flow.steps.every((st) => st.ok);
    return `<li class="qa-kept-flow" data-test="${esc(test)}">${chip(ok ? "pass" : "red")}
      <code class="qa-check">${esc(test)}</code><span class="sub">${where}</span>${gaps(k.flow) ? whyButton("Why unverified", key) : ""}${flowHtml(k.flow)}</li>`;
  }

  function waitingHtml(row) {
    return `<li class="qa-row qa-waiting" data-row="${row.row}" data-result="waiting">${chip("waiting")}
      <span>waiting on ${row.waitingOn.map((t) => `<span class="mono">${esc(t)}</span>`).join(", ")}</span>
      <span class="sub">row ${row.row} · ${esc(row.layer)} · <span class="mono">${esc(row.requirement)}</span></span></li>`;
  }

  function render(view) {
    current = view;
    shown = {};
    const v = view.validation;
    if (!v) { mount.innerHTML = ""; return; }
    const c = v.counts;
    const strip = [["pass", c.pass], ["red", c.red], ["unverified", c.unverified], ["waiting", c.waiting]]
      .map(([k, n]) => `<div class="stat qa-count" data-result="${k}"><b class="num">${n}</b><span>${k}</span></div>`).join("");
    const groups = M.validationGroups(view).map((g, gi) => {
      const rows = g.rows.map((row) => { const key = gi + ":" + row.row; shown[key] = row; return rowHtml(row, key); });
      const title = g.task == null ? "no task named" : g.task;
      const task = g.task != null ? (view.tasks || []).find((t) => t.id === g.task) : null;
      return `<section class="qa-group" data-task="${esc(g.task == null ? "" : g.task)}" aria-label="${esc(title)}">
        <h3><span class="mono">${esc(title)}</span>${task ? ` <span class="chip plain">${esc(task.status)}</span>` : ""}</h3>
        <ul class="qa-rows">${rows.join("")}${g.waiting.map(waitingHtml).join("")}</ul></section>`;
    }).join("");
    const kept = M.keptFlowGroups(view).map((g, gi) => {
      const title = g.name == null ? "no flow named" : g.name;
      const flows = g.flows.map((k, fi) => { const key = "k:" + gi + ":" + fi; shown[key] = { kept: k }; return keptHtml(k, key); });
      return `<div class="qa-kept-group" data-flow="${esc(g.name == null ? "" : g.name)}"><h4 class="mono">${esc(title)}</h4><ul class="qa-rows">${flows.join("")}</ul></div>`;
    }).join("");
    const keptSection = kept ? `<section class="qa-group qa-kept" aria-label="Kept flows"><h3>Kept flows</h3>${kept}</section>` : "";
    mount.innerHTML = `<div class="head" style="justify-content:space-between"><h2>Validation</h2><span class="sub">plan <span class="mono">${esc(v.plan)}</span></span></div>
      <div class="stats qa-strip" aria-label="Validation counts">${strip}</div>${groups}${keptSection}`;
  }

  // The rows a task's popover lists: each row that runs after it, with its Why button.
  function taskHtml(view, id) {
    const v = view.validation;
    if (!v) return "";
    const rows = v.rows.filter((row) => row.runsAfter.includes(id));
    inTask = {};
    if (!rows.length) return "";
    const items = rows.map((row) => {
      const key = "t:" + id + ":" + row.row;
      inTask[key] = row;
      const why = whyOf(row);
      return `<li class="qa-row" data-row="${row.row}" data-result="${esc(row.result)}">${chip(row.result)}<span class="mono">row ${row.row}</span><span class="qa-layer">${esc(row.layer)}</span>${row.check != null ? `<code class="qa-check">${esc(row.check)}</code>` : ""}${why ? whyButton(why, key) : ""}</li>`;
    }).join("");
    return `<div class="pop-validation" role="group" aria-label="Validation rows"><h4>Validation rows</h4><ul class="qa-rows">${items}</ul></div>`;
  }

  const gapRows = (flow) => (flow ? [["video", flow.videoUnverified], ["contact sheet", flow.sheetUnverified]].filter(([, g]) => g != null).map(([k, g]) => [k, M.gapText(g)]) : []);
  const missing = (flow) => [flow.videoUnverified != null ? "the flow's video" : null, flow.sheetUnverified != null ? "the video's contact sheet" : null].filter(Boolean).join(" and ");

  // `anchor` is the button itself, or what the task popover was anchored to when the button sits
  // inside that popover, which this popover replaces.
  function open(button, anchor) {
    const entry = shown[button.dataset.key] || inTask[button.dataset.key];
    if (!entry) return;
    if (entry.kept) {
      const k = entry.kept;
      runViewer.openPopover(anchor, [
        ["test", k.test != null ? k.test : "not shown"],
        ["didn't run", missing(k.flow)],
        ...gapRows(k.flow),
        ["gate run", k.gateRun]
      ], "Why unverified");
      return;
    }
    const row = entry;
    const evidence = row.evidence.length ? row.evidence.join(", ") : "none saved";
    if (row.result === "red") {
      const output = row.output.length
        ? `<div class="qa-output" role="group" aria-label="Saved output"><h4>Saved output${row.outputCut ? `, last ${row.output.length} lines` : ""}</h4><pre>${esc(row.output.join("\n"))}</pre></div>`
        : `<p class="sub">no saved output</p>`;
      const failed = row.flow ? row.flow.steps.find((st) => !st.ok) : null;
      runViewer.openPopover(anchor, [
        ["requirement", row.requirement],
        ["layer", row.layer],
        ["check", row.check != null ? row.check : "not in the report"],
        ...(failed ? [["failing step", `step ${failed.n}${failed.label != null ? " " + failed.label : ""}`]] : []),
        ["exit status", row.exitStatus != null ? String(row.exitStatus) : "it never exited"],
        ["why", row.message != null ? row.message : "the report holds no reason"],
        ...gapRows(row.flow),
        ["evidence", evidence],
        ["qa run", row.qaRun]
      ], "Why it failed", output);
    } else if (row.result === "unverified") {
      runViewer.openPopover(anchor, [
        ["requirement", row.requirement],
        ["didn't run", what(row)],
        ["why", row.message != null ? row.message : "the report holds no reason"],
        ...gapRows(row.flow),
        ["qa run", row.qaRun]
      ], "Why unverified");
    } else {
      runViewer.openPopover(anchor, [
        ["requirement", row.requirement],
        ["didn't run", missing(row.flow)],
        ...gapRows(row.flow),
        ["result", `${row.result}: the row passes or fails on its steps alone`],
        ["qa run", row.qaRun]
      ], "Why unverified");
    }
  }
  mount.addEventListener("click", (e) => { const b = e.target.closest(".qa-why"); if (b) open(b, b); });
  document.getElementById("pop").addEventListener("click", (e) => {
    const b = e.target.closest(".qa-why");
    if (b) open(b, runViewer.popoverAnchor() || b);
  });

  runViewer.register("validation", { render: (view) => render(view), apply: (view) => render(view), taskHtml });
})(globalThis);

</script>
</body>
</html>
