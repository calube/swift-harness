<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Viewer</title>
<style>
/* Layout: summary header, optional module panels, full-width flame timeline in its own scroller, then a 2-column grid of spec, proof, tokens and gates that stacks at phone width. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --sunken: #eef0f4;
  --line: #dde1e8;
  --fg: #11181c;
  --muted: #5d6673;
  --accent: #006fee;
  --accent-soft: #e6f1fe;
  --ok: #12a150;
  --ok-soft: #e8faf0;
  --warn: #c4841d;
  --warn-soft: #fefce8;
  --bad: #d31248;
  --bad-soft: #fee7ef;
  --bar-phase: #7c8a9e;
  --bar-task: #3b82f6;
  --bar-worker: #60a5fa;
  --bar-review: #8b9dc3;
  --bar-gate: #12a150;
  --bar-red: #d31248;
  --bar-merge: #11181c;
  --bar-text: #ffffff;
  --label-1: #7c3aed; --label-2: #0e9f9a; --label-3: #d97706; --label-4: #db2777; --label-5: #2563eb;
  --shadow: rgba(16, 24, 40, .22);
  --scrim: rgba(17, 24, 28, .32);
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d10; --surface: #15181d; --sunken: #1d2128; --line: #2a2f38;
    --fg: #ecedee; --muted: #9aa3ae; --accent: #338ef7; --accent-soft: #10253e;
    --ok: #17c964; --ok-soft: #0e2a1b; --warn: #f5a524; --warn-soft: #2e2208;
    --bad: #f31260; --bad-soft: #3a0d1c;
    --bar-phase: #5b6676; --bar-task: #2f6fd6; --bar-worker: #4a8ae0; --bar-review: #6a7aa0;
    --bar-gate: #139a52; --bar-red: #d0104f; --bar-merge: #ecedee; --bar-text: #ffffff;
    --label-1: #a78bfa; --label-2: #2dd4bf; --label-3: #fbbf24; --label-4: #f472b6; --label-5: #60a5fa;
    --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d10; --surface: #15181d; --sunken: #1d2128; --line: #2a2f38;
  --fg: #ecedee; --muted: #9aa3ae; --accent: #338ef7; --accent-soft: #10253e;
  --ok: #17c964; --ok-soft: #0e2a1b; --warn: #f5a524; --warn-soft: #2e2208;
  --bad: #f31260; --bad-soft: #3a0d1c;
  --bar-phase: #5b6676; --bar-task: #2f6fd6; --bar-worker: #4a8ae0; --bar-review: #6a7aa0;
  --bar-gate: #139a52; --bar-red: #d0104f; --bar-merge: #ecedee; --bar-text: #ffffff;
    --label-1: #a78bfa; --label-2: #2dd4bf; --label-3: #fbbf24; --label-4: #f472b6; --label-5: #60a5fa;
    --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.wrap > * { min-width: 0; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
h1 { font-size: 20px; margin: 0; font-weight: 600; text-wrap: balance; }
h2 { font-size: 12px; margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.panel > *, .cols > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.plain { background: var(--sunken); color: var(--muted); }
.chip.plain::before { display: none; }

/* header */
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.head .meta { color: var(--muted); overflow-wrap: anywhere; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.stat { background: var(--sunken); border-radius: var(--radius-md); padding: 10px 12px; }
.stat b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }

/* timeline */
.tl-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.tl-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tl { position: relative; min-width: 900px; }
.tl-row { display: grid; grid-template-columns: 190px 1fr; height: 24px; align-items: center; border-bottom: 1px solid var(--sunken); }
.tl-row:last-child { border-bottom: 0; }
.tl-label { position: sticky; left: 0; z-index: 2; background: var(--surface); height: 100%; display: flex; align-items: center; padding-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; border-right: 1px solid var(--line); }
.tl-track { position: relative; height: 100%; }
.bar { position: absolute; top: 3px; height: 17px; border-radius: 4px; color: var(--bar-text); font-size: 11px; line-height: 17px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 0; cursor: pointer; font-family: var(--font-ui); text-align: left; }
.bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.bar.sel { box-shadow: 0 0 0 2px var(--fg); }
/* Bars too narrow for their label drop the text; the title and popover still carry it. */
.bar.notext { font-size: 0; padding: 0; }
/* An open span is cut at the run's last event; the hatched end says it never closed. */
.bar.open { background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255, 255, 255, .28) 6px 9px); }
.axis { height: 26px; }
.axis .tick { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line); font-size: 11px; color: var(--muted); padding: 5px 0 0 4px; font-variant-numeric: tabular-nums; }
.grid-lines { position: absolute; inset: 26px 0 0 190px; pointer-events: none; }
.grid-lines i { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--sunken); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.tl-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; min-width: 0; }
.zoom { display: inline-flex; background: var(--sunken); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.zoom button { border: 0; background: transparent; color: var(--muted); font: 600 12px/1 var(--font-ui); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-variant-numeric: tabular-nums; }
.zoom button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* span popover: anchored to the clicked bar; a bottom sheet at phone width */
.pop { position: fixed; z-index: 20; top: 0; left: 0; width: min(360px, calc(100vw - 32px)); max-height: min(70vh, 520px); overflow-y: auto; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: 0 12px 32px var(--shadow); padding: 12px 14px 14px; display: grid; gap: 10px; }
.pop[hidden] { display: none; }
.pop-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
.pop-head h3 { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.pop-close { flex: none; border: 0; background: var(--sunken); color: var(--muted); width: 26px; height: 26px; border-radius: 50%; font-size: 16px; line-height: 1; cursor: pointer; }
.pop-close:hover { color: var(--fg); }
.pop-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pop dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.pop dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.pop dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pop h4 { margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pop-tools { display: grid; gap: 8px; border-top: 1px solid var(--sunken); padding-top: 10px; }
.pop-files { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.pop-files li { font-family: var(--font-mono); font-size: 11px; overflow-wrap: anywhere; }
.pop-files li.more { font-family: var(--font-ui); color: var(--muted); }
.pop .sub { color: var(--muted); font-size: 12px; margin: 0; }
/* why a span failed: the gate's tiers, gating findings and failing tests */
.pop-fail { display: grid; gap: 6px; border-top: 1px solid var(--sunken); padding-top: 10px; }
.pop-fail p, .dr-card .fail-line, .gate-fail p { margin: 0; }
.fail-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; }
.fail-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.fail-list li { display: grid; gap: 2px; min-width: 0; }
.fail-list li.more { color: var(--muted); font-size: 12px; }
.fail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; }
.fail-head .mono, .fail-msg .mono { overflow-wrap: anywhere; }
.fail-msg { font-size: 12px; color: var(--fg); overflow-wrap: anywhere; }
.pop code, .gate code { font-family: var(--font-mono); font-size: 11px; background: var(--sunken); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.dr-fail { display: grid; gap: 6px; border-top: 1px solid var(--sunken); padding-top: 10px; }
.gate-fail { display: grid; gap: 6px; }
@media (max-width: 520px) {
  .pop { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 75vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; border-bottom: 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}

/* grids and tables */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
.tbl-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--sunken); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td .sub { color: var(--muted); font-size: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-family: var(--font-mono); font-size: 11px; background: var(--sunken); border-radius: var(--radius-sm); padding: 1px 6px; }

/* tokens */
.tok-row { display: grid; grid-template-columns: 110px 1fr 70px; gap: 10px; align-items: center; font-size: 13px; }
.tok-bar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; background: var(--sunken); }
.tok-bar i { display: block; height: 100%; }
.tok-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.tok-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

/* gates */
.gate { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 10px 12px; display: grid; gap: 8px; }
.gate-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; }
.step { font-size: 11px; border-radius: var(--radius-sm); padding: 2px 7px; background: var(--ok-soft); color: var(--ok); font-variant-numeric: tabular-nums; }
.step.red { background: var(--bad-soft); color: var(--bad); }

footer { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
footer .damage-line { color: var(--bad); flex-basis: 100%; overflow-wrap: anywhere; }

/* task drawer: a ticket view that slides in from the right; a full-height sheet at phone width */
html.drawer-open { overflow: hidden; }
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; visibility: hidden; transition: opacity .2s, visibility 0s linear .2s; }
.scrim.open { opacity: 1; visibility: visible; transition: opacity .2s; }
.drawer { position: fixed; z-index: 31; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--bg); color: var(--fg); border-left: 1px solid var(--line); box-shadow: -16px 0 40px var(--shadow); overflow-y: auto; overscroll-behavior: contain; transform: translateX(100%); visibility: hidden; transition: transform .24s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .24s; }
.drawer.open { transform: none; visibility: visible; transition: transform .24s cubic-bezier(.2, .8, .2, 1); }
.dr-head { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; align-items: center; }
.dr-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--muted); min-width: 0; }
.dr-kicker .mono { font-weight: 500; overflow-wrap: anywhere; }
.dr-title { grid-column: 1 / -1; margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.dr-body { padding: 16px 20px 32px; display: grid; gap: 12px; }
.dr-body > * { min-width: 0; }
.dr-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.dr-card h4, .dr-fold summary { margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.dr-card p { margin: 0; overflow-wrap: anywhere; }
.dr-ref { color: var(--muted); font-size: 13px; }
.dr-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; overflow-wrap: anywhere; }
.dr-list li::marker { color: var(--muted); }
.drawer code { font-family: var(--font-mono); font-size: 12px; background: var(--sunken); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.props { margin: 0; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px 12px; font-size: 13px; align-items: baseline; }
.props dt { color: var(--muted); }
.props dd { margin: 0; min-width: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.props dd.block { display: block; }
.muted { color: var(--muted); }
.drawer .sub { color: var(--muted); font-size: 12px; margin: 0; }
.label-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-family: var(--font-mono); font-size: 11px; white-space: nowrap; }
.label-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.drawer summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; border-radius: 4px; }
.drawer summary::-webkit-details-marker { display: none; }
.drawer summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; flex: none; }
.drawer details[open] > summary::before { transform: rotate(45deg); }
.drawer summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ws summary { font-variant-numeric: tabular-nums; }
.ws .pop-files { margin-top: 6px; }
.dr-fold[open] { gap: 12px; }
.dr-fold:not([open]) { gap: 0; }
.links { display: grid; gap: 6px; }
.link-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; gap: 10px; font-size: 13px; }
.link-row > span { color: var(--muted); }
.link-btn { font: inherit; color: var(--fg); text-align: left; background: var(--sunken); border: 1px solid transparent; border-radius: var(--radius-sm); padding: 6px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; min-width: 0; }
.link-btn:hover { border-color: var(--line); }
.link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.link-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.link-btn .mono { flex: none; font-weight: 600; }
.link-btn .goal { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.act { list-style: none; margin: 0; padding: 0; display: grid; }
.act li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; position: relative; padding-bottom: 14px; font-size: 13px; }
.act li:last-child { padding-bottom: 0; }
.act li::before { content: ""; position: absolute; left: 6px; top: 16px; bottom: 0; width: 1px; background: var(--line); }
.act li:last-child::before { display: none; }
.act .dot { width: 9px; height: 9px; border-radius: 50%; margin: 5px 0 0 2px; background: var(--c, var(--muted)); }
.act .ev { min-width: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.act .ev .sub { flex-basis: 100%; color: var(--muted); font-size: 12px; }
.act time { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (max-width: 520px) {
  .drawer { width: 100%; border-left: 0; transform: translateY(100%); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .dr-head { padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px; }
  .dr-body { padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .dr-card { padding: 12px 14px; }
}
@media (max-width: 520px) {
  .tok-row { grid-template-columns: 84px 1fr 58px; }
  .tl-row { grid-template-columns: 132px 1fr; }
  .grid-lines { left: 132px; }
  .tl-label { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* now strip (live mode) and the failed-poll line */
.now-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.now-card { background: var(--sunken); border-radius: var(--radius-md); padding: 10px 12px; display: grid; gap: 4px; border-left: 3px solid var(--accent); min-width: 0; }
.now-card.stalled { border-left-color: var(--warn); }
.now-card.halted { border-left-color: var(--bad); }
.now-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.now-top b { overflow-wrap: anywhere; }
.now-stage { display: flex; justify-content: space-between; gap: 8px; }
.now-card .sub, .now .sub { color: var(--muted); font-size: 12px; margin: 0; }
.now-note { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.live-error { color: var(--bad); background: var(--bad-soft); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12px; }

</style>
<style>
/* board: 6 lanes that scroll horizontally inside their own box */
.board-scroll { overflow-x: auto; border-radius: var(--radius-md); }
.board-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(176px, 1fr)); gap: 8px; }
.lane { background: var(--sunken); border-radius: var(--radius-md); padding: 8px; display: grid; gap: 8px; align-content: start; min-height: 150px; min-width: 0; }
.lane.blocked { background: transparent; border: 1px dashed var(--line); }
.lane-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 2px 2px 0; }
.lane-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 4px; border: 1px dashed var(--line); border-radius: var(--radius-sm); }
.card { font: inherit; text-align: left; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--line)); border-radius: var(--radius-sm); padding: 8px 10px; display: grid; gap: 6px; cursor: pointer; width: 100%; min-width: 0; transition: box-shadow .12s; }
.card:hover { box-shadow: 0 0 0 1px var(--muted); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.sel { box-shadow: 0 0 0 2px var(--fg); }
.card-top, .card-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.card-id { font-family: var(--font-mono); font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
.card-meta .num { color: var(--muted); font-size: 12px; }
.board-note { margin: 0; color: var(--muted); font-size: 12px; }
.card-none { color: var(--muted); font-size: 12px; }

<style>
/* plan graph: layered left to right, scrolls inside its own box at narrow widths */
.graph-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-md); }
.graph-scroll:empty { display: none; }
.graph-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.graph { display: block; width: 100%; height: auto; }
.graph .edge { fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: .75; }
.graph .edge.stage { stroke-dasharray: 4 3; }
.graph .arrow { fill: var(--muted); }
.gnode { cursor: pointer; outline: none; --sc: var(--muted); --sf: var(--surface); }
.gnode .box { fill: var(--sf); stroke: var(--sc); stroke-width: 1.5; }
.gnode.stage .box { stroke-dasharray: 5 3; }
.gnode .dot { fill: var(--sc); }
.gnode .gid { fill: var(--fg); font: 600 12px var(--font-mono); }
.gnode .gsub { fill: var(--muted); font: 11px var(--font-ui); font-variant-numeric: tabular-nums; }
.gnode:hover .box { stroke-width: 2.5; }
.gnode:focus-visible .box { stroke: var(--accent); stroke-width: 3; }
.gnode.sel .box { stroke: var(--fg); stroke-width: 2.5; }
.gnode.ln-merged { --sc: var(--ok); --sf: var(--ok-soft); }
.gnode.ln-building { --sc: var(--accent); --sf: var(--accent-soft); }
.gnode.ln-gating { --sc: var(--warn); --sf: var(--warn-soft); }
.gnode.ln-review { --sc: var(--bar-review); --sf: color-mix(in srgb, var(--bar-review) 16%, var(--surface)); }
.gnode.ln-blocked { --sc: var(--bad); --sf: var(--bad-soft); }
.graph-notes:empty { display: none; }
.graph-notes .damage-line { margin: 0 0 8px; }

</style>

<script>
// Pure functions over a RunView: merging partials, laying out the timeline, and formatting.
// Loaded as a classic script so the report can inline it; it publishes one global.
(function (root) {
  // The key each RunView array merges on. A partial row replaces the row with the same key.
  const KEYS = {
    spec: (x) => x.id,
    tasks: (x) => x.id,
    roles: (x) => x.role,
    spans: (x) => x.id,
    gates: (x) => x.runId,
    proofs: (x) => x.gateRun + "\u0000" + x.test,
    halts: (x) => (x.task || "") + "\u0000" + x.at,
    damage: (x) => x.source + "\u0000" + x.reason
  };

  function mergeBy(rows, partial, key) {
    const out = rows.slice();
    const index = new Map(out.map((row, i) => [key(row), i]));
    partial.forEach((row) => {
      const k = key(row);
      if (index.has(k)) out[index.get(k)] = row;
      else { index.set(k, out.length); out.push(row); }
    });
    return out;
  }

  function apply(view, partial) {
    const out = Object.assign({}, view);
    Object.keys(partial || {}).forEach((field) => {
      const value = partial[field];
      out[field] = KEYS[field] && Array.isArray(value) ? mergeBy(view[field] || [], value, KEYS[field]) : value;
    });
    return out;
  }

  const ms = (iso) => (iso == null ? null : Date.parse(iso));

  // The run's last event: what an open span is cut at in the report.
  function lastEventMs(view) {
    const times = [ms(view.run.startedAt), ms(view.run.endedAt)];
    (view.spans || []).forEach((s) => times.push(ms(s.start), ms(s.end)));
    (view.halts || []).forEach((h) => times.push(ms(h.at)));
    (view.tasks || []).forEach((t) => times.push(ms(t.createdAt), ms(t.mergedAt)));
    return Math.max.apply(null, times.filter((t) => t != null && !Number.isNaN(t)));
  }

  function spanLabel(s) {
    if (s.phase === "run") return "build run";
    if (s.phase === "task") return s.task || "task";
    if (s.phase === "gate") return "gate";
    return s.phase.replace(/-/g, " ");
  }

  // Spans in minutes from the run's start, with open spans cut at the run's last event.
  function normalize(view, nowMs) {
    const t0 = ms(view.run.startedAt);
    const cut = nowMs != null ? nowMs : lastEventMs(view);
    const toMin = (t) => (t - t0) / 60000;
    const gateBy = {};
    (view.gates || []).forEach((g) => { gateBy[g.runId] = g; });
    const spans = (view.spans || []).map((s) => {
      const open = s.end == null;
      const g = s.gateRun && gateBy[s.gateRun];
      let label = spanLabel(s);
      if (s.phase === "gate" && g) label = "gate " + gateTier(g.command);
      return Object.assign({}, s, { start: toMin(ms(s.start)), end: toMin(open ? cut : ms(s.end)), open, label });
    });
    return { spans, wall: Math.max(0, toMin(cut)), t0 };
  }

  function gateTier(command) {
    const m = /--tier\s+(\S+)/.exec(command || "");
    return m ? m[1] : command || "";
  }

  // Greedy first-fit: each span takes the first row it doesn't overlap.
  function pack(spans) {
    const rows = [];
    spans.slice().sort((a, b) => a.start - b.start).forEach((s) => {
      const row = rows.find((r) => r[r.length - 1].end <= s.start);
      if (row) row.push(s); else rows.push([s]);
    });
    return rows;
  }

  // Timeline rows. A task's (or the final phase's) descendants share rows under it, so a worker's
  // whole story reads left to right; its gate runs add 1 row per tier, steps from the gate record.
  function lanes(spans, gates) {
    const byId = {};
    const kids = {};
    spans.forEach((s) => { byId[s.id] = s; });
    spans.forEach((s) => {
      const p = s.parent != null && byId[s.parent] ? s.parent : null;
      (kids[p] = kids[p] || []).push(s);
    });
    Object.keys(kids).forEach((k) => kids[k].sort((a, b) => a.start - b.start));
    const gateBy = {};
    (gates || []).forEach((g) => { gateBy[g.runId] = g; });
    const descendants = (s) => (kids[s.id] || []).reduce((acc, c) => acc.concat([c], descendants(c)), []);
    const rows = [];

    function gateRows(gs, depth) {
      const g = gateBy[gs.gateRun];
      if (!g || !g.steps || !g.steps.length) return;
      const minutes = g.ms / 60000;
      const factor = minutes > 0 ? (gs.end - gs.start) / minutes : 0;
      const tiers = [];
      g.steps.forEach((st) => { if (tiers.indexOf(st.tier) < 0) tiers.push(st.tier); });
      tiers.forEach((tier) => {
        let cursor = 0;
        const steps = g.steps.filter((st) => st.tier === tier).map((st) => {
          // A step with no start offset is laid end to end after the last and marked approximate.
          const approximate = st.startMs == null;
          const startMs = approximate ? cursor : st.startMs;
          cursor = startMs + st.ms;
          return {
            id: gs.id + ":" + tier + ":" + st.step, parent: gs.id, phase: "step", label: st.step,
            start: gs.start + (startMs / 60000) * factor, end: gs.start + ((startMs + st.ms) / 60000) * factor,
            outcome: st.verdict === "RED" ? "red" : "ok", gateRun: g.runId, task: gs.task, ms: st.ms, tier, approximate
          };
        });
        rows.push({ depth, label: tier + " · " + (g.verdict === "RED" ? "RED run" : "run") + " " + shortRun(g.runId), spans: steps });
      });
    }

    function walk(s, depth) {
      rows.push({ depth, spans: [s], label: s.label, isTask: s.phase === "task" });
      if (s.phase === "task" || s.phase === "final") {
        const all = descendants(s);
        pack(all).forEach((r, i) => rows.push({ depth: depth + 1, spans: r, label: i === 0 ? (s.phase === "task" ? "stages" : "gate") : "" }));
        all.filter((c) => c.phase === "gate" && c.gateRun).forEach((gs) => gateRows(gs, depth + 2));
      } else {
        (kids[s.id] || []).forEach((c) => walk(c, depth + 1));
      }
    }
    (kids.null || []).forEach((s) => walk(s, 0));
    return rows;
  }

  const ZOOMS = [1, 2, 4];
  const scale = (zoom, width) => width * (ZOOMS.indexOf(zoom) >= 0 ? zoom : 1);
  // Rough width of a bar label at 11px plus its 12px of padding.
  const labelFits = (text, px) => px >= String(text).length * 6.3 + 12;

  const sum = (t) => t.input + t.output + t.cacheRead + t.cacheWrite;
  const fmtTok = (n) => (n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : Math.round(n / 1e3) + "k");
  const fmtTokens = (t) => (t == null ? "pending" : fmtTok(sum(t)));
  const fmtMin = (m) => {
    const s = Math.round(m * 60);
    return s >= 60 ? Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s" : s + "s";
  };
  const fmtMs = (n) => fmtMin(n / 60000);
  const shortRun = (id) => (id && id.length > 15 ? id.slice(9, 15) + "…" + id.slice(-4) : String(id));
  const durationText = (s) => (s.open ? "never ended" : s.ms != null ? fmtMs(s.ms) : fmtMin(s.end - s.start));

  function blocks(view, id) {
    return (view.tasks || []).filter((t) => (t.deps || []).indexOf(id) >= 0).map((t) => t.id);
  }

  // A task's wave counts only task deps; a dep cycle stops at the task already being visited.
  function waveOf(view, id) {
    const byId = {};
    (view.tasks || []).forEach((t) => { byId[t.id] = t; });
    const memo = {};
    const visit = (tid, seen) => {
      if (memo[tid]) return memo[tid];
      const deps = (byId[tid] ? byId[tid].deps || [] : []).filter((d) => byId[d] && seen.indexOf(d) < 0);
      memo[tid] = deps.length ? 1 + Math.max.apply(null, deps.map((d) => visit(d, seen.concat([tid])))) : 1;
      return memo[tid];
    };
    return visit(id, []);
  }

  // A task's events in time order: created, worker and fix starts, gate verdicts, review, halts
  // and merge. `at` is milliseconds since the epoch.
  function activity(view, id) {
    const t = (view.tasks || []).find((x) => x.id === id);
    if (!t) return [];
    const events = [];
    if (t.createdAt) events.push({ at: ms(t.createdAt), kind: "created", text: "Created", c: "--muted" });
    const gateBy = {};
    (view.gates || []).forEach((g) => { gateBy[g.runId] = g; });
    const gatesSeen = {};
    (view.spans || []).filter((s) => s.task === id).forEach((s) => {
      if (s.phase === "worker") events.push({ at: ms(s.start), kind: "worker", text: "Worker started", sub: (t.model || "") + " build worker", c: "--bar-worker" });
      else if (s.phase === "fix") events.push({ at: ms(s.start), kind: "fix", text: "Fix started", sub: s.tools ? s.tools.files.length + " files touched" : "", c: "--warn" });
      else if (s.phase === "review") events.push({ at: ms(s.start), kind: "review", text: "Review started", c: "--bar-review" });
      else if (s.phase === "verify") events.push({ at: ms(s.start), kind: "verify", text: "Verify started", c: "--warn" });
      else if (s.phase === "gate" && s.gateRun) {
        gatesSeen[s.gateRun] = true;
        const g = gateBy[s.gateRun];
        const verdict = g ? g.verdict : s.outcome === "red" ? "RED" : "GREEN";
        const sub = (g ? gateTier(g.command) + " gate · " : "") + "run " + shortRun(s.gateRun);
        if (s.end == null) events.push({ at: ms(s.start), kind: "gate", text: "Gate running", sub, c: "--warn" });
        else events.push({ at: ms(s.end), kind: "gate", text: "Gate " + verdict, codes: g ? (g.failure && g.failure.findings.length ? g.failure.findings.map((x) => x.rule) : Object.keys(g.ruleCounts || {})) : [], sub, c: verdict === "RED" ? "--bad" : "--ok" });
      }
    });
    (view.halts || []).filter((h) => h.task === id).forEach((h) => {
      events.push({ at: ms(h.at), kind: "halt", text: "Halted", sub: h.reason + (h.gateRun ? " · gate run " + shortRun(h.gateRun) : ""), c: "--bad" });
    });
    if (t.mergedAt) {
      const g = gateBy[t.mergeGateRun];
      events.push({ at: ms(t.mergedAt), kind: "merge", text: "Merged", codes: t.commits || [], sub: g ? "merge gate " + g.verdict : "", c: "--fg" });
    }
    // At the same instant a verdict comes before the stage it starts: a RED gate, then its fix.
    const rank = (e) => (e.kind === "created" ? 0 : e.kind === "gate" && e.text !== "Gate running" ? 1 : 2);
    return events.filter((e) => e.at != null && !Number.isNaN(e.at)).sort((a, b) => a.at - b.at || rank(a) - rank(b));
  }

  // The tool summary of a span and every span under it, in the RunView `tools` shape.
  function toolSummary(spans, spanId) {
    const kids = {};
    let rootSpan = null;
    spans.forEach((s) => {
      if (s.id === spanId) rootSpan = s;
      (kids[s.parent] = kids[s.parent] || []).push(s);
    });
    if (!rootSpan) return null;
    const calls = {};
    const files = [];
    let otherCount = 0, total = 0, droppedPaths = 0, any = false;
    const walk = (s) => {
      if (s.tools) {
        any = true;
        s.tools.calls.forEach((c) => {
          const row = calls[c.tool] || (calls[c.tool] = { tool: c.tool, count: 0, ms: 0 });
          row.count += c.count;
          row.ms += c.ms;
        });
        otherCount += s.tools.otherCount || 0;
        total += s.tools.ms || 0;
        droppedPaths += s.tools.droppedPaths || 0;
        s.tools.files.forEach((f) => { if (files.indexOf(f) < 0) files.push(f); });
      }
      (kids[s.id] || []).forEach(walk);
    };
    walk(rootSpan);
    if (!any) return null;
    const sorted = Object.keys(calls).map((k) => calls[k]).sort((a, b) => b.count - a.count || (a.tool < b.tool ? -1 : 1));
    return { calls: sorted, otherCount, ms: total, files, droppedPaths };
  }

  // What explains a span's red or halted outcome: the RED gate run it is or names, the task's
  // block when it stopped there, and the run's halts. Null when nothing does.
  function failureOf(view, span) {
    const gates = {};
    (view.gates || []).forEach((g) => { gates[g.runId] = g; });
    const task = span.task != null ? (view.tasks || []).find((t) => t.id === span.task) : null;
    const runId = span.gateRun || span.causeGateRun || null;
    const gate = runId && gates[runId] && gates[runId].failure ? gates[runId] : null;
    const block = span.phase === "task" && task && task.blocked ? task.blocked : null;
    const halts = span.phase === "run" && span.outcome === "halted" ? openHalts(view) : [];
    if (!gate && !block && !halts.length) return null;
    return { gate, block, halts, gateOf: (id) => gates[id] || null };
  }

  // `file:line`, `file`, or null for a finding or test no file locates.
  const location = (file, line) => (file == null ? null : line == null ? file : file + ":" + line);

  // `text` cut to `max` characters with an ellipsis.
  const clip = (text, max) => (text.length > max ? text.slice(0, Math.max(0, max - 1)) + "…" : text);

  // Halts with no resume yet: the builder fills `answer` and `waitMs` only from a `build.resume`.
  const openHalts = (view) => (view.halts || []).filter((h) => h.answer == null && h.waitMs == null);

  // The newest time anything of a task happened: a span starting or ending, a halt or its resume.
  function lastTaskEventMs(view, id) {
    const times = [];
    (view.spans || []).filter((s) => s.task === id).forEach((s) => times.push(ms(s.start), ms(s.end)));
    (view.halts || []).filter((h) => h.task === id).forEach((h) => {
      times.push(ms(h.at));
      if (h.waitMs != null) times.push(ms(h.at) + h.waitMs);
    });
    const known = times.filter((t) => t != null && !Number.isNaN(t));
    return known.length ? Math.max.apply(null, known) : null;
  }

  // The now strip: 1 card per task with an open task span, naming its newest open stage.
  function workers(view, nowMs, stallMin) {
    const spans = view.spans || [];
    const halted = {};
    openHalts(view).forEach((h) => { if (h.task != null) halted[h.task] = h; });
    return spans.filter((s) => s.phase === "task" && s.task != null && s.end == null).map((ts) => {
      const stages = spans.filter((s) => s.task === ts.task && s.id !== ts.id && s.end == null)
        .sort((a, b) => ms(b.start) - ms(a.start));
      const stage = stages[0] || null;
      const last = lastTaskEventMs(view, ts.task);
      return {
        task: ts.task, phase: stage ? stage.phase : "task", gateRun: stage ? stage.gateRun : null,
        elapsedMs: nowMs - ms(ts.start), lastEventMs: last,
        stalled: last != null && nowMs - last > stallMin * 60000, halted: !!halted[ts.task],
        halt: halted[ts.task] || null
      };
    });
  }

  // Tasks whose open span has had no event of that task for `stallMin` minutes at `nowMs`.
  const stalls = (view, nowMs, stallMin) => workers(view, nowMs, stallMin).filter((w) => w.stalled).map((w) => w.task);

  root.RunViewModel = {
    apply, stalls, openHalts, workers, failureOf, location, clip, normalize, lanes, scale, labelFits, blocks, activity, waveOf, toolSummary, durationText,
    lastEventMs, gateTier, sum, fmtTok, fmtTokens, fmtMin, fmtMs, shortRun
  };
})(globalThis);
